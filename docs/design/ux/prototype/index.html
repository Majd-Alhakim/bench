<!--
  Low-fi, greyscale, clickable prototype. Phase 4 (UX), lean mode.
  Source of truth: docs/requirements/BRD.md v1.0. UX package: docs/design/ux/README.md.
  Rules: no brand colours, no external requests, plain HTML/CSS/JS, one file.
  Sample data is fictional: the founder's day-1 tree working on project "Bench" (dogfood).
-->
<style>
:root{
  --bg:#ffffff; --p1:#f6f6f6; --p2:#ececec; --p3:#dedede; --line:#c4c4c4;
  --mid:#8c8c8c; --ink2:#4d4d4d; --ink:#161616;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}
a{color:inherit}
.muted{color:var(--ink2)} .small{font-size:12px} .xs{font-size:11px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.hidden{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:48px auto 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--p1)}
.brand{font-weight:700;letter-spacing:.3px}
.brand small{font-weight:400;color:var(--ink2)}
.banner{grid-column:1/3}
.side{border-right:1px solid var(--line);background:var(--p1);overflow:auto;padding:8px}
.main{overflow:auto;padding:0 0 40px}
.app.setup{grid-template-columns:1fr}
.app.setup .side{display:none}
.app.setup .top,.app.setup .banner,.app.setup .main{grid-column:1/2}

.nav{list-style:none;margin:0;padding:0}
.nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border-radius:6px;cursor:pointer}
.nav button:hover{background:var(--p2)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.nav button:focus-visible{outline:2px solid #000}
.nav .sub button{padding-left:24px;font-size:13px}
.nav .label{padding:12px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;border:1px solid currentColor;font-size:11px;text-align:center}

/* Controls */
.btn{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--p2)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#333}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.lg{padding:10px 18px;font-size:15px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link:focus-visible{outline:2px solid #000}
input[type=text],input[type=number],textarea,select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
.err{border:1px solid var(--ink);border-left:6px solid var(--ink);background:var(--p2);padding:8px 10px;border-radius:6px}
.warn{border:1px dashed var(--ink);background:var(--p1);padding:8px 10px;border-radius:6px}
.ok{border:1px solid var(--line);background:var(--p1);padding:8px 10px;border-radius:6px}
.fielderr{font-size:12px;font-weight:600}

/* Tags (status is text, never colour alone) */
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--ink);border-radius:4px;padding:0 5px;line-height:17px;white-space:nowrap}
.tag.solid{background:var(--ink);color:#fff}
.tag.dash{border-style:dashed}
.tag.soft{border-color:var(--mid);color:var(--ink2);font-weight:600}

/* Cards and panels */
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
.card.flat{background:var(--p1)}
.pad{padding:16px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--p3);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600}
.skel{background:repeating-linear-gradient(90deg,var(--p2) 0 40px,var(--p1) 40px 80px);border-radius:4px;height:12px;margin:6px 0}

/* Annotation bar */
.ann{margin:0;padding:10px 20px;border-bottom:1px dashed var(--mid);background:repeating-linear-gradient(135deg,#fafafa 0 10px,#f3f3f3 10px 20px);font-size:12.5px}
.ann .k{font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.ann .states button{border:1px solid var(--mid);background:#fff;border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer}
.ann .states button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ann-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.msg.me{align-self:flex-end;background:var(--p2);border-color:var(--p3)}
.msg .who{font-weight:600;font-size:12px;margin-bottom:2px}
.msg .meta{margin-top:4px;font-size:11px;color:var(--ink2);display:flex;gap:8px}
.sys{align-self:stretch;font-size:12px;color:var(--ink2);border-top:1px dotted var(--mid);border-bottom:1px dotted var(--mid);padding:3px 6px;font-family:ui-monospace,Consolas,monospace}
.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--ink2);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.chip:hover{background:var(--p2)}
.cost{font-size:11px;color:var(--ink2)}
.scroll{max-height:440px;overflow:auto;padding-right:4px}

/* What needs me */
.wnm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wnm li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.wnm li.first{border:2px solid var(--ink)}
.wnm .t{font-weight:600}

/* Org tree */
.tree,.tree ul{list-style:none;margin:0;padding-left:22px;position:relative}
.tree{padding-left:0}
.tree ul li{position:relative;padding-left:14px}
.tree ul li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--mid)}
.tree ul li:last-child::before{bottom:auto;height:20px}
.tree ul li::after{content:"";position:absolute;left:0;top:20px;width:12px;border-top:1px solid var(--mid)}
.node{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink2);border-radius:8px;padding:6px 10px;margin:4px 0;background:#fff;cursor:pointer}
.node:hover{background:var(--p2)}
.node[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.node.loan{border-style:dashed}
.node.removed{opacity:.4;text-decoration:line-through}
.group{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-top:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--ink2);background:var(--p2);font-size:11px;font-weight:700;flex:none}
.av.lg{width:44px;height:44px;font-size:16px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--line);background:#fff;font-weight:600;margin-bottom:-1px}

/* Kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:160px}
.kcard{display:block;width:100%;text-align:left;border:1px solid var(--ink2);border-radius:6px;background:#fff;padding:7px 8px;margin-bottom:6px;cursor:pointer}
.kcard:hover{background:var(--p2)}
.kcard.blocked{border-width:2px;border-style:dashed}

/* Meters */
.bar{position:relative;height:14px;border:1px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;cursor:pointer}
.mini .bar{width:90px;height:8px}

/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;padding:0;list-style:none}
.steps li{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.steps li.on{border-color:var(--ink);background:var(--ink);color:#fff}
.steps li.done{border-color:var(--ink2);color:var(--ink)}

/* Modal + toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50}
.dialog{background:#fff;border:1px solid var(--ink);border-radius:10px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 14px;max-width:560px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.timer{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 12px}
details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:6px;background:#fff}
details summary{cursor:pointer}
.doc{max-width:720px;border:1px solid var(--line);border-radius:8px;padding:20px 26px;background:#fff}
.doc h2{border-bottom:1px solid var(--p3);padding-bottom:4px;margin-top:16px}
.wikilink{all:unset;cursor:pointer;border-bottom:1px dashed var(--ink);font-weight:600}
.wikilink:focus-visible{outline:2px solid #000}
.wikilink.unres{border-bottom-style:dotted;color:var(--ink2)}
.three{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:14px}
@media (max-width:1100px){.grid2,.three{grid-template-columns:1fr}.kan,.grid3{grid-template-columns:1fr}}
</style>
</head>

/* ============================================================
   Router
   ============================================================ */
function go(screen, params){
  clearTimers();
  S.prev = S.screen;
  S.screen = screen; S.params = params||null;
  if (screen==="agent"||screen==="live") S.agentId = params?.id || S.agentId;
  if (!S.agents[S.agentId]) S.agentId = "noor";
  if (screen==="agent") S.st.agent = {Active:"normal",Draft:"draft",Paused:"paused",Archived:"archived"}[S.agents[S.agentId].state] || "normal";
  if (screen==="live"){
    if (S.agentId!=="noor") S.st.live = S.agents[S.agentId].state==="Archived" ? "archived" : "idle";
    else if (S.st.live==="idle" && !S.run.cancelled) S.st.live = "running";
  }
  if (screen==="mem" && params?.scope) S.memScope = params.scope;
  if (screen==="dash") S.dashProject = params?.p || "bench";
  if (screen==="session" && params?.type) S.st.session = params.type==="debate" ? (S.debate.state==="open"?"debate":"decided") : params.type;
  render();
  $("#main").scrollTop = 0;
  $("#main").focus({preventScroll:true});
}
function render(){
  clearTimers(); // every render re-creates the timers it needs (AFTER hooks), so none pile up
  $("#app").classList.toggle("setup", !S.setupDone);
  renderTop(); renderSide(); renderAnn();
  $("#screen").innerHTML = (SCREENS[S.screen]||(()=>"<div class='pad'>Not found</div>"))();
  (AFTER[S.screen]||(()=>{}))();
}

  const failed = S.st.appr==="failed" && a.id==="a3";
  return `<article class="card" id="card-${a.id}" style="${focus?"border:2px solid var(--ink)":""}" aria-labelledby="t-${a.id}">
    <div class="row between"><div class="row"><span class="av" aria-hidden="true">${initials(ag.name)}</span><b id="t-${a.id}">${h(ag.name)} · ${h(a.action)}</b></div>
    <div class="row">${isOut?'<span class="tag solid">Outward: leaves your machine</span>':""}${isRes?'<span class="tag">Reserved: only you</span>':""}${isPay?'<span class="tag">Payment: agents never pay</span>':""}${a.kind==="work"?'<span class="tag soft">Work request</span>':""}</div></div>

     <dt class="muted">Exact target</dt><dd style="margin:0" class="mono">${h(a.target)}</dd>

    ${a.deputyNote?`<p class="xs muted">${h(a.deputyNote)}</p>`:""}
    ${failed?`<div class="err" role="alert">Approved at 09:02, then failed: <span class="mono">EBUSY: resource busy or locked, node_modules/.vite</span>. Noor was told; this counts as a failed attempt (1 of 2).</div>`:""}
    ${isOut?`<label class="f" style="margin-bottom:8px">Draft (edit before sending)<textarea id="draft-${a.id}">${h(a.draft)}</textarea></label>`:""}
    ${a.status!=="pending"?`<p class="small"><b>${a.status}</b></p>`: failed?"" : isPay ? `<div class="row"><button class="btn pri" data-act="apr" data-id="${a.id}" data-v="Marked done (paid outside Bench)">I paid outside Bench: mark done</button><button class="btn" data-act="apr" data-id="${a.id}" data-v="Declined: no payment">Don't pay</button></div>`
     : `<div class="row"><button class="btn pri" data-act="apr" data-id="${a.id}" data-v="${isOut?"Sent once":"Allowed once"}">${isOut?"Send this email":"Allow once"}</button>
        <button class="btn" ${isOut||isRes?'aria-disabled="true" disabled':""} data-act="apr" data-id="${a.id}" data-v="Always allowed (grant created)" aria-describedby="why-${a.id}">Always allow</button>

       ${isOut?`<p class="xs" id="why-${a.id}"><b>Why is "Always allow" off?</b> Every email to someone other than you needs you, one at a time. No standing rule can send email for you.</p>`:""}
       ${isRes?`<p class="xs" id="why-${a.id}"><b>Why is "Always allow" off?</b> Merging to main, deploying and releasing are reserved: they need you every time. Atlas can't approve them either.</p>`:""}`}
  </article>`;

function linkify(body){
  return h(body).replace(/\[\[([^\]]+)\]\]/g,(_,t)=>{ const k = NOTE_BY_TITLE(t); return k?`<button class="wikilink" data-act="openNote" data-id="${k}">${h(t)}</button>`:`<button class="wikilink unres" data-act="newNote" title="Create this note">${h(t)} (no note yet)</button>`; });
}
function backlinks(k){ const t = S.notes[k].title.toLowerCase(); return Object.keys(S.notes).filter(x=>x!==k && S.notes[x].body.toLowerCase().includes("[["+t+"]]")); }
function outlinks(k){ return [...S.notes[k].body.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]); }
function graphSVG(){
  const keys = Object.keys(S.notes); const n = keys.length, cx=300, cy=200, R=150;
  const pos = {}; keys.forEach((k,i)=>{ const a = (i/n)*Math.PI*2 - Math.PI/2; pos[k]=[cx+R*Math.cos(a), cy+R*Math.sin(a)]; });
  let lines = ""; keys.forEach(k=>outlinks(k).forEach(t=>{ const j = NOTE_BY_TITLE(t); if (j) lines += `<line x1="${pos[k][0]}" y1="${pos[k][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="#8c8c8c"/>`; }));
  const dots = keys.map(k=>{ const sel = k===S.memNote, nt = S.notes[k]; return `<g role="button" tabindex="0" aria-label="Open note ${h(nt.title)}" data-act="openNote" data-id="${k}" style="cursor:pointer">
     <circle cx="${pos[k][0]}" cy="${pos[k][1]}" r="${sel?12:8}" fill="${sel?"#161616":"#fff"}" stroke="#161616" stroke-width="1.5" ${nt.stale?'stroke-dasharray="3 2"':""}/>
     <text x="${pos[k][0]}" y="${pos[k][1]+(pos[k][1]>cy?26:-16)}" text-anchor="middle" font-size="11" fill="#161616">${h(nt.title.length>26?nt.title.slice(0,25)+"…":nt.title)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 600 400" width="100%" role="img" aria-label="Graph of ${n} notes and their links">${lines}${dots}</svg>`;
}
function scrMem(){
  const st = S.st.mem, k = S.memNote, nt = S.notes[k];
  const scopes = ["All","Global","Product team","Dev team","Private: Noor"];

   : st==="rebuilding" ? `<div class="warn" role="status"><b>The memory index is being rebuilt.</b> Showing the folder list; backlinks, graph and search come back in about a minute. Notes on disk are safe.</div><ul class="mono small" style="margin-top:8px">${Object.keys(S.notes).map(x=>`<li>memory/${x}.md</li>`).join("")}</ul>`
   : `<div class="row between"><h2 style="margin:0">${h(nt.title)}</h2><div class="row"><button class="btn sm" data-act="state" data-v="graph">Graph view</button>${S.memEdit?`<button class="btn sm pri" data-act="saveNote">Save note</button><button class="btn sm ghost" data-act="memEdit">Cancel</button>`:`<button class="btn sm pri" data-act="memEdit">Edit</button>`}</div></div>
     ${nt.stale?`<div class="warn" style="margin:8px 0"><b>Stale (flagged by the curator):</b> ${linkify(nt.stale)}<div class="row" style="margin-top:6px"><button class="btn sm" data-act="stale" data-v="Kept: flag cleared">Keep</button><button class="btn sm" data-act="memEdit">Update</button><button class="btn sm" data-act="stale" data-v="Merge proposed into Sprint 2 summary">Merge</button><button class="btn sm" data-act="stale" data-v="Deleted (only you can delete)">Delete</button></div></div>`:""}

     ${S.memEdit?`<label class="f">Note body (Markdown)<textarea id="noteBody" style="min-height:160px">${h(nt.body)}</textarea></label><p class="xs muted">Saved through the single memory writer; the source becomes "client".</p>`:`<div class="doc" style="padding:12px 16px">${linkify(nt.body)}</div>`}
     <p class="xs muted mono" style="margin-top:6px">memory/${k}.md · Obsidian-compatible</p>`;
  return `<div class="pad"><div class="row between"><div><h1>Memory</h1><p class="small muted">Everything your agents remember, as Markdown notes on your machine. 0 tokens to browse.</p></div><button class="btn ghost sm">Open folder in another editor</button></div>

      <h3>Scope</h3><div class="col">${scopes.map(s=>`<button class="btn sm ${S.memScope===s?"pri":"ghost"}" aria-pressed="${S.memScope===s}" data-act="memScope" data-v="${s}">${s}</button>`).join("")}</div>
      <label class="row small"><input type="checkbox" data-act="staleOnly" ${st==="stale"?"checked":""}> Stale only</label>
      <h3>Notes (${list.length})</h3><ul class="wnm">${list.map(x=>`<li style="${x===k?"border:2px solid var(--ink)":""}"><button class="link small" data-act="openNote" data-id="${x}">${h(S.notes[x].title)}</button><div class="xs muted">${S.notes[x].type} · ${S.notes[x].scope}${S.notes[x].stale?" · stale":""}</div></li>`).join("")||'<li class="small muted">No notes match. Try another word or scope.</li>'}</ul>
      <div class="card flat xs">Curator suggestions: 1 merge waiting. <button class="link xs" data-act="openNote" data-id="old-ci">Review</button></div>
    </aside>
    <section class="card">${center}</section>
    <aside class="card" aria-label="Links">${st==="rebuilding"||st==="graph"?'<p class="small muted">Backlinks appear with a note.</p>':`<h3>Backlinks (${backlinks(k).length})</h3><ul class="small">${backlinks(k).map(b=>`<li><button class="link" data-act="openNote" data-id="${b}">${h(S.notes[b].title)}</button></li>`).join("")||"<li class='muted'>No notes link here yet.</li>"}</ul>
      <h3>Links out (${outlinks(k).length})</h3><ul class="small">${outlinks(k).map(t=>`<li>${linkify("[["+t+"]]")}</li>`).join("")||"<li class='muted'>None</li>"}</ul>`}</aside>
   </div></div>`;
}

    ${[["Router: picks who replies in groups","Haiku"],["Curator: digests, dedupe, stale sweep","Haiku"],["Scheduler: runs routines","none (no LLM)"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input type="checkbox" checked aria-label="Show ${r[0].split(":")[0]} lines"></td></tr>`).join("")}</tbody></table></section>
   <section class="card" style="margin-top:12px"><h2>Claude Code and files</h2>

function modal(html, label){
  $("#modal").innerHTML = `<div class="overlay" data-act="closeModalBg"><div class="dialog" role="dialog" aria-modal="true" aria-label="${h(label)}">${html}</div></div>`;
  const first = $("#modal .dialog").querySelector("input,textarea,select,button"); first && first.focus();
}
function closeModal(){ $("#modal").innerHTML = ""; }

function loanModal(){
  const L = S.loan; const states = ["Requested","Approved","Checkpointed","Copy active","Merged back","Deleted"];
  const idx = {requested:0,approved:1,checkpointed:2,active:3,returned:4,deleted:5,declined:-1}[L.state];
  const o = S.agents[L.id], N = h(o.name), own = h(L.ownLead), req = h(L.reqLead), to = h(L.to);
  let next = "";
  if (L.state==="requested") next = `<button class="btn pri" data-act="loanStep" data-v="approved">Simulate: ${own} approves</button><button class="btn" data-act="loanStep" data-v="declined">Simulate: ${own} declines</button>`;
  if (L.state==="approved") next = `<p class="small">${N} writes a checkpoint at the next natural breakpoint (save only, no restart). Bench checks all 8 sections.</p><button class="btn pri" data-act="loanStep" data-v="checkpointed">Simulate: checkpoint complete (8/8)</button>`;
  if (L.state==="checkpointed") next = `<p class="small">${own} sends a copy of ${N}'s instructions, memory and checkpoint. ${req} creates the copy in the ${to}.</p><button class="btn pri" data-act="loanStep" data-v="active">Create the loan copy</button>`;
  if (L.state==="active") next = `<p class="small">The copy shows in the ${to} with a dashed outline. The original ${N} keeps working at home.</p><button class="btn pri" data-act="loanStep" data-v="returned">Mark the loan done</button><button class="btn ghost" data-act="loanStep" data-v="returned">End early (you, as owner)</button>`;
  if (L.state==="returned") next = `<p class="small">Merging the copy's work log and lessons into ${N}'s private memory (source "loan copy at ${to}")…</p><button class="btn pri" data-act="loanStep" data-v="deleted">Simulate: merge-back written, delete copy</button>`;
  if (L.state==="deleted") next = `<div class="ok">Loan finished. Only the original ${N} exists. Their memory now has 3 new notes from the loan.</div>`;
  if (L.state==="declined") next = `<div class="warn">${own} declined: "${N} is on the critical path this sprint." ${req} can hire a freelancer instead, or escalate.</div>`;
  modal(`<h2>Agent loan: ${N} (${h(o.role)}) → ${to}</h2>
    <p class="small muted">Requested by ${req} (${to} lead) from ${own} (${h(o.team.split(" (")[0])} lead): "${N} has the know-how we need for 1 day."</p>
    <ol class="steps">${states.map((s,i)=>`<li class="${i===idx?"on":i<idx?"done":""}">${i<idx?"✓ ":""}${s}</li>`).join("")}</ol>
    <div class="col">${next}</div><hr><div class="row"><button class="btn ghost" data-act="closeModal">Close</button></div>`, "Agent loan");
}

  closeDebate(){ closeModal(); S.debate.closed=true; S.debate.state="closed";
    S.notes["decision-stop"]={title:"Stop button placement",type:"decision memo",scope:"Product team",tags:["ux","decision"],updated:"2026-10-22 09:40",source:"Debate session (archived) · decider: "+(S.debate.joined?"client":"Maya"),body:"Decision: Stop lives in the composer while a reply streams and is pinned to the header when scrolling up; same label and shortcut. Attendees: Sam, Noor, Maya. Relates to [[Onboarding flow]] and [[Checkpoint: Noor #3]]."};
    go("team"); toast("Session closed. Memo saved to Product team memory. Chat archived in the Trace."); },
  pauseInterview(){ go("home"); toast("Interview paused. Omar will continue at question "+S.interview.q+"."); },
  dontKnow(){ S.interview.open.push(S.interview.q); S.interview.answers[S.interview.q]="(I don't know yet: added as an open question)"; S.interview.q++; render(); },
  closeInterview(){ S.interview.closed=true; go("home"); toast("Interview closed. Notes saved to Bench docs and memory; Maya was told. The chat was archived in the Trace."); },
  revAccept(el){ S.review.items[el.dataset.id]="Accepted"; S.accepted=(S.accepted||7)+1; S.review.notes.push(el.dataset.id+" accepted by the client."); const it=S.items.find(i=>i.id===el.dataset.id); if(it) it.state="Done"; render(); toast(el.dataset.id+" accepted · "+S.accepted+" / 10 this week"); },
  revReject(el){ const id=el.dataset.id; modal(`<h2>Reject ${id}</h2><form data-form="revReject" data-id="${id}" class="col"><label class="f">What should change? (required, kept word for word)<textarea id="rjIn"></textarea></label><span id="rjErr" class="fielderr" aria-live="polite"></span><div class="row"><button class="btn pri">Reject and send back</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`,"Reject"); },
  closeReview(){ S.review.closed=true; go("home"); toast("Review closed. Notes saved; 2 feedback items became tasks on the board; the chat was archived in the Trace."); },
  propApprove(){ S.st.proposal="preview"; S.proposal="preview"; render(); },
  propReject(){ modal(`<h2>Reject the proposal</h2><form data-form="propReject" class="col"><label class="f">What did ${h(S.agents.atlas.name)} get wrong? (required)<textarea id="prIn">You missed that it must also work offline.</textarea></label><span id="prErr" class="fielderr"></span><div class="row"><button class="btn pri">Reject and send back</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`,"Reject proposal"); },
  propEdit(){ toast("Prototype: the one-pager would become editable in place."); },
  propPark(){ S.proposal="parked"; go("home"); toast("Idea parked. Reopen it any time from the CEO chat."); },
  propRevised(){ S.st.proposal="awaiting"; S.proposal="awaiting"; render(); },
  propCancelPreview(){ S.proposal="approved"; go("home"); toast("Proposal stays approved. It goes to a team when you create the project."); },
  ikRemove(el){ S.ikRemoved[el.dataset.id]=!el.checked; render(); },
  createProject(){
    const names = IK_TEAM.filter(x=>!S.ikRemoved[x[0]]).map(x=>S.ikNames[x[0]].trim());
    const taken = Object.values(S.agents).map(a=>a.name.toLowerCase());
    const bad = names.find(n=>!n||n.length>40||taken.includes(n.toLowerCase())) ?? (new Set(names.map(n=>n.toLowerCase())).size!==names.length ? "duplicate" : null);
    if (bad!==null && bad!==undefined){ toast(`Name problem: "${h(bad||"(empty)")}" is empty, too long or already used. Names must be unique.`); return; }
    IK_TEAM.forEach(([k,n,r])=>{ if(!S.ikRemoved[k]) S.agents[k]={name:S.ikNames[k],role:r,team:"InterviewKit",lead:k==="rana",model:r==="Tech lead"?"Opus":"Sonnet",auto:"Trusted",state:"Active",run:k==="rana"?"working":"idle",desc:`${r} of InterviewKit (copy of the template's ${r}).`,conn:["bench"],folders:["Read/write: interviewkit/"],ctx:80,task:k==="rana"?"Take over proposal":"Idle"}; });
    S.ikCreated=true; S.proposal="created"; S.st.proposal="created"; render(); toast("Project InterviewKit created. Rana (PM) has the task \"take over proposal\"."); },
  newProject(){ go("home"); toast("Tell "+h(S.agents.atlas.name)+" the idea first: projects start from a proposal you approve."); },
  card(el){ const i = S.items.find(x=>x.id===el.dataset.id); const a = i.owner?S.agents[i.owner]:null;
    modal(`<div class="row between"><h2>${i.id} · ${h(i.title)}</h2><span class="tag ${i.state==="In review"?"solid":""}">${i.state}</span></div>
     <p class="small">${i.type} · Owner: ${a?`<button class="link" data-go="live" data-p='{"id":"${i.owner}"}' data-act="closeModal">${a.name}</button>`:"Unassigned"} · Sprint ${i.sprint||"—"}</p>
     <h3>Acceptance criteria</h3><ul class="small"><li>Given a reply streams, when tokens arrive, then they render without waiting for the end.</li><li>Given a running reply, when I click Stop, then no further tool call starts.</li></ul>
     <h3>History</h3><ul class="small"><li>Oct 22 08:05 · Ready → In progress (Noor)</li>${i.state==="In review"?"<li>Oct 22 09:00 · In progress → In review</li>":""}${i.comment?`<li>Rejected by you: "${h(i.comment)}"</li>`:""}</ul>
     <p class="small">Cost so far: 184k tokens · ≈$0.61 · <button class="link" data-go="trace" data-act="closeModal">Trace</button> · Work log (6)</p>
     ${i.state==="In review"?`<div class="row" style="margin-top:8px"><button class="btn pri" data-act="cardAccept" data-id="${i.id}">Accept</button><button class="btn" data-act="cardReject" data-id="${i.id}">Reject with comment…</button></div>`:""}
     <hr><button class="btn ghost" data-act="closeModal">Close</button>`,"Work item "+i.id); },
  cardAccept(el){ const i=S.items.find(x=>x.id===el.dataset.id); i.state="Done"; S.accepted=(S.accepted||7)+1; closeModal(); render(); toast(i.id+" accepted · "+S.accepted+" / 10 this week"); },
  cardReject(el){ ACT.revReject(el); },
  fullBacklog(){ S.dashFull=!S.dashFull; render(); },
  sprintSel(el){ S.dashSprint=+el.value; render(); },
  apTab(el){ S.apprTab=el.dataset.v; render(); },
  apFilter(el){ S.apprFilter=el.dataset.v; render(); },
  apr(el){ const a=S.approvals.find(x=>x.id===el.dataset.id); if (el.disabled) return; a.status=el.dataset.v; render(); toast(`${h(S.agents[a.agent].name)}: ${h(el.dataset.v)}. Logged.`); },
  deny(el){ const a=S.approvals.find(x=>x.id===el.dataset.id); modal(`<h2>${a.kind==="outward"?"Discard this email?":"Deny the request"}</h2><form data-form="deny" data-id="${a.id}" class="col"><label class="f">Reason for ${h(S.agents[a.agent].name)} (helps it adapt)<textarea id="dnIn"></textarea></label><div class="row"><button class="btn pri">${a.kind==="outward"?"Discard":"Deny"}</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`,"Deny"); },
  traceRun(el){ S.traceRun=el.dataset.id; render(); },
  runNow(){ toast("Running this routine once. The guard stays on for the rest."); },
  openNote(el){ closeModal(); S.memNote=el.dataset.id; S.memEdit=false; if (S.st.mem!=="graph") S.st.mem="note"; if (S.screen!=="mem") go("mem"); else render(); },
  newNote(){ toast("Prototype: would create the missing note."); },
  memEdit(){ S.memEdit=!S.memEdit; render(); },
  saveNote(){ S.notes[S.memNote].body=$("#noteBody").value; S.notes[S.memNote].source="client (edited in browser)"; S.memEdit=false; render(); toast("Note saved and re-indexed."); },
  memScope(el){ S.memScope=el.dataset.v; render(); },
  staleOnly(el){ S.st.mem = el.checked?"stale":"note"; if (el.checked) S.memNote="old-ci"; render(); },
  stale(el){ delete S.notes["old-ci"].stale; S.st.mem="note"; render(); toast(h(el.dataset.v)+"."); },
  saveSettings(){ const v=+$("#ckIn").value; if (!(v>=50&&v<=85)){ S.st.settings="error"; render(); $("#ckIn").focus(); return; } S.ckpt=v; S.st.settings="normal"; render(); toast("Saved. Default checkpoint threshold is "+v+" %."); },
  startTask(el){ const v=el.dataset.v; clearTimers(); closeModal(); reset();
    if (v==="t1"){ S.screen="fr"; render(); return; }
    S.setupDone=true; S.st.home="normal";
    if (v==="t4"){ go("dash",{p:"bench"}); return; }
    if (v==="t5"){ go("team"); return; }
    go("home"); }
};

/* ============================================================
   Forms
   ============================================================ */
const FORMS = {
  ceo(){ const i=$("#ceoIn"), t=i.value.trim(); if(!t) return; i.value="";
    if (/idea/i.test(t) && S.intake===0){ S.intake=1; addCeo({who:"me",text:t,meta:"now"}); setTimeout(()=>{ S.intake=2; addCeo({who:"atlas",text:"Got it. Three quick questions so I understand it at a high level:\n1) Who uses it?\n2) Where do the notes come from?\n3) Is \"done\" a draft you edit, or a final document?",c:["2.6k","0.008"]}); },1000); return; }
    if (S.intake===2){ intakeAnswer(t); return; }
    addCeo({who:"me",text:t,meta:"now"}); setTimeout(()=>addCeo({who:"atlas",text:"Noted. (Prototype: replies are scripted. Try a suggested message.)",c:["0.5k","0.002"]}),700); },
  live(){ const i=$("#liveIn"), t=i.value.trim(); if(!t) return;
    if (S.st.live==="stopped"){ S.run.redirect=t; S.st.live="running"; S.run.steps=Math.min(S.run.steps,5); render(); toast("New instruction sent. Logged to Dev team memory."); return; }
    toast("Message sent to "+h(S.agents[S.agentId].name)+" (prototype)."); i.value=""; },
  team(){ const i=$("#teamIn"), t=i.value.trim(); if(!t) return; S.team.push({who:"me",text:t});
    const m=t.match(/@(\w+)/); const who = m ? Object.keys(S.agents).find(k=>S.agents[k].name.toLowerCase()===m[1].toLowerCase()) : null;
    S.team.push({sys:`Router → ${who?S.agents[who].name+" (rule: @mention)":"Maya (rule: project lead)"} · 0.3k tokens · ≈$0.0003`});
    if (who) S.team.push({sys:`Task created: "${t.replace(/@\w+\s*/,"").slice(0,60)}" · owner ${S.agents[who].name} · on the Bench board`});
    S.team.push({who:who||"maya",text:who?"Got it, it's on my list.":"Noted. I'll fold it into the sprint plan.",c:["0.7k","0.002"]}); render(); },
  interview(){ const i=$("#intIn"), t=i.value.trim(); if(!t) return; S.interview.answers[S.interview.q]=t; S.interview.q++; render(); $("#intIn")&&$("#intIn").focus(); },
  review(){ const i=$("#revIn"), t=i.value.trim(); if(!t) return; S.review.notes.push("Client: \""+t+"\""); render(); },
  addAgent(){ const n=$("#naName").value.trim(); if(!n||n.length>40||Object.values(S.agents).some(a=>a.name.toLowerCase()===n.toLowerCase())){ $("#naErr").textContent="Use a unique name of 1–40 characters."; $("#naName").setAttribute("aria-invalid","true"); $("#naName").focus(); return; }
    const id="new"+Date.now(); const parent=S.agents[S.selNode]||S.agents.maya;
    S.agents[id]={name:n,role:$("#naRole").value.trim()||"Agent",team:"Product team",lead:false,model:"Sonnet",auto:"Ask every time",state:"Active",run:"idle",desc:$("#naRole").value.trim()||"New agent.",conn:["bench"],folders:[],ctx:80,task:"Idle"};
    (S.added=S.added||[]).push(id); S.selNode=id; closeModal(); render(); toast(h(n)+" created under Product team. Open its profile to add connectors and folders."); },
  revReject(f){ const t=$("#rjIn").value.trim(); if(!t){ $("#rjErr").textContent="Write what should change. It goes back to the agent word for word."; $("#rjIn").focus(); return; }
    const id=f.dataset.id; S.review.items[id]="Rejected"; S.review.notes.push(id+" rejected: \""+t+"\""); const it=S.items.find(i=>i.id===id); if(it){ it.state="In progress"; it.comment=t; } closeModal(); render(); toast(id+" sent back to its owner with your comment (saved in its memory)."); },
  propReject(){ const t=$("#prIn").value.trim(); if(!t){ $("#prErr").textContent="A comment is required."; return; } S.rejectComment=t; S.st.proposal="rejected"; S.proposal="rejected"; closeModal(); render(); },
  deny(f){ const a=S.approvals.find(x=>x.id===f.dataset.id); a.status = a.kind==="outward"?"Discarded":"Denied"; closeModal(); render(); toast(h(S.agents[a.agent].name)+" was told: "+h($("#dnIn")?.value||"no reason given")); }
};

/* ============================================================
   Event delegation
   ============================================================ */
document.addEventListener("click", ev => {
  const actEl = ev.target.closest("[data-act]");
  const goEl = ev.target.closest("[data-go]");
  if (actEl && actEl.tagName!=="INPUT" && actEl.tagName!=="SELECT" && ACT[actEl.dataset.act]){
    if (actEl.dataset.act==="closeModalBg"){ ACT.closeModalBg(null, actEl, ev); return; }
    ACT[actEl.dataset.act](actEl, null, ev);
  }
  if (goEl){ ev.preventDefault(); closeModal(); go(goEl.dataset.go, goEl.dataset.p?JSON.parse(goEl.dataset.p):null); }
});
document.addEventListener("change", ev => { const el = ev.target.closest("[data-act]"); if (el && (el.tagName==="INPUT"||el.tagName==="SELECT") && el.type!=="range" && el.type!=="text" && ACT[el.dataset.act]) ACT[el.dataset.act](el); });
document.addEventListener("input", ev => { const el = ev.target;
  if (el.dataset?.act==="agCkpt") ACT.agCkpt(el);
  if (el.dataset?.act==="ikName") S.ikNames[el.dataset.id]=el.value; });
document.addEventListener("submit", ev => { const f = ev.target.closest("[data-form]"); if (f){ ev.preventDefault(); FORMS[f.dataset.form](f); } });
document.addEventListener("keydown", ev => {
  if (ev.key==="Escape" && $("#modal").innerHTML) closeModal();
  if ((ev.key==="Enter"||ev.key===" ") && ev.target.matches("g[role=button]")){ ev.preventDefault(); ACT.openNote(ev.target); }
});
reset(); render();
</script>

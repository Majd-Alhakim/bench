<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench (codename): low-fi UX prototype v0.2</title>
<!--
  Low-fi, greyscale, clickable prototype. Phase 4 (UX), lean mode.
  Source of truth: docs/requirements/BRD.md v1.0. UX package: docs/design/ux/README.md.
  v0.2 applies the guide audit (docs/design/ux/guide-audit.md, 32 Must-fix findings) and client decisions D1-D6
  (docs/requirements/interviews/2026-10-22-ux-audit-decisions.md).
  Rules: no brand colours, no external requests, plain HTML/CSS/JS, one file.
  Sample data is fictional: the founder's day-1 tree working on project "Bench" (dogfood).
-->
<style>
:root{
  --bg:#ffffff; --p1:#f6f6f6; --p2:#ececec; --p3:#dedede; --line:#c4c4c4;
  --mid:#8c8c8c; --ink2:#4d4d4d; --ink:#161616;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}
a{color:inherit}
.muted{color:var(--ink2)} .small{font-size:12px} .xs{font-size:11px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Layout */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:48px auto 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--p1)}
.brand{font-weight:700;letter-spacing:.3px}
.brand small{font-weight:400;color:var(--ink2)}
.banner{grid-column:1/3}
.side{border-right:1px solid var(--line);background:var(--p1);overflow:auto;padding:8px}
.main{overflow:auto;padding:0 0 40px}
.app.setup{grid-template-columns:1fr}
.app.setup .side{display:none}
.app.setup .top,.app.setup .banner,.app.setup .main{grid-column:1/2}

.nav{list-style:none;margin:0;padding:0}
.nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border-radius:6px;cursor:pointer}
.nav button:hover{background:var(--p2)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.nav button:focus-visible{outline:2px solid #000}
.nav .sub button{padding-left:24px;font-size:13px}
.nav .label{padding:12px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;border:1px solid currentColor;font-size:11px;text-align:center}

/* Controls */
.btn{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--p2)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#333}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.lg{padding:10px 18px;font-size:15px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
/* Selected toggles and filters: outline + check mark, never the primary fill (H8) */
.tog{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.tog:hover{background:var(--p2)}
.tog[aria-pressed="true"],.tog[aria-checked="true"]{border:2px solid var(--ink);padding:3px 10px;font-weight:700}
.tog[aria-pressed="true"]::before,.tog[aria-checked="true"]::before{content:"\2713\00a0"}
.tog.big{border-radius:8px;padding:10px 16px;font-size:14px;text-align:left}
.tog.big[aria-checked="true"]{padding:9px 15px}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link:focus-visible{outline:2px solid #000}
input[type=text],input[type=number],textarea,select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
input[aria-invalid="true"]{border:2px solid var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
.err{border:1px solid var(--ink);border-left:6px solid var(--ink);background:var(--p2);padding:8px 10px;border-radius:6px}
.warn{border:1px dashed var(--ink);background:var(--p1);padding:8px 10px;border-radius:6px}
.ok{border:1px solid var(--line);background:var(--p1);padding:8px 10px;border-radius:6px}
.fielderr{font-size:12px;font-weight:600}
.pointer{border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff}

/* Tags (status is text, never colour alone) */
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--ink);border-radius:4px;padding:0 5px;line-height:17px;white-space:nowrap}
.tag.solid{background:var(--ink);color:#fff}
.tag.dash{border-style:dashed}
.tag.soft{border-color:var(--mid);color:var(--ink2);font-weight:600}

/* Cards and panels */
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
.card.flat{background:var(--p1)}
.card.cur{border:2px solid var(--ink)}
.pad{padding:16px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--p3);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600}
.skel{background:repeating-linear-gradient(90deg,var(--p2) 0 40px,var(--p1) 40px 80px);border-radius:4px;height:12px;margin:6px 0}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0 0 8px;font-size:12px;color:var(--ink2)}
.crumbs li+li::before{content:"\203A";margin-right:6px}
.demo{border:1px dashed var(--mid);background:repeating-linear-gradient(135deg,#fafafa 0 10px,#f3f3f3 10px 20px);padding:8px;border-radius:6px;font-size:12px;margin-top:8px}

/* Annotation bar */
.ann{margin:0;padding:10px 20px;border-bottom:1px dashed var(--mid);background:repeating-linear-gradient(135deg,#fafafa 0 10px,#f3f3f3 10px 20px);font-size:12.5px}
.ann .k{font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.ann .states button{border:1px solid var(--mid);background:#fff;border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer}
.ann .states button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ann-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.msg.me{align-self:flex-end;background:var(--p2);border-color:var(--p3)}
.msg .who{font-weight:600;font-size:12px;margin-bottom:2px}
.msg .meta{margin-top:4px;font-size:11px;color:var(--ink2);display:flex;gap:8px}
.sys{align-self:stretch;font-size:12px;color:var(--ink2);border-top:1px dotted var(--mid);border-bottom:1px dotted var(--mid);padding:3px 6px;font-family:ui-monospace,Consolas,monospace}
.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--ink2);background:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.chip:hover{background:var(--p2)}
.cost{font-size:11px;color:var(--ink2)}
.scroll{max-height:440px;overflow:auto;padding-right:4px}

/* What needs me */
.wnm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wnm li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.wnm li.first{border:2px solid var(--ink)}
.wnm .t{font-weight:600}
.wgroup{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin:12px 0 6px;font-weight:700}
.wgroup:first-child{margin-top:0}

/* Org tree */
.tree,.tree ul{list-style:none;margin:0;padding-left:22px;position:relative}
.tree{padding-left:0}
.tree ul li{position:relative;padding-left:14px}
.tree ul li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--mid)}
.tree ul li:last-child::before{bottom:auto;height:20px}
.tree ul li::after{content:"";position:absolute;left:0;top:20px;width:12px;border-top:1px solid var(--mid)}
.node{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink2);border-radius:8px;padding:6px 10px;margin:4px 0;background:#fff;cursor:pointer}
.node:hover{background:var(--p2)}
.node[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.node.loan{border-style:dashed}
.group{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-top:8px}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--ink2);background:var(--p2);font-size:11px;font-weight:700;flex:none}
.av.lg{width:44px;height:44px;font-size:16px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--line);background:#fff;font-weight:600;margin-bottom:-1px}

/* Kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:160px}
.kcard{display:block;width:100%;text-align:left;border:1px solid var(--ink2);border-radius:6px;background:#fff;padding:7px 8px;margin-bottom:6px;cursor:pointer}
.kcard:hover{background:var(--p2)}
.kcard.blocked{border-width:2px;border-style:dashed}

/* Meters */
.bar{position:relative;height:14px;border:1px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;cursor:pointer}
.mini .bar{width:90px;height:8px}

/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;padding:0;list-style:none}
.steps li{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.steps li.on{border-color:var(--ink);background:var(--ink);color:#fff}
.steps li.done{border-color:var(--ink2);color:var(--ink)}

/* Modal, drawer, toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50}
.dialog{background:#fff;border:1px solid var(--ink);border-radius:10px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.drawer{position:fixed;top:48px;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:2px solid var(--ink);box-shadow:-4px 0 12px rgba(0,0,0,.15);overflow:auto;padding:18px;z-index:45}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 14px;max-width:600px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.timer{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 12px}
details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:6px;background:#fff}
details summary{cursor:pointer}
td details{border:0;padding:0;margin:0;background:none}
.doc{max-width:720px;border:1px solid var(--line);border-radius:8px;padding:20px 26px;background:#fff}
.doc h2{border-bottom:1px solid var(--p3);padding-bottom:4px;margin-top:16px}
.wikilink{all:unset;cursor:pointer;border-bottom:1px dashed var(--ink);font-weight:600}
.wikilink:focus-visible{outline:2px solid #000}
.wikilink.unres{border-bottom-style:dotted;color:var(--ink2)}
.three{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:14px}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;margin-top:12px}
@media (max-width:1100px){.grid2,.three{grid-template-columns:1fr}.kan,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app setup" id="app">
  <header class="top" id="top"></header>
  <div class="banner" id="banner"></div>
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="main" id="main" tabindex="-1">
    <section class="ann" id="ann" aria-label="Screen annotation"></section>
    <div id="screen"></div>
  </main>
</div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jp = o => h(JSON.stringify(o)); // JSON for data-p attributes
/* D4: cost is shown as tokens + share of the weekly limit. No money in the client's views. */
const WEEK_TOKENS = 7.7e6; // fictional weekly plan limit, in tokens
const tokNum = t => { const m = String(t).match(/([\d.]+)\s*([kM]?)/); if (!m) return 0; return parseFloat(m[1]) * (m[2]==="k"?1e3:m[2]==="M"?1e6:1); };
const pctWeek = t => { const p = tokNum(t)/WEEK_TOKENS*100; return p<0.01 ? "<0.01 %" : p<1 ? p.toFixed(2)+" %" : p.toFixed(1)+" %"; };
const costTxt = t => `${t} tokens · ${pctWeek(t)} of week`;
const cost = t => `<span class="cost" title="Tokens used, and their share of your weekly plan limit">${costTxt(t)}</span>`;
const initials = n => n.split(/\s+/).map(x => x[0]).join("").slice(0,2).toUpperCase();

/* Timers. `timers` belong to the current render (cleared on every render).
   `pend` are one-off delayed actions (agent replies, stop, creating); cleared when the guide resets the demo. */
let timers = [], pend = [];
function every(fn, ms){ timers.push(setInterval(fn, ms)); }
function clearTimers(){ timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }
function later(fn, ms){ const id = setTimeout(() => { pend = pend.filter(x => x!==id); fn(); }, ms); pend.push(id); }
function clearPend(){ pend.forEach(clearTimeout); pend = []; }

/* Toast: says what happened; carries a link when something was created (M2). Stays 10 s with an action. */
function toast(msg, action){
  const t = $("#toast");
  const btn = !action ? "" : action.go
    ? `<button class="link" data-go="${action.go}" ${action.p?`data-p="${jp(action.p)}"`:""}>${h(action.label)}</button>`
    : `<button class="link" data-act="${action.act}">${h(action.label)}</button>`;
  t.innerHTML = `<div class="toast" role="status">${msg} ${btn} <button class="link xs" data-act="toastClose" style="margin-left:6px">Dismiss</button></div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = "", action ? 10000 : Math.max(4200, String(msg).length*60));
}
function clearToast(){ clearTimeout(toast._t); $("#toast").innerHTML = ""; }
function announce(text){ const a = $("#announce"); a.textContent = ""; setTimeout(() => a.textContent = text, 50); }

/* ============================================================
   Sample data: the founder's day-1 tree, working on project "Bench"
   ============================================================ */
const INV = {
  bench:{name:"Bench tools (handoff, ask, memory, board)", tok:"1.1k", always:true},
  gmail:{name:"Gmail", tok:"2.4k", note:"Read, label, archive, draft. Sends only to you; any email to someone else needs you, one at a time."},
  github:{name:"GitHub (issues, PRs)", tok:"3.0k"},
  shell:{name:"Shell (git, npm, tests)", tok:"0.9k"},
  webfetch:{name:"Web fetch", tok:"0.4k"},
  websearch:{name:"Web search", tok:"0.5k"},
  figma:{name:"Figma", tok:"2.0k", missing:true}
};
/* run: the agent's default work status. The status shown is computed by statusOf() (H1). */
function baseAgents(){ return {
  atlas:{name:"Atlas",role:"CEO",team:"Root (CEO)",lead:true,model:"Sonnet",auto:"Trusted",state:"Active",run:"idle",desc:"Runs the business for you. Your front door: status, routing, proposals and inbox triage.",conn:["bench","gmail"],folders:["Read: Bench home"],ctx:80,task:"Morning status (done 08:02)"},
  maya:{name:"Maya",role:"PM",team:"Product team",lead:true,model:"Sonnet",auto:"Trusted",state:"Active",run:"working",desc:"Product manager. Turns proposals into epics, stories and sprints; calls review meetings.",conn:["bench","github"],folders:["Read/write: bench/docs/"],ctx:80,task:"Planning Sprint 2 follow-ups"},
  omar:{name:"Omar",role:"BA lead",team:"Requirements (Product team)",lead:true,model:"Sonnet",auto:"Trusted",state:"Active",run:"thinking",desc:"Senior business analyst. Runs interviews, owns requirement documents, tracks work against them.",conn:["bench","webfetch"],folders:["Read/write: bench/docs/requirements/"],ctx:80,task:"Preparing interview: memory browser filters"},
  lina:{name:"Lina",role:"BA",team:"Requirements (Product team)",lead:false,model:"Sonnet",auto:"Trusted",state:"Active",run:"idle",desc:"Business analyst. Takes notes in meetings, drafts stories with the PM.",conn:["bench","webfetch"],folders:["Read/write: bench/docs/requirements/"],ctx:80,task:"Idle"},
  sam:{name:"Sam",role:"UX/UI",team:"Product team",lead:false,model:"Sonnet",auto:"Ask every time",state:"Active",run:"working",desc:"UX and UI designer. Flows, wireframes, prototypes.",conn:["bench","figma"],folders:["Read/write: bench/docs/design/"],ctx:80,task:"UX-1 First-run wireframes"},
  karim:{name:"Karim",role:"Tech lead",team:"Dev team",lead:true,model:"Opus",auto:"Ask every time",state:"Active",run:"idle",desc:"Tech lead. Splits stories into tasks, reviews PRs, writes ADRs.",conn:["bench","github","shell"],folders:["Read: bench/ (whole repo)","Write: bench/docs/adr/"],ctx:80,task:"PR #41: merge to main"},
  noor:{name:"Noor",role:"Developer",team:"Dev team",lead:false,model:"Sonnet",auto:"Ask every time",state:"Active",run:"working",desc:"Developer. Writes code and tests in the repos you point her to.",conn:["bench","shell","github"],folders:["Read/write: bench/"],ctx:70,task:"S1-4 Chat UI: streaming, markdown, stop"},
  jade:{name:"Jade",role:"QA",team:"Dev team",lead:false,model:"Sonnet",auto:"Ask every time",state:"Active",run:"working",desc:"QA engineer. Test plans, automated tests, bug reports.",conn:["bench","shell"],folders:["Read: bench/","Write: bench/tests/"],ctx:80,task:"QA-3 E2E tests on Windows CI"}
};}
const IK_TEAM = [["rana","Rana","PM"],["yusuf","Yusuf","BA lead"],["hala","Hala","BA"],["ilias","Ilias","UX/UI"],["tariq","Tariq","Tech lead"],["mina","Mina","Developer"],["zaid","Zaid","QA"]];

function baseItems(){ return [
  {id:"S1-4",title:"Chat UI: streaming, markdown, stop",type:"Story",owner:"noor",state:"In progress",pr:1,sprint:2},
  {id:"S1-2",title:"Onboarding: detect Claude Code and login",type:"Story",owner:"noor",state:"In review",pr:2,sprint:2},
  {id:"S1-3",title:"Main agent runner wraps query()",type:"Story",owner:"noor",state:"In review",pr:3,sprint:2},
  {id:"S1-5",title:"Trace panel, per-message cost, plan meter",type:"Story",owner:"noor",state:"To Do",pr:4,sprint:2},
  {id:"UX-1",title:"First-run wireframes",type:"Task",owner:"sam",state:"In progress",pr:5,sprint:2},
  {id:"S1-6",title:"SQLite persistence and session resume",type:"Story",owner:"karim",state:"To Do",pr:6,sprint:2},
  {id:"QA-3",title:"E2E tests on Windows CI",type:"Task",owner:"jade",state:"Blocked",pr:7,sprint:2},
  {id:"QA-2",title:"Test plan for onboarding",type:"Task",owner:"jade",state:"To Do",pr:8,sprint:2},
  {id:"S2-1",title:"Agent editor (name, role, model, knowledge)",type:"Story",owner:"",state:"Backlog",pr:9,sprint:0},
  {id:"S2-2",title:"Inventory service: per-agent connector picker",type:"Story",owner:"",state:"Backlog",pr:10,sprint:0},
  {id:"S2-3",title:"Private and global memory (Bench Memory layers 1–3)",type:"Epic",owner:"",state:"Backlog",pr:11,sprint:0},
  {id:"S2-4",title:"Duplicate an agent without memory",type:"Story",owner:"",state:"Backlog",pr:12,sprint:0},
  {id:"E3",title:"Groups and router",type:"Epic",owner:"",state:"Backlog",pr:13,sprint:0},
  {id:"E4",title:"Handoffs and task board",type:"Epic",owner:"",state:"Backlog",pr:14,sprint:0},

/* ============================================================
   Agent status: one vocabulary everywhere (H1), always as text
   Idle · Thinking · Working · Waiting for you · Blocked · Paused · Stopped · Error
   ============================================================ */
const STATUS_SET = ["Idle","Thinking","Working","Waiting for you","Blocked","Paused","Stopped","Error"];
const pendingAppr = id => S.approvals.find(a => a.agent===id && a.status==="pending");
const noorWaiting = () => { const a = S.approvals.find(x => x.id==="a3"); return !!a && a.status==="pending"; };
function statusOf(id){
  const a = S.agents[id]; if (!a) return "Idle";
  if (a.state==="Paused") return "Paused";
  if (a.state==="Archived" || a.state==="Draft") return "Idle";
  let s;
  if (id==="noor"){
    if (S.run.cancelled) s = "Idle";
    else if (["stopped","cantundo"].includes(S.run.state)) s = "Stopped";
    else if (noorWaiting() && S.run.state!=="stopping") s = "Waiting for you";
    else s = "Working";
  } else if (id==="jade") s = S.escalation==="open" ? "Blocked" : "Working";
  else if (pendingAppr(id) && id!=="atlas" && id!=="sam") s = "Waiting for you";
  else s = {idle:"Idle",thinking:"Thinking",working:"Working",waiting:"Waiting for you",blocked:"Blocked",paused:"Paused",stopped:"Stopped",error:"Error"}[a.run] || "Idle";
  if (S.usageMode==="limit" && (s==="Working" || s==="Thinking")) s = "Paused";
  return s;
}
function statusTag(id){
  const s = statusOf(id);
  const cls = (s==="Waiting for you"||s==="Blocked"||s==="Error") ? "tag solid" : (s==="Working"||s==="Thinking"||s==="Stopped"||s==="Paused") ? "tag" : "tag soft";
  return `<span class="${cls}">${s}</span>`;
}
function lifeTag(a){ return a.state!=="Active" ? `<span class="tag dash">${h(a.state)}</span>` : ""; }

  const f = S.from;
  if (f && f.screen==="dash") return [f.params?.p==="ik"?"InterviewKit · Dashboard":"Bench · Dashboard","dash",f.params||{p:"bench"}];
  if (f && FROM_LBL[f.screen]) return [FROM_LBL[f.screen],f.screen,f.params];
  return fallback;
}
function crumbs(parts){
  return `<nav class="crumbs" aria-label="Breadcrumb"><ol>${parts.map(p=>`<li>${p[1]?`<button class="link" data-go="${p[1]}" ${p[2]?`data-p="${jp(p[2])}"`:""}>${h(p[0])}</button>`:`<span aria-current="page">${h(p[0])}</span>`}</li>`).join("")}</ol></nav>`;
}

/* ============================================================
   Router
   ============================================================ */
function go(screen, params){
  // M13: leave guard for unsaved agent edits
  if (S.screen==="agent" && Object.keys(S.agentDirty).length && !(screen==="agent" && (params?.id||S.agentId)===S.agentId)){ leaveGuard(screen, params); return; }
  if (S.screen==="agent" && screen!=="agent") S.agentDirty = {};
  clearTimers();
  if (S.screen!==screen) S.from = {screen:S.screen, params:S.params};
  S.prev = S.screen;
  S.screen = screen; S.params = params||null;
  if (screen==="agent"||screen==="live"){
    const nid = params?.id || S.agentId;
    if (nid!==S.agentId) S.agentDirty = {};
    S.agentId = nid;
  }
  if (!S.agents[S.agentId]) S.agentId = "noor";
  if (screen==="agent"){ S.st.agent = {Active:"normal",Draft:"draft",Paused:"paused",Archived:"archived"}[S.agents[S.agentId].state] || "normal"; }
  if (screen==="live") syncLive();
  if (screen==="mem" && params?.scope) S.memScope = params.scope;
  if (screen==="dash") S.dashProject = params?.p || "bench";
  if (screen==="session" && params?.type) S.st.session = params.type==="debate" ? (S.debate.state==="open"?"debate":(S.debate.agreed?"agreed":"decided")) : params.type;
  if (screen==="settings") S.setDirty = false;
  render();
  $("#main").scrollTop = 0;
  $("#main").focus({preventScroll:true});
}
/* Noor's run state lives in S.run.state so it survives visits to other agents' chats */
function syncLive(){
  const a = S.agents[S.agentId];
  if (S.agentId!=="noor"){ S.st.live = a.state==="Archived" ? "archived" : "idle"; return; }
  if (a.state==="Archived"){ S.st.live = "archived"; return; }
  if (S.run.cancelled){ S.st.live = "idle"; return; }
  if (["running","waiting"].includes(S.run.state)) S.run.state = noorWaiting() ? "waiting" : "running";
  S.st.live = S.run.state;
}
function setLive(v){ S.st.live = v; if (S.agentId==="noor" && v!=="archived") S.run.state = v; }
function render(){
  clearTimers(); // every render re-creates the timers it needs (AFTER hooks), so none pile up
  $("#app").classList.toggle("setup", !S.setupDone);
  renderTop(); renderSide(); renderAnn();
  $("#screen").innerHTML = (SCREENS[S.screen]||(()=>"<div class='pad'>Not found</div>"))();
  (AFTER[S.screen]||(()=>{}))();
}

/* ============================================================
   Screen: Agent live chat (watch, stop, redirect)
   ============================================================ */
const LIVE_STEPS = [
  ["read","src/renderer/chat/Composer.tsx","0.8k"],
  ["edit","src/renderer/chat/Composer.tsx (+24 −6)","2.1k"],
  ["bash","pnpm test chat","1.4k"],
  ["read","src/renderer/chat/useStream.ts","0.6k"],
  ["edit","src/renderer/chat/StopButton.tsx (new file)","1.9k"],
  ["bash","pnpm lint --fix","0.9k"],
  ["edit","src/renderer/chat/format/date.ts (+40) · custom date formatter","2.4k"]
];
function scrLive(){
  const id = S.agentId, a = S.agents[id], st = S.st.live;
  const N = h(a.name);
  const running = st==="running", stopped = st==="stopped"||st==="cantundo", waiting = st==="waiting";
  const ap = id==="noor" ? S.approvals.find(x=>x.id==="a3") : pendingAppr(id);
  const nSteps = waiting ? 3 : S.run.steps;
  const steps = LIVE_STEPS.slice(0, nSteps);
  const last = steps[steps.length-1] || LIVE_STEPS[0];
  const msgs = id==="noor" ? [
    {who:"karim",text:"Noor, S1-4 is yours: streaming, markdown, Stop. AC in the card.",meta:"08:05 · from your lead"},
    {who:"noor",text:"On it. Streaming is in; working on the Stop button now. I'll add a small date formatter for message times.",c:["3.4k"]}
  ] : [{who:id,text:`Hi, I'm ${a.name}. ${a.task&&a.task!=="Idle"?"Currently: "+a.task+".":"I'm idle. Give me a task."}`,c:["0.4k"]}];
  if (S.run.redirect && id==="noor") msgs.push({who:"me",text:S.run.redirect,meta:"just now"},{sys:"Redirect logged to Dev team memory so Karim stays informed"},{who:"noor",text:"Understood. Removing my custom formatter and using date-fns, which the repo already has. Continuing with the Stop button.",c:["1.2k"]});
  const status = st==="connecting" ? `<span class="small muted" role="status">Connecting…</span>`
    : st==="archived" ? `<span class="tag dash">Archived</span>`
    : `<span role="status">${statusTag(id)}</span>`;
  const otherWaiting = id!=="noor" && statusOf(id)==="Waiting for you" && ap;
  let activity;
  if (st==="connecting") activity = `<p class="small muted" role="status">Connecting to ${N}'s run…</p>${'<div class="skel"></div>'.repeat(4)}`;
  else if (st==="archived") activity = `<div class="card flat small">Archived agent. History is read-only.</div>`;
  else if (st==="idle") activity = otherWaiting
      ? `<div class="pointer"><b>Waiting for you:</b> ${h(ap.action.toLowerCase())}. <span class="small">${h(ap.target)}</span><div style="margin-top:6px"><button class="btn" data-go="appr" data-p="${jp({focus:ap.id})}">Open approval</button></div></div>`
      : (a.task && a.task!=="Idle" && statusOf(id)!=="Idle")
      ? `<div class="card flat"><b>No tool call running right now.</b><p class="small">Current task: ${h(a.task)} ${statusTag(id)}</p><p class="small muted">Tool calls appear here live as soon as ${N} starts the next step.</p></div>`
      : `<div class="card flat"><b>Idle.</b><p class="small muted">No task running. Give ${N} a task in the chat, or assign one from the project board.</p></div>`;
  else {
    const stepTxt = stopped ? "Stopped. No further step will start."
      : st==="stopping" ? `Stopping: waiting for <span class="mono">${h(last[0]+" "+last[1])}</span> to finish (usually under a minute). No new step will start.`
      : waiting ? `Waiting for your approval: <span class="mono">${h(ap?.cmd||"")}</span>`
      : h(last[0]+" · "+last[1]);
    activity = `<p class="small"><b>Task:</b> <button class="link" data-act="card" data-id="S1-4">S1-4 Chat UI: streaming, markdown, stop</button></p>
       <p class="small"><b>Step:</b> ${stepTxt}</p>
       <h3>Tool calls</h3><ol class="small mono" style="padding-left:18px;margin:0" aria-live="polite">${steps.map(s=>`<li>${s[0]} ${h(s[1])} <span class="cost">${s[2]}</span></li>`).join("")}${waiting?`<li><b>bash ${h(ap?.cmd||"")} · waiting for your approval</b></li>`:""}${running?`<li class="muted">…</li>`:""}</ol>
       <h3 style="margin-top:8px">Files touched</h3><p class="small mono">Composer.tsx${nSteps>=5?" · StopButton.tsx":""}${nSteps>=6?" · 2 files reformatted by lint":""}${nSteps>=7?" · format/date.ts":""}</p>
       <p class="small"><b>This run:</b> ${costTxt((18+nSteps*1.4).toFixed(1)+"k")} <button class="link small" data-act="traceRun" data-id="r1" data-nav="1">Open trace</button></p>
       <p class="small" style="margin-bottom:2px"><b>Context:</b> 34 % of 1M · checkpoint at ${a.ctx} %</p>
       <div class="bar" role="img" aria-label="Context used 34 percent, checkpoint at ${a.ctx} percent"><i style="width:34%"></i><span class="mark" style="left:${a.ctx}%"></span></div>`;
  }
  const headBtns = running ? `<button class="btn pri lg" data-act="stop">■ Stop</button>`
    : waiting ? `<button class="btn pri" data-go="appr" data-p="${jp({focus:"a3"})}">Open approval</button><button class="btn lg" data-act="stop">■ Stop</button>`
    : stopped ? `<button class="btn" data-act="cancelTask">Cancel task</button><button class="btn" data-act="resume">Resume as before</button>`
    : st==="stopping" ? `<button class="btn lg" disabled>■ Stopping…</button>` : "";
  const sendPri = stopped || st==="idle";
  return `<div class="pad">
    ${crumbs([fromCrumb(["Org tree","org"]),[a.name+" · Live chat"]])}
    <div class="row between"><div class="row"><span class="av lg" aria-hidden="true">${initials(a.name)}</span><div><h1>${N} ${status}</h1><span class="muted small">${h(a.role)} · ${h(a.team)} · ${a.model} · <button class="link" data-go="agent" data-p="${jp({id})}">Profile</button></span></div></div>
     <div class="row">${headBtns}</div></div>
    ${waiting?`<div class="pointer" style="margin-top:8px" role="status"><b>Waiting for you:</b> ${N} asks to run <span class="mono">${h(ap?.cmd||"")}</span> in ${h(ap?.repo||"")}. Nothing else runs until you decide. <button class="link" data-go="appr" data-p="${jp({focus:"a3"})}">Open in Approvals</button></div>`:""}
    ${st==="stopping"?`<div class="warn" style="margin-top:8px" role="status"><b>Stopping…</b> ${N} finishes the current step first: <span class="mono">${h(last[0]+" "+last[1])}</span> (usually under a minute). No new step will start.</div>`:""}
    ${st==="stopped"?`<div class="ok" style="margin-top:8px" role="status"><b>${N} has stopped.</b> No further tool call will start. Tell ${N} what to change below, or cancel the task.</div>`:""}
    ${st==="cantundo"?`<div class="warn" style="margin-top:8px" role="status"><b>${N} has stopped, but the last command had already run.</b> <span class="mono">pnpm lint --fix</span> changed 2 files; Stop can't undo a shell command. ${N} will list what it changed in the chat. Tell ${N} what to do next below.</div>`:""}
    <div class="grid2" style="margin-top:12px">
      <section class="card"><h2>Chat with ${N}</h2><div class="chat scroll" id="liveChat">${msgs.map(m=>msgHTML(m)).join("")}</div>
        ${st==="archived"?"":`<form class="composer" data-form="live"><input type="text" id="liveIn" aria-label="${stopped?"New instruction for "+N:"Message "+N}" placeholder="${stopped?"New instruction: what should "+N+" do instead?":"Message "+N+"… (logged so the lead stays informed)"}"><button class="btn ${sendPri?"pri":""}">${stopped?"Send instruction":"Send"}</button></form>`}
        <p class="xs muted" style="margin-top:6px">Direct messages are logged to the team memory so ${a.lead?"the parent":"the lead"} stays informed.</p></section>
      <aside class="card" aria-label="Live activity"><h2>Live activity</h2>${activity}</aside></div></div>`;
}

/* ============================================================
   Screen: Meeting session (debate / interview / review)
   ============================================================ */
const DEBATE_MSGS = [
  ["sam","Header: the Stop button must stay visible when the chat scrolls. Users look for it when something goes wrong, not when they type."],
  ["noor","Composer: that's where the cursor is when you send. One less mouse trip. The header already holds the name and status."],
  ["maya","Both matter. Can it be in the composer while a reply streams, and pinned to the header when you scroll up?"],
  ["noor","That works technically, two buttons with the same action. A bit more code."],
  ["sam","Fine for me if both are labelled \"Stop\" with the same shortcut."],
];
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const REVIEW_ITEMS = [["S1-2","Onboarding: detect Claude Code and login","pnpm dev  →  quit Claude Code and press Check again"],["S1-3","Main agent runner","pnpm dev  →  ask Atlas: what's the status?"]];
function scrSession(){
  const st = S.st.session;
  const type = ["interview","review"].includes(st) ? st : "debate";
  if (type==="interview"){
    const Q = ["Who will use the memory browser: only you, or agents too?","What do you filter by most: scope, agent or type?","When a note is stale, what should happen by default: flag, hide or ask you?","Should the graph start centred on the open note or show everything?","Do you want saved filters?","Is search across all scopes by default, or the current scope?","Do decision memos need their own view?","Anything you'd remove from the browser?"];
    const q = S.interview.q;
    return `<div class="pad">${crumbs([fromCrumb(["Home","home"]),["BA interview"]])}
      <div class="row between"><div><h1>BA interview: memory browser filters <span class="tag solid">Live</span></h1><p class="small muted">With <button class="link" data-go="live" data-p="${jp({id:"omar"})}">Omar</button> (BA lead). Not timeboxed. Your answers are kept word for word in the interview notes.</p></div>
      <div class="row"><button class="btn" data-act="pauseInterview">Pause and continue later</button></div></div>
      <ol class="steps" aria-label="Progress">${Q.map((_,i)=>`<li class="${i+1===q?"on":i+1<q?"done":""}">${i+1}</li>`).join("")}</ol>
      <div class="grid2"><section class="card"><div class="chat">
        ${Q.slice(0,Math.min(q,8)).map((x,i)=>`<div class="msg"><div class="who">Omar · BA lead · Question ${i+1} of 8</div>${h(x)}${i===2?`<div class="small muted" style="margin-top:4px">Options: (a) flag only (recommended) · (b) hide · (c) ask you each time</div>`:""}</div>${S.interview.answers[i+1]?`<div class="msg me"><div class="who">You</div>${h(S.interview.answers[i+1])}</div>`:""}`).join("")}
        ${q>8?`<div class="ok"><b>All 8 questions answered.</b> Omar writes the interview notes and tells Maya when you close. <div class="row end" style="margin-top:6px"><button class="btn pri" data-act="closeInterview">Close session</button></div></div>`:""}
      </div>
      ${q<=8?`<form class="composer" data-form="interview"><input type="text" id="intIn" aria-label="Your answer to question ${q}" placeholder="Your answer to question ${q}…"><button class="btn pri">Answer</button></form><div class="row" style="margin-top:6px"><button class="link small" data-act="dontKnow">I don't know yet (add as open question)</button></div>`:""}</section>
      <aside class="card"><h2>Notes so far</h2><ul class="small">${Object.entries(S.interview.answers).map(([k,v])=>`<li>Q${k}: "${h(v)}"</li>`).join("")}</ul>${S.interview.open.length?`<h3>Open questions</h3><ul class="small">${S.interview.open.map(x=>`<li>Q${x}</li>`).join("")}</ul>`:""}
       <p class="xs muted">When the session closes, these notes go to the project documents and memory; the chat leaves your views and is archived in the trace.</p></aside></div></div>`;
  }
  if (type==="review"){
    const it = S.review.items;
    const pend = Object.keys(it).filter(k=>it[k]==="pending");
    const cur = pend[0];
    const row = (id,title,how) => `<div class="card ${id===cur?"cur":""}" style="margin-bottom:8px"><div class="row between"><b>${id} · ${title}</b><span class="tag ${it[id]==="pending"?"soft":"solid"}">${it[id]==="pending"?"In review":it[id]}</span></div>
       <p class="small">How to try it: <span class="mono">${how}</span></p>
       ${it[id]==="pending"?`<div class="row"><button class="btn ${id===cur?"pri":""}" data-act="revAccept" data-id="${id}">Accept ${id}</button><button class="btn" data-act="revReject" data-id="${id}">Reject with comment…</button></div>`:""}</div>`;
    return `<div class="pad">${crumbs([fromCrumb(["Home","home"]),["Review: Sprint 2"]])}
      <div class="row between"><div><h1>Review: Sprint 2 increment <span class="tag solid">Live</span></h1><p class="small muted">Called by <b>Maya</b> (PM). Lina (BA) takes notes. Not timeboxed; debates inside it are.</p></div>
      <div class="row"><button class="btn" data-act="startDebate">Debate a point…</button></div></div>
      <div class="grid2" style="margin-top:10px"><section class="card"><div class="chat" style="margin-bottom:10px">
        <div class="msg"><div class="who">Maya · PM</div>We have two things to show you against the stories. Try each, then accept or reject. Tell me anything that feels off.</div></div>
        ${REVIEW_ITEMS.map(r=>row(r[0],r[1],r[2])).join("")}
        <form class="composer" data-form="review"><input type="text" id="revIn" aria-label="Feedback for the team" placeholder="Feedback for Maya and Lina (becomes a task)…"><button class="btn">Send feedback</button></form>
        <div class="row end" style="margin-top:12px"><span class="small muted">${pend.length?pend.length+" of "+REVIEW_ITEMS.length+" not reviewed yet":"All items reviewed"}</span><button class="btn ${pend.length?"":"pri"}" data-act="closeReview">Close review</button></div></section>
      <aside class="card" aria-live="polite"><h2>Lina's notes (live)</h2><ul class="small">${S.review.notes.map(n=>`<li>${h(n)}</li>`).join("")}</ul><p class="xs muted">Feedback becomes tasks when the session closes. Unreviewed items stay In review and are listed in these notes.</p></aside></div></div>`;
  }
  // debate
  const d = S.debate, paused = st==="paused";
  const decided = st==="decided" || st==="agreed" || d.state!=="open";
  const shown = DEBATE_MSGS.slice(0, decided ? DEBATE_MSGS.length : d.shown);
  const decider = d.joined ? "You" : "Maya";
  const declared = d.agreed ? `${decider} (decider) declared agreement with ${fmt(d.secs)} left` : `Time's up · ${d.joined?"you decide":"Maya decides"}`;
  return `<div class="pad">${crumbs([fromCrumb(["Bench · Team chat","team"]),["Debate: Stop button"]])}
    <div class="row between"><div><h1>Debate: Where does the Stop button live? <span class="tag solid">Live</span></h1>
      <p class="small">Participants: Sam (UX/UI), Noor (Developer), Maya (PM)${d.joined?", you":""} · <b>Decider: ${d.joined?"you (highest rank)":"Maya, highest-ranked participant"}</b></p></div>
      <div class="row"><span class="timer" role="timer" aria-live="off" aria-label="Time left" id="dTimer">${fmt(decided?(d.agreed?d.secs:0):d.secs)}</span></div></div>
    ${paused?`<div class="warn" style="margin-top:8px">Usage limit reached. The timer is paused at ${fmt(d.secs)} and resumes after the reset at 14:00.</div>`:""}
    <div class="grid2" style="margin-top:10px"><section class="card"><div class="chat scroll" id="dChat">
      <div class="sys">Point: Stop button in the composer or the header? · started by Maya from the team chat · 5:00 max</div>
      ${shown.map(([w,t])=>msgHTML({who:w,text:t,c:["0.8k"]})).join("")}
      ${d.joined?msgHTML({who:"me",text:"I'm joining. I like the both-places idea if it's one shortcut."}):""}
      ${decided?`<div class="sys">${declared}</div>${msgHTML({who:d.joined?"me":"maya",text:"Decision: Stop lives in the composer while a reply streams, and is pinned to the header when the user scrolls up. Same label, same shortcut (Esc).",c:d.joined?null:["1.1k"]})}`:""}
    </div>
    <div class="row" style="margin-top:10px">
      ${decided?`<button class="btn pri" data-act="memo">Review decision memo and close</button>`
       : d.joined?`<button class="btn pri" data-act="agree">Declare the decision now</button><button class="btn ghost" data-act="cancelDebate">Cancel debate</button>`
       : `<button class="btn pri" data-act="joinDebate">Join (you'll be the decider)</button><button class="btn ghost" data-act="cancelDebate">Cancel debate</button>`}
    </div></section>
    <aside class="card"><h2>Running cost</h2><p>${costTxt((shown.length*0.8+1).toFixed(1)+"k")}</p><p class="xs muted">Safety cap 100k tokens. If it's reached first, the decider decides.</p>
      <hr><h3>What happens on close</h3><ul class="small"><li>A decision memo (decision, attendees, rationale) is saved to Product team memory.</li><li>This chat leaves your chat list.</li><li>The raw transcript is archived in the Trace, hidden from agents, for 90 days.</li></ul></aside></div></div>`;
}

function apprCard(a, isPrimary){
  const ag = S.agents[a.agent];
  const isOut = a.kind==="outward", isRes = a.kind==="reserved", isPay = a.kind==="payment";
  const focus = S.params?.focus===a.id;
  const failed = S.st.appr==="failed" && a.id==="a3";
  const P = isPrimary ? "btn pri" : "btn";
  let actions;
  if (a.status!=="pending") actions = `<p class="small"><b>${h(a.status)}</b>${a.granted?` · <button class="link small" data-go="settings">See it in Settings › Permissions</button>`:""}</p>`;
  else if (failed) actions = "";
  else if (isPay) actions = `<div class="row"><button class="${P}" data-act="apr" data-id="${a.id}" data-v="Marked done (paid outside Bench)">I paid outside Bench: mark done</button><button class="btn" data-act="apr" data-id="${a.id}" data-v="Declined: no payment">Don't pay</button></div>`;
  else {
    const canGrant = a.kind==="work" && a.cmd;
    actions = `<div class="row"><button class="${P}" data-act="apr" data-id="${a.id}" data-v="${isOut?"Sent once":"Allowed once"}">${isOut?"Send this email":"Allow once"}</button>
        ${canGrant?`<button class="btn" data-act="grant" data-id="${a.id}" aria-describedby="scope-${a.id}">Always allow this command in ${h(a.repo)}</button>`
          :`<button class="btn" aria-disabled="true" disabled aria-describedby="why-${a.id}">Always allow</button>`}
        <button class="btn" data-act="deny" data-id="${a.id}">${isOut?"Discard":"Deny…"}</button></div>
       ${canGrant?`<p class="xs" id="scope-${a.id}"><b>What "Always allow" covers:</b> ${h(ag.name)} may run <span class="mono">${h(a.cmd)}</span> in repo ${h(a.repo)} without asking. Other commands and other repos still ask. Revoke it any time in Settings › Permissions or in ${h(ag.name)}'s profile › Autonomy.</p>`:""}
       ${isOut?`<p class="xs" id="why-${a.id}"><b>Why is "Always allow" off?</b> Every email to someone other than you needs you, one at a time. No standing rule can send email for you.</p>`:""}
       ${isRes?`<p class="xs" id="why-${a.id}"><b>Why is "Always allow" off?</b> Merging to main, deploying and releasing are reserved: they need you every time. Atlas can't approve them either.</p>`:""}`;

    <div class="row between"><div class="row"><span class="av" aria-hidden="true">${initials(ag.name)}</span><b id="t-${a.id}">${h(ag.name)} · ${h(a.action)}</b></div>
    <div class="row">${isOut?'<span class="tag solid">Outward: leaves your machine</span>':""}${isRes?'<span class="tag">Reserved: only you</span>':""}${isPay?'<span class="tag">Payment: agents never pay</span>':""}${a.kind==="work"?'<span class="tag soft">Work request</span>':""}</div></div>
    <dl class="small" style="display:grid;grid-template-columns:110px 1fr;gap:2px 8px;margin:8px 0">
     <dt class="muted">Exact target</dt><dd style="margin:0" class="mono">${h(a.target)}</dd>
     <dt class="muted">Why</dt><dd style="margin:0">${h(a.reason)}</dd>
     <dt class="muted">Came from</dt><dd style="margin:0">${h(a.source)}</dd>
     <dt class="muted">Cost so far</dt><dd style="margin:0">${a.cost==="—"?"—":costTxt(a.cost)} ${a.cost!=="—"?'<button class="link xs" data-go="trace">Trace</button>':""}</dd></dl>

    ${failed?`<div class="err" role="alert"><b>The command couldn't run.</b> Another program (probably the dev server) has the folder open. ${h(ag.name)} will close it and try again; you don't need to do anything.

const FILTERS = [["all","All"],["outward","Outward"],["reserved","Reserved"],["work","Work"],["payment","Payment"]];

function linkify(body){
  return h(body).replace(/\[\[([^\]]+)\]\]/g,(_,t)=>{ const k = NOTE_BY_TITLE(t); return k?`<button class="wikilink" data-act="openNote" data-id="${k}">${h(t)}</button>`:`<button class="wikilink unres" data-act="newNote" data-t="${h(t)}" title="Create this note">${h(t)} (no note yet)</button>`; });
}
function backlinks(k){ const t = S.notes[k].title.toLowerCase(); return Object.keys(S.notes).filter(x=>x!==k && S.notes[x].body.toLowerCase().includes("[["+t+"]]")); }
function outlinks(k){ return [...S.notes[k].body.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]); }
function graphSVG(){
  const keys = Object.keys(S.notes); const n = keys.length, cx=300, cy=200, R=150;
  const pos = {}; keys.forEach((k,i)=>{ const a = (i/n)*Math.PI*2 - Math.PI/2; pos[k]=[cx+R*Math.cos(a), cy+R*Math.sin(a)]; });
  let lines = ""; keys.forEach(k=>outlinks(k).forEach(t=>{ const j = NOTE_BY_TITLE(t); if (j) lines += `<line x1="${pos[k][0]}" y1="${pos[k][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="#8c8c8c"/>`; }));
  const dots = keys.map(k=>{ const sel = k===S.memNote, nt = S.notes[k];
     const base = nt.title.length>22?nt.title.slice(0,21)+"…":nt.title;
     const lbl = base + (nt.stale?" (stale)":"") + (sel?" (open)":"");
     return `<g role="button" tabindex="0" aria-label="Open note ${h(nt.title)}${nt.stale?", stale":""}${sel?", currently open":""}" data-act="openNote" data-id="${k}" style="cursor:pointer">
     <circle cx="${pos[k][0]}" cy="${pos[k][1]}" r="${sel?12:8}" fill="${sel?"#161616":"#fff"}" stroke="#161616" stroke-width="1.5" ${nt.stale?'stroke-dasharray="3 2"':""}/>
     <text x="${pos[k][0]}" y="${pos[k][1]+(pos[k][1]>cy?26:-16)}" text-anchor="middle" font-size="11" fill="#161616">${h(lbl)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 600 400" width="100%" role="group" aria-label="Graph of ${n} notes and their links">${lines}${dots}</svg>`;
}
function recency(u){ return u.startsWith("2026-10-22") ? "Today" : u.startsWith("2026-10-21") ? "Yesterday" : "Older"; }
function scrMem(){
  const st = S.st.mem;
  if (!S.notes[S.memNote]) S.memNote = Object.keys(S.notes)[0];
  const k = S.memNote, nt = S.notes[k];
  const scopes = ["All","Global","Product team","Dev team","Private: Noor"];
  const q = S.memQuery.toLowerCase();

  else if (st==="rebuilding") center = `<div class="warn" role="status"><b>The memory index is being rebuilt.</b> Showing the folder list; backlinks, graph and search come back in about a minute. Notes on disk are safe.</div><ul class="mono small" style="margin-top:8px">${Object.keys(S.notes).map(x=>`<li>memory/${x}.md</li>`).join("")}</ul>`;
  else center = `<div class="row between"><h2 style="margin:0">${h(nt.title)}</h2><div class="row"><button class="btn sm" data-act="state" data-v="graph">Graph view</button>${S.memEdit?`<button class="btn ghost" data-act="memEdit">Cancel</button><button class="btn pri" data-act="saveNote">Save note</button>`:`<button class="btn pri" data-act="memEdit">Edit</button>`}</div></div>
     ${nt.stale?`<div class="warn" style="margin:8px 0"><b>Stale (flagged automatically):</b> ${linkify(nt.stale)}<div class="row" style="margin-top:6px"><button class="btn sm" data-act="stale" data-v="Kept: flag cleared">Keep</button><button class="btn sm" data-act="memEdit">Update</button><button class="btn sm" data-act="stale" data-v="Merge proposed into Sprint 2 summary">Merge</button><span class="grow"></span><button class="btn sm ghost" data-act="staleDelete">Delete…</button></div></div>`:""}
     <table class="small" style="margin:8px 0"><tbody><tr><th scope="row">type</th><td>${nt.type}</td><th scope="row">scope</th><td>${nt.scope}</td></tr><tr><th scope="row">tags</th><td>${nt.tags.join(", ")||"—"}</td><th scope="row">updated</th><td>${nt.updated}</td></tr><tr><th scope="row">source</th><td colspan="3">${h(nt.source)} <button class="link xs" data-go="trace">Trace</button></td></tr></tbody></table>
     ${S.memEdit?`<label class="f">Note body (Markdown)<textarea id="noteBody" style="min-height:160px">${h(nt.body)}</textarea></label><p class="xs muted">Saved through the single memory writer; the source becomes "client".</p>`:`<div class="doc" style="padding:12px 16px">${nt.body?linkify(nt.body):'<span class="muted">Empty note.</span>'}</div>`}
     <p class="xs muted mono" style="margin-top:6px">memory/${k}.md · Obsidian-compatible</p>`;
  return `<div class="pad"><div><h1>Memory</h1><p class="small muted">Everything your agents remember, as Markdown notes on your machine. 0 tokens to browse.</p></div>
   <div class="three" style="margin-top:10px">
    <aside class="card col" aria-label="Scopes and filters">
      <label class="f">Search (keyword + meaning)<input type="text" id="memQ" value="${h(S.memQuery)}" placeholder="e.g. stop button"></label>

      <label class="row small"><input type="checkbox" data-act="staleOnly" ${st==="stale"?"checked":""}> Stale only</label>
      <h3>Notes (${list.length})</h3><ul class="wnm">${st==="empty"?'<li class="small muted">No notes yet.</li>':groups||noRes}</ul>
      ${list.length>10?`<button class="btn sm" data-act="memAll" aria-expanded="${S.memAll}">${S.memAll?"Show 10 most recent":"Show all ("+list.length+")"}</button>`:""}
      ${S.notes["old-ci"]&&S.notes["old-ci"].stale&&st!=="empty"?`<div class="card flat xs">Suggestions: 1 merge waiting. <button class="link xs" data-act="openNote" data-id="old-ci">Review</button></div>`:""}
    </aside>
    <section class="card">${center}</section>
    <aside class="card" aria-label="Links">${st==="rebuilding"||st==="graph"||st==="empty"?'<p class="small muted">Backlinks appear with a note.</p>':`<h3>Backlinks (${backlinks(k).length})</h3><ul class="small">${backlinks(k).map(b=>`<li><button class="link" data-act="openNote" data-id="${b}">${h(S.notes[b].title)}</button></li>`).join("")||"<li class='muted'>No notes link here yet.</li>"}</ul>
      <h3>Links out (${outlinks(k).length})</h3><ul class="small">${outlinks(k).map(t=>`<li>${linkify("[["+t+"]]")}</li>`).join("")||"<li class='muted'>None</li>"}</ul>`}</aside>
   </div></div>`;
}

/* ============================================================
   After-render hooks (timers, scrolling)
   ============================================================ */
const scrollDown = id => { const e = document.getElementById(id); if (e) e.scrollTop = e.scrollHeight; };
const AFTER = {
  fr(){ if (S.fr.step===1 && S.st.fr==="checking") timers.push(setTimeout(()=>{ if(S.screen==="fr"&&S.st.fr==="checking"){S.st.fr="found";render();}},1400)); },
  home(){ scrollDown("ceoChat"); if (S.st.home==="loading") timers.push(setTimeout(()=>{ if(S.screen==="home"&&S.st.home==="loading"){S.st.home="normal";render();}},1800)); },
  live(){ scrollDown("liveChat");
    if (S.st.live==="connecting") timers.push(setTimeout(()=>{ if(S.screen==="live"&&S.st.live==="connecting"){ setLive(noorWaiting()?"waiting":"running"); render(); } },1200));
    if (S.st.live==="running" && S.agentId==="noor") every(()=>{
      const max = S.run.redirect ? LIVE_STEPS.length-1 : LIVE_STEPS.length; // after a redirect, the custom formatter step never happens
      const typing = document.activeElement && document.activeElement.matches("#screen input, #screen textarea") && document.activeElement.value;
      if (S.run.steps<max && !typing){ S.run.steps++; render(); } },2200); },
  team(){ scrollDown("teamChat"); },
  session(){ scrollDown("dChat");
    if (S.st.session==="debate" && S.debate.state==="open") every(()=>{
      const d = S.debate; d.secs = Math.max(0,d.secs-1);
      if (d.secs===0){ d.state="decided"; S.st.session="decided"; render(); return; }
      if (d.secs%6===0 && d.shown<DEBATE_MSGS.length){ d.shown++; render(); return; }
      const t = $("#dTimer"); if (t) t.textContent = fmt(d.secs);
    },1000); },
  dash(){ if (S.dashFull && S.scrollFull){ S.scrollFull=false; const e=$("#fullBl"); e&&e.scrollIntoView({block:"start"}); } },
  appr(){ const f = S.params?.focus; if (f){ const e=document.getElementById("card-"+f); e&&e.scrollIntoView({block:"center"}); } },
  mem(){ const q=$("#memQ"); if(q){ q.addEventListener("input",e=>{ S.memQuery=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#memQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }); } }
};

  $("#modal").innerHTML = `<div class="overlay" data-act="closeModalBg"><div class="dialog" role="dialog" aria-modal="true" aria-label="${h(label)}">${html}</div></div>`;
  const first = $("#modal .dialog").querySelector("input,textarea,select,button"); first && first.focus();
}
function drawer(html, label){
  $("#modal").innerHTML = `<aside class="drawer" role="dialog" aria-modal="false" aria-label="${h(label)}">${html}</aside>`;
  const first = $("#modal .drawer").querySelector("button"); first && first.focus();
}

function closeSummaryReview(){
  const it = S.review.items;

  S.review.feedback.forEach((t,i)=>{ const id = "FB-"+(i+1); newTasks.push(id); S.items.push({id,title:t.slice(0,60),type:"Task",owner:"",state:"Backlog",pr:S.items.length+1,sprint:0}); });
  S.review.closed = true;
  S.notes["review-sprint-2"] = {title:"Review notes, Sprint 2",type:"meeting notes",scope:"Product team",tags:["review"],updated:"2026-10-22 10:05",source:"Lina · review session (archived)",

  revoke(el){ const ag=el.dataset.agent, cmd=el.dataset.cmd; S.grants = S.grants.filter(g=>!(g.agent===ag&&g.cmd===cmd)); render(); toast(`Revoked. ${h(S.agents[ag]?.name||ag)} will ask again before running <span class="mono">${h(cmd)}</span>.`); },
  retryA3(){ const a3=S.approvals.find(x=>x.id==="a3"); a3.status="Allowed once · retried at 09:06"; S.st.appr="normal"; if (S.run.state==="waiting") S.run.state="running"; render(); toast("Retrying. Noor will report back in her chat.",{go:"live",p:{id:"noor"},label:"Open Noor"}); },
  deny(el){ const a=S.approvals.find(x=>x.id===el.dataset.id); modal(`<h2>${a.kind==="outward"?"Discard this email?":"Deny the request"}</h2><form data-form="deny" data-id="${a.id}" class="col"><label class="f">Reason for ${h(S.agents[a.agent].name)} (helps it adapt)<textarea id="dnIn"></textarea></label><div class="row"><button class="btn pri">${a.kind==="outward"?"Discard":"Deny"}</button><button type="button" class="btn ghost" data-act="closeModal">Cancel</button></div></form>`,"Deny"); },
  traceRun(el){ S.traceRun=el.dataset.id; S.traceFilter="all"; if (el.dataset.nav){ S.st.trace="normal"; go("trace"); } else render(); },
  traceFilter(el){ S.traceFilter=el.dataset.v; render(); },
  runNow(){ toast("Running this routine once. The guard stays on for the rest."); },
  openNote(el){ closeModal(); const id=el.dataset.id; if (!S.notes[id]) return; S.memNote=id; S.memEdit=false; S.memQuery=""; S.memScope="All"; if (S.st.mem!=="graph") S.st.mem="note"; if (S.screen!=="mem") go("mem"); else render(); },
  newNote(el){ const t = el?.dataset?.t || "Untitled note"; const k = "note-"+(++S.noteSeq);
    S.notes[k] = {title:t,type:"fact",scope:"Global",tags:[],updated:"2026-10-22 10:30",source:"client",body:""};
    S.memNote=k; S.memEdit=true; S.st.mem="note"; S.memScope="All"; S.memQuery="";
    if (S.screen!=="mem") go("mem"); else render(); const b=$("#noteBody"); b&&b.focus(); },
  memEdit(){ S.memEdit=!S.memEdit; render(); },
  saveNote(){ const b=$("#noteBody"); if (!b) return; S.notes[S.memNote].body=b.value; S.notes[S.memNote].source="client (edited in browser)"; S.memEdit=false; render(); toast("Note saved and re-indexed."); },
  memScope(el){ S.memScope=el.dataset.v; render(); },
  memClear(){ S.memQuery=""; render(); const q=$("#memQ"); q&&q.focus(); },
  memAll(){ S.memAll=!S.memAll; render(); },
  staleOnly(el){ S.st.mem = el.checked?"stale":"note"; if (el.checked && S.notes["old-ci"]&&S.notes["old-ci"].stale) S.memNote="old-ci"; render(); },
  stale(el){ if (S.notes["old-ci"]) delete S.notes["old-ci"].stale; S.st.mem="note"; render(); toast(h(el.dataset.v)+"."); },
  staleDelete(){ modal(`<h2>Delete "CI matrix (old)"?</h2><p class="small">Agents will no longer recall it. The file goes to the Bench trash for 30 days; you can restore it from there.</p><div class="row"><button class="btn pri" data-act="delNote">Delete note</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`,"Delete note"); },
  delNote(){ if (!S.notes["old-ci"]) { closeModal(); return; } S.trash = {k:"old-ci", n:S.notes["old-ci"]}; delete S.notes["old-ci"]; S.memNote="sprint-2-summary"; S.st.mem="note"; closeModal(); render(); toast('Deleted "CI matrix (old)". It\'s in the Bench trash for 30 days.',{act:"undoDel",label:"Undo"}); },
  undoDel(){ if (!S.trash) return; S.notes[S.trash.k]=S.trash.n; S.memNote=S.trash.k; S.trash=null; if (S.screen==="mem") render(); toast("Note restored."); },
  checkClaude(){ toast("Claude Code 2.1 · signed in (checked just now)."); },
  startTask(el){ const v=el.dataset.v; clearTimers(); clearPend(); closeModal(); clearToast(); reset();
    if (v==="t1"){ S.screen="fr"; render(); return; }
    S.setupDone=true; S.st.home="normal"; S.st.fr="found";
    if (v==="t4"){ const a3=S.approvals.find(x=>x.id==="a3"); a3.status="Allowed once at 08:50"; S.run.state="running"; go("dash",{p:"bench"}); return; }
    if (v==="t5"){ go("team"); return; }
    go("home"); }
};

/* ============================================================
   Forms
   ============================================================ */
const FORMS = {
  ceo(){ const i=$("#ceoIn"), t=i.value.trim(); if(!t) return; i.value="";
    if (/idea/i.test(t) && S.intake===0){ runIntake(t); return; }
    if (S.intake===2){ intakeAnswer(t); return; }
    addCeo({who:"me",text:t,meta:"now"}); later(()=>addCeo({who:"atlas",text:"Noted. (Prototype: replies are scripted. Try a suggested message.)",c:["0.5k"]}),700); },
  live(){ const i=$("#liveIn"), t=i.value.trim(); if(!t) return;
    if (S.st.live==="stopped"||S.st.live==="cantundo"){ S.run.redirect=t; S.run.cancelled=false; S.run.steps=Math.min(S.run.steps,5); setLive("running"); render(); toast("New instruction sent. Logged to Dev team memory."); return; }
    toast("Message sent to "+h(S.agents[S.agentId].name)+" (prototype)."); i.value=""; },
  team(){ const i=$("#teamIn"), t=i.value.trim(); if(!t) return; S.team.push({who:"me",text:t});
    const m=t.match(/@(\w+)/); const who = m ? Object.keys(S.agents).find(k=>S.agents[k].name.toLowerCase()===m[1].toLowerCase()) : null;
    S.team.push({sys:`${who?"Bench asked "+S.agents[who].name+" to reply (you mentioned them)":"Bench asked Maya to reply (she leads the project)"} · ${costTxt("0.3k")}`});
    if (who) S.team.push({sys:`Task created: "${h(t.replace(/@\w+\s*/,"").slice(0,60))}" · owner ${S.agents[who].name} · on the Bench board`});
    S.team.push({who:who||"maya",text:who?"Got it, it's on my list.":"Noted. I'll fold it into the sprint plan.",c:["0.7k"]}); if (S.st.team==="error"||S.st.team==="empty") S.st.team="participant"; render(); },
  interview(){ const i=$("#intIn"), t=i.value.trim(); if(!t) return; S.interview.answers[S.interview.q]=t; S.interview.q++; render(); const n=$("#intIn"); n&&n.focus(); },
  review(){ const i=$("#revIn"), t=i.value.trim(); if(!t) return; S.review.notes.push("Client: \""+t+"\""); S.review.feedback.push(t); render(); },
  addAgent(){ const n=$("#naName").value.trim(); if(!n||n.length>40||Object.values(S.agents).some(a=>a.name.toLowerCase()===n.toLowerCase())){ $("#naErr").textContent="Use a unique name of 1–40 characters."; $("#naName").setAttribute("aria-invalid","true"); $("#naName").focus(); return; }
    const id="new"+Date.now(); const home=$("#naHome").value;
    S.agents[id]={name:n,role:$("#naRole").value.trim()||"Agent",team:home,lead:false,model:"Sonnet",auto:"Ask every time",state:"Active",run:"idle",desc:$("#naRole").value.trim()||"New agent.",conn:["bench"],folders:[],ctx:80,task:"Idle"};
    (S.added=S.added||[]).push(id); S.selNode=id; closeModal(); render(); toast(h(n)+" created in the "+h(home)+". Add connectors and folders in its profile.",{go:"agent",p:{id},label:"Open profile"}); },
  revReject(f){ const t=$("#rjIn").value.trim(); if(!t){ $("#rjErr").textContent="Write what should change. It goes back to the agent word for word."; $("#rjIn").focus(); return; }
    const id=f.dataset.id; S.review.items[id]="Rejected"; S.review.notes.push(id+" rejected: \""+t+"\""); const it=S.items.find(i=>i.id===id); if(it){ it.state="In progress"; it.comment=t; } closeModal(); render(); toast(id+" sent back to its owner with your comment (saved in its memory)."); },
  propReject(){ const t=$("#prIn").value.trim(); if(!t){ $("#prErr").textContent="A comment is required."; return; } S.rejectComment=t; S.st.proposal="rejected"; S.proposal="rejected"; closeModal(); render(); },
  deny(f){ const a=S.approvals.find(x=>x.id===f.dataset.id); const reason=$("#dnIn")?.value||"no reason given"; a.status = a.kind==="outward"?"Discarded":"Denied"; if (a.id==="a3" && S.run.state==="waiting") S.run.state="running"; closeModal(); render(); toast(h(S.agents[a.agent].name)+" was told: "+h(reason)); },
  folder(){ const v=$("#cfIn").value.trim(); if (!v) return; S.fr.folder=v; S.st.proposal="preview"; closeModal(); render(); toast("Bench folder set to "+h(v)+". Press \"Create project\" again."); },
  settings(){ const v=+$("#ckIn").value; if (!(v>=50&&v<=85)){ S.st.settings="error"; render(); const i=$("#ckIn"); i&&i.focus(); return; } S.ckpt=v; S.st.settings="normal"; S.setDirty=false; render(); toast("Settings saved. Default checkpoint threshold is "+v+" %."); }
};

/* ============================================================
   Event delegation
   ============================================================ */
function trackDirty(el){
  if (!el || !el.closest) return;
  if (S.screen==="agent" && el.closest("#agPanel") && !el.disabled){
    S.agentDirty[el.dataset.f || el.getAttribute("aria-label") || el.name || "field"] = 1;
    const d=$("#agDirty"); if (d) d.textContent = dirtyTxt();
  }
  if (S.screen==="settings" && el.closest("#setForm") && el.tagName!=="BUTTON"){ S.setDirty = true; const d=$("#setDirty"); if (d) d.textContent = "Unsaved changes"; }
}
document.addEventListener("click", ev => {
  const actEl = ev.target.closest("[data-act]");
  const goEl = ev.target.closest("[data-go]");
  if (actEl && actEl.tagName!=="INPUT" && actEl.tagName!=="SELECT" && ACT[actEl.dataset.act]){
    if (actEl.dataset.act==="closeModalBg"){ ACT.closeModalBg(actEl, null, ev); return; }
    if (actEl.disabled) return;
    ACT[actEl.dataset.act](actEl, null, ev);
  }
  if (goEl && !goEl.disabled){
    ev.preventDefault();
    if (goEl.closest("#toast")) clearToast();
    closeModal();
    go(goEl.dataset.go, goEl.dataset.p?JSON.parse(goEl.dataset.p):null);
  }
});
document.addEventListener("change", ev => { const el = ev.target; trackDirty(el);
  const a = el.closest && el.closest("[data-act]");
  if (a && (a.tagName==="INPUT"||a.tagName==="SELECT") && a.type!=="range" && a.type!=="text" && ACT[a.dataset.act]) ACT[a.dataset.act](a); });
document.addEventListener("input", ev => { const el = ev.target;
  if (el.dataset?.act==="agCkpt") ACT.agCkpt(el);
  if (el.dataset?.act==="ikName") S.ikNames[el.dataset.id]=el.value;
  if (el.type!=="checkbox" && el.type!=="radio") trackDirty(el); });
document.addEventListener("submit", ev => { const f = ev.target.closest("[data-form]"); if (f){ ev.preventDefault(); if (FORMS[f.dataset.form]) FORMS[f.dataset.form](f); } });
document.addEventListener("keydown", ev => {
  if (ev.key==="Escape" && $("#modal").innerHTML) closeModal();
  if ((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("g[role=button]")){ ev.preventDefault(); ACT.openNote(ev.target); }
});
reset(); render();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Quartet app icon, Windows">
  <!-- Windows master: a rounded tile (r 10), Ink glass, the four characters in colour at 60 %. Export the ICO sizes 16–256 from this file.
       Source: brand/explorations/explorations.html -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f38"/><stop offset="1" stop-color="#15171d"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="tile"><rect width="100" height="100" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#hl)"/>
    <rect width="100" height="100" rx="10" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/>
  </g>
  <g transform="translate(20 20) scale(.6)">
    <circle cx="26" cy="26" r="20" fill="#ff5f73"/>
    <path d="M74 10 L91 43 L57 43 Z" fill="#f2ab1d" stroke="#f2ab1d" stroke-width="6" stroke-linejoin="round"/>
    <rect x="7" y="55" width="38" height="38" rx="12" fill="#3cc47c"/>
    <path transform="translate(51.1 50.3) scale(.46)" d="M50 8 C60 24 84 44 84 64 C84 83 69 95 50 95 C31 95 16 83 16 64 C16 44 40 24 50 8 Z" fill="#e05cb4"/>
  </g>
</svg>

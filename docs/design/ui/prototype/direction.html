.setrow .lockv{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);white-space:nowrap;flex:none}
.setrow .lockv svg{width:14px;height:14px}
.stamp{display:inline-flex;align-items:center;gap:6px}
.stamp svg{width:14px;height:14px;color:var(--ok-ink)}
.rcs{display:grid;gap:8px}
.rc{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow var(--dur-micro) ease}
.rc:hover{box-shadow:inset 0 0 0 1px rgb(21 23 29 / .22)}
.rc:has(input:checked){box-shadow:inset 0 0 0 2px var(--text-1)}
.rc:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.rc input{flex:none;width:16px;height:16px;margin:3px 0 0;accent-color:var(--text-1)}
.rc input:focus-visible{outline:none}
.rc-b{flex:1;min-width:0}
.rc-b b{display:block;font-weight:600}
.rc-b span{display:block;margin-top:2px;font-size:12px;line-height:16px;color:var(--text-3)}
.rc-e{flex:none;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rc-e small{display:block;font-size:12px;font-weight:400;color:var(--text-3)}
.ck-row{display:flex;align-items:baseline;gap:10px}
.ck-row output{font:600 20px/26px var(--font-display);font-variant-numeric:tabular-nums}
.ck input[type="range"]{display:block;width:100%;margin:10px 0 2px;accent-color:var(--text-1)}
.ck-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3)}
.ck .bar{height:8px;margin:16px 0 8px}
.ck .bar>i{background:var(--porcelain-300)}
.ck-leg{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 10px;font-size:12px;color:var(--text-3)}
.ck-leg span{display:inline-flex;align-items:center;gap:6px}
.ck-leg i{display:inline-block;flex:none}
.lg-t{width:2px;height:12px;border-radius:1px;background:var(--text-2)}
.lg-z{width:14px;height:8px;border-radius:2px;background:repeating-linear-gradient(135deg,rgb(21 23 29 / .3) 0 2px,transparent 2px 5px)}
.spark{display:block;width:100%;height:44px;margin-top:8px}
.memhead{display:flex;align-items:center;gap:16px;padding:0 0 8px;margin-bottom:8px}
.memhead .big{font:600 20px/26px var(--font-display);font-variant-numeric:tabular-nums}
.pf-av{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.nprev{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-ground)}
.nprev>div{flex:1;min-width:0}
.danger-zone{margin-top:28px;padding-top:4px;box-shadow:inset 0 1px 0 var(--line)}
.danger-zone .setrow{box-shadow:none}
.del-box{display:grid;gap:6px;padding:4px 0 0}
.del-box label{font-size:13px;font-weight:600}
@container (max-width:540px){
  .set{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .set-nav{display:flex;gap:4px;overflow-x:auto;box-shadow:inset 0 -1px 0 var(--line-subtle)}
  .set-nav h3{display:none}
  .set-nav button{flex:none;width:auto;min-height:36px}
  .set-nav span{display:none}
}
/* take-over */
.takeover{position:fixed;inset:0;z-index:450;display:flex;flex-direction:column;background:var(--bg-surface);transition:clip-path var(--dur-scene) var(--spring-smooth)}
.to-head{display:flex;align-items:center;gap:12px;padding:12px 20px;box-shadow:inset 0 -1px 0 var(--line-subtle)}
.to-head .grow b{display:block;font-weight:600}
.to-head .grow span{font-size:12px;color:var(--text-3)}
.to-body{flex:1;position:relative;overflow:auto;cursor:none}
.to-body .diff{font-size:14px;line-height:24px;padding:20px 0}
.cursor{position:absolute;left:420px;top:180px;pointer-events:none;display:flex;align-items:flex-start;gap:2px;z-index:2}
.cursor svg{width:18px;height:18px}
.cursor span{margin-top:14px;padding:2px 8px;border-radius:999px;background:var(--text-1);color:#fff;font-size:12px;font-weight:600}

/* ---------- team chat ---------- */
.tc-head{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 16px 6px 20px}
.tc-head h1{font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.tc-members{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 6px;border-radius:999px;font-size:13px;color:var(--text-2);transition:background-color var(--dur-micro) ease}
.tc-members:hover,.tc-members[aria-expanded="true"]{background:var(--state-hover);color:var(--text-1)}
/* The debate is one quiet line: live, the question, time left, and its one blue (Join and decide) */
.debate{flex:none;display:flex;align-items:center;gap:10px;margin:4px 20px 0;padding:6px 6px 6px 14px;background:var(--bg-surface);border-radius:999px;box-shadow:var(--elev-1);min-width:0}
.debate .grow{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:18px;color:var(--text-2)}
.debate .grow b{font-weight:600;color:var(--text-1)}
.live-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--text-1);box-shadow:0 0 0 3px rgb(21 23 29 / .1)}
.timer-t{flex:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.debate.closing{animation:condense var(--dur-scene) var(--spring-smooth) both}
.memo{flex:none;display:flex;align-items:center;gap:10px;margin:4px 20px 0;padding:6px 6px 6px 14px;background:var(--bg-surface);border-radius:999px;box-shadow:var(--elev-1);min-width:0;font-size:13px;line-height:18px}
.memo.grow-in{animation:memoIn var(--dur-scene) var(--spring-smooth) both}
.memo>svg{flex:none;width:16px;height:16px;color:var(--text-2)}
.memo .grow{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo b{font-weight:600}
.tc-split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.tc-split.roster-on{grid-template-columns:minmax(0,1fr) 248px}
.tc-conv{display:flex;flex-direction:column;min-height:0;background:var(--bg-ground);--cut:var(--bg-ground)}
.roster{overflow-y:auto;padding:16px 8px;background:var(--bg-surface);box-shadow:inset 1px 0 0 var(--line-subtle);--cut:var(--bg-surface)}
.roster h2{padding:0 10px 6px;font-size:12px;font-weight:600;color:var(--text-3)}
.roster ul{list-style:none}
.rrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:6px 10px;border-radius:var(--r-sm);corner-shape:var(--corner)}
.rrow b{display:block;font-weight:400;line-height:20px}
.rrow span.t-meta{display:block;color:var(--text-3)}

/* ---------- project view, split view ---------- */
.splitv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--lw,50%)) 9px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.sv-div{position:relative;cursor:col-resize;touch-action:none}
.sv-div::before{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line);transition:background-color var(--dur-micro) ease,width var(--dur-micro) ease,left var(--dur-micro) ease}
.sv-div::after{content:"";position:absolute;top:50%;left:2px;width:5px;height:32px;margin-top:-16px;border-radius:3px;background:var(--porcelain-300)}
.sv-div:hover::before,.sv-div:focus-visible::before,.sv-div.drag::before{left:3px;width:3px;background:var(--text-2)}
.sv-div:focus-visible{outline:none}
.pv{display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;background:var(--bg-ground)}
#p-project .pv{flex:1}
.pv-head{flex:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px 8px 24px;width:100%;max-width:1040px;margin:0 auto;box-sizing:border-box}
.pv-id{flex:1;min-width:0}
.pv-id h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-id .t-meta{display:block;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-body{flex:1;min-height:0;overflow-y:auto}
.pv-inner{max-width:1040px;margin:0 auto;padding:4px 24px 40px}
.pv-sec{margin-top:32px}
.pv-needs{display:inline-flex;align-items:center;gap:8px;height:32px;margin-top:16px;padding:0 12px 0 6px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-1);transition:background-color var(--dur-micro) ease}
.pv-needs:hover{background:var(--state-hover)}
.pv-needs svg{width:14px;height:14px;color:var(--text-3)}
.pv-sec>h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600}
.pv-none{color:var(--text-3)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col h4{display:flex;gap:6px;margin:0 0 8px;font-size:12px;font-weight:600;color:var(--text-3)}
.col h4 span{font-weight:400}
.col ul{list-style:none;display:grid;gap:8px}
.col .colempty{padding:4px 0;font-size:12px;line-height:16px;color:var(--text-3)}
.bcard{display:grid;gap:6px;padding:12px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1);--cut:var(--bg-surface)}
.bcard .bt{font-size:13px;line-height:18px;font-weight:600;overflow-wrap:anywhere}
.bcard .bm{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;line-height:16px;color:var(--text-3)}
.col-more{margin:8px 2px 0;font-size:12px;color:var(--text-3)}
.setup{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.setup .grow b{display:block;font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.setup .grow p{color:var(--text-2)}
.setup.gather .stack>.av+.av{margin-left:-12px}
.setup.gather .stack{animation:hop .64s var(--spring-gentle) .3s 1}
.setup .stack>.av{transition:margin var(--dur-scene) var(--spring-smooth)}
@container (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
@container (max-width:440px){.pv-head .stack{display:none}}
.dropzones{position:absolute;inset:0;z-index:40;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:rgb(243 244 247 / .94)}
.dz{display:grid;place-items:center;padding:16px;border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:inset 0 0 0 2px var(--line-control);font-weight:600;color:var(--text-2);text-align:center}
.dz.over{box-shadow:inset 0 0 0 2px var(--text-1);color:var(--text-1);background:var(--bg-surface)}

/* ---------- insight: memory, usage, trace, needs ---------- */
.page{max-width:1080px;width:100%;margin:0 auto;padding:12px 40px 56px}
.page.narrow{max-width:760px}
.mem-learned{flex:none;margin:0 24px 12px}
.mem-learned .learned{margin-top:0}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.page-h h1{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.page-h p{color:var(--text-2);margin-top:2px}
.page-h .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.history{list-style:none;display:grid;gap:8px}
.history li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);--cut:var(--bg-surface)}
.history li .grow b{display:block;font-weight:600}
.history li .grow span{display:block;font-size:12px;line-height:16px;color:var(--text-3)}
.mem{flex:1;min-height:0;display:grid;grid-template-columns:224px 300px minmax(0,1fr);margin:0 24px 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);overflow:hidden}
.mem-top{flex:none;display:flex;align-items:center;gap:16px;padding:4px 24px 14px}
.mem-top h1{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.mem-top .acts{margin-left:auto;display:flex;gap:8px}
.mem-scopes{overflow-y:auto;padding:12px 8px;box-shadow:inset -1px 0 0 var(--line-subtle);--cut:var(--bg-surface)}
.mem-scopes h3{margin:12px 10px 4px;font-size:12px;font-weight:600;color:var(--text-3)}
.mem-scopes h3:first-child{margin-top:0}
.mem-scopes button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;text-align:left}
.mem-scopes button:hover{background:var(--state-hover)}
.mem-scopes button[aria-current="true"]{background:var(--state-selected);font-weight:600}
.mem-scopes button .n{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:400;font-variant-numeric:tabular-nums}
.mem-scopes button svg{width:16px;height:16px;color:var(--text-2);flex:none}
.mem-list{overflow-y:auto;box-shadow:inset -1px 0 0 var(--line-subtle)}
.mem-list .srch{padding:12px}
.mem-list ul{list-style:none;padding:0 8px 12px}
.mem-list li button{display:grid;gap:2px;width:100%;padding:10px 12px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left}
.mem-list li button:hover{background:var(--state-hover)}
.mem-list li button[aria-current="true"]{background:var(--state-selected)}
.mem-list li b{font-size:13px;line-height:18px;font-weight:600}
.mem-list li span{font-size:12px;line-height:16px;color:var(--text-3)}
.mem-note{overflow-y:auto;padding:20px 28px 28px;min-width:0}
.mem-note h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;margin-top:8px}
.mem-note .srcline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--text-3)}
.mem-note .md{margin-top:16px;max-width:62ch;color:var(--text-1)}
.mem-note .md p+p,.mem-note .md ul{margin-top:10px}
.mem-note .md ul{padding-left:20px}
.fm{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-sunken);font:12px/18px var(--font-mono);color:var(--text-2);white-space:pre}
.backlinks{margin-top:24px;padding-top:16px;box-shadow:inset 0 1px 0 var(--line)}
.backlinks h3{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.backlinks ul{list-style:none;display:grid;gap:4px}
.backlinks li{display:flex;gap:8px;align-items:center;font-size:13px}
.backlinks li .t-meta{color:var(--text-3)}
.use-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);padding:20px;--cut:var(--bg-surface)}
.card>h2{font-size:15px;font-weight:600;margin-bottom:12px}
.card+.card{margin-top:16px}
.use-big{display:flex;align-items:center;gap:20px}
.use-big .fig{font:600 28px/34px var(--font-display);letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.use-big p{color:var(--text-2)}
.use-bar{margin-top:20px}
.use-bar .bar{height:8px}
.use-bar .ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.brk{list-style:none;display:grid;gap:10px}
.brk li{display:grid;grid-template-columns:24px 56px minmax(0,1fr) 128px;gap:10px;align-items:center;font-size:13px}
.brk li .bar{height:6px}
.brk li .v{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;font-size:12px}
.resume{list-style:none;display:grid;gap:8px;counter-reset:r}
.resume li{display:flex;align-items:center;gap:10px;font-size:13px}
.resume li::before{counter-increment:r;content:counter(r);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg-sunken);font-size:12px;font-weight:600;flex:none}
.trc{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);margin:0 24px 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);overflow:hidden;--cut:var(--bg-surface)}
.trc-runs{overflow-y:auto;padding:12px 8px;box-shadow:inset -1px 0 0 var(--line-subtle)}
.trc-runs button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;width:100%;padding:10px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left}
.trc-runs button:hover{background:var(--state-hover)}
.trc-runs button[aria-current="true"]{background:var(--state-selected)}
.trc-runs b{font-size:13px;font-weight:600;line-height:18px}
.trc-runs span.t-meta{grid-column:2;color:var(--text-3)}
.trc-steps{overflow-y:auto;padding:16px 24px 24px;min-width:0}
.trc-steps h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.steps{list-style:none;margin-top:16px;display:grid;gap:2px}
.step{display:grid;grid-template-columns:56px 20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;line-height:18px}
.step:hover{background:var(--state-hover)}
.step .tm{color:var(--text-3);font-variant-numeric:tabular-nums}
.step>svg{width:16px;height:16px;margin-top:1px;color:var(--text-2)}
.step .tok{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.step .d{color:var(--text-3);font-size:12px;line-height:16px;margin-top:2px}
.step.mem>svg{color:var(--agent-ink)}
.step.gate{background:var(--attn-tint)}
.step.gate>svg{color:var(--attn-ink)}

/* ---------- first run ---------- */
.firstrun{height:calc(100vh - 48px);overflow-y:auto;background:var(--bg-ground)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:64px;max-width:1120px;margin:0 auto;padding:32px 48px 48px;min-height:100%;align-items:center}
.fr-stage{display:grid;justify-items:center;gap:12px;align-self:center;text-align:center}
.fr-stage .birth{position:relative;width:144px;height:153px}
.fr-stage .birth>*{position:absolute;inset:0}
.fr-stage .birth .hero-av{width:144px;height:153px}
.fr-stage .nametag{margin-top:0}
.fr-stage .nametag.drop{animation:tagDrop var(--dur-move) var(--spring-snappy) both}
.fr-stage .say{max-width:36ch;color:var(--text-2)}
.fr-main .brandrow{display:flex;align-items:center;gap:12px}
.fr-main h1{margin-top:28px;font:600 var(--fs-display)/var(--lh-display) var(--font-display);letter-spacing:-.032em}
.fr-main .lede{margin-top:8px;color:var(--text-2);max-width:46ch}
.steps-fr{list-style:none;margin-top:28px;display:grid;gap:8px}
.sfr{background:transparent;border-radius:var(--r-lg);corner-shape:var(--corner);transition:background-color var(--dur-move) ease,box-shadow var(--dur-move) ease}
.sfr-h{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px}
.sfr-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-control);font-size:12px;font-weight:600;color:var(--text-3);flex:none}
.sfr-h b{font-weight:600}
.sfr-h .res{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sfr.done .sfr-n{background:var(--ok-tint);box-shadow:none;color:var(--ok-ink)}
.sfr.done .sfr-n svg{width:14px;height:14px}
.sfr.todo{opacity:.6}
.sfr.cur{background:var(--bg-surface);box-shadow:var(--elev-2)}
.sfr.cur .sfr-n{background:var(--text-1);color:#fff;box-shadow:none}
.sfr-b{padding:0 20px 20px 52px}
.sfr-b p{color:var(--text-2);max-width:52ch}
.sfr-b .acts{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.sfr-b .why{font-size:12px;color:var(--text-3)}
.found{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;color:var(--text-1)}
.found svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ok-ink)}
.fr-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--text-2)}
.fr-note svg{width:16px;height:16px;flex:none;margin:1px 1px 0;color:var(--text-3)}
.found b{font-weight:600;display:block}
.found span{color:var(--text-2);display:block}
.creating{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--text-2)}

/* ---------- system sheet ---------- */
.sheet{height:calc(100vh - 48px);overflow-y:auto;background:var(--bg-surface)}
.sheet-wrap{max-width:1120px;margin:0 auto;padding:48px 48px 96px}
.sheet .lede{max-width:62ch;margin-top:8px;color:var(--text-2)}
.sheet section{padding:40px 0;box-shadow:inset 0 1px 0 var(--line)}
.sheet section:first-of-type{box-shadow:none;padding-top:24px}
.sheet h2{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.sheet h3{font-size:15px;font-weight:600;margin:24px 0 12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.swatch{border-radius:var(--r-md);corner-shape:var(--corner);overflow:hidden;background:var(--bg-surface);box-shadow:var(--elev-1)}
.swatch i{display:block;height:56px;box-shadow:inset 0 -1px 0 var(--line-subtle)}
.swatch div{display:grid;gap:1px;padding:8px 10px 10px;font-size:12px;line-height:16px;color:var(--text-3)}
.swatch b{font-size:13px;color:var(--text-1);font-weight:600}
.aa{font-size:12px;font-weight:600;color:var(--ok-ink)}
.aa.fail{color:var(--danger-ink)}
table.spec{width:100%;border-collapse:collapse;font-size:13px}
table.spec th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:8px 12px 8px 0;box-shadow:inset 0 -1px 0 var(--line)}
table.spec td{padding:10px 12px 10px 0;box-shadow:inset 0 -1px 0 var(--line-subtle);vertical-align:middle}
.gallery{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.gallery figure{display:grid;justify-items:center;gap:8px;text-align:center}
.gallery figcaption{font-size:12px;line-height:16px;color:var(--text-3)}
.gallery figcaption b{display:block;color:var(--text-1);font-size:13px;font-weight:600}
.shape-demo{display:flex;flex-wrap:wrap;gap:16px}
.shape-demo div{display:grid;place-items:center;width:220px;height:84px;padding:8px 12px;background:var(--bg-ground);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--text-2);text-align:center;corner-shape:var(--corner)}

/* ---------- moments: arrivals, birth, picker, first receipt ---------- */
.arrive{animation:rise var(--dur-short) var(--ease-out) both}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg button{height:32px;padding:0 12px;border-radius:999px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .16);font-size:13px;font-weight:600;color:var(--text-1);transition:box-shadow var(--dur-micro) ease}
.sugg button:hover{box-shadow:inset 0 0 0 1px rgb(21 23 29 / .3)}
.birth-wrap{text-align:center;padding:20px 0 4px}
.birth{position:relative;width:96px;height:102px;margin:0 auto}
.birth>.hero-av{position:absolute;inset:0;width:100%;height:100%;margin:0}
.knows{display:flex;align-items:center;gap:6px;margin:10px 0 0 42px;font-size:13px;line-height:18px;color:var(--text-2)}
.knows svg{color:var(--agent-ink);flex:none}
/* C4: the draft's name pill is a button; click it and it becomes the field, in the same pill */
.nm-btn{display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 48px);cursor:text;transition:box-shadow var(--dur-micro) ease}
.nm-btn svg{flex:none;width:14px;height:14px;color:var(--text-3)}
.nm-btn:hover{box-shadow:0 0 0 1px rgb(21 23 29 / .2),var(--elev-1)}
.nm-btn:hover svg{color:var(--text-1)}
.nm-inp{width:200px;max-width:calc(100% - 48px);border:0;text-align:center;font:600 15px/26px var(--font-text);box-shadow:inset 0 0 0 2px var(--focus);color:var(--text-1)}
.nm-inp:focus{outline:none}
.nm-inp[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--danger-ink)}
.nm-err{max-width:40ch;margin:6px auto 0;font-size:12px;line-height:16px;color:var(--danger-ink)}
.picker{display:grid;justify-items:center;gap:10px;padding:2px 24px 12px;text-align:center}
.picker .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip-shape{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-sunken);transition:box-shadow var(--dur-micro) ease,background-color var(--dur-micro) ease}
.chip-shape span{display:block;width:22px;height:22px}
.chip-shape svg{display:block;width:100%;height:100%}
.chip-shape:hover{background:var(--porcelain-150)}
.chip-shape[aria-checked="true"]{background:var(--bg-surface);box-shadow:0 0 0 2px var(--text-1)}
.chip-hue{width:24px;height:24px;border-radius:50%;transition:box-shadow var(--dur-micro) ease,opacity var(--dur-micro) ease}
.chip-hue.used{opacity:.35}
.chip-hue:hover{opacity:1}
.chip-hue[aria-checked="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg-surface),0 0 0 4px var(--text-1)}
.np-team{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px 8px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-ground)}
.npm{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0;--cut:var(--bg-ground)}
.npm figcaption{min-width:0;max-width:100%}
.npm figcaption b{display:block;font-size:12px;line-height:16px;font-weight:600}
.npm figcaption span{display:block;font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hintbubble{display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin-top:8px;padding:6px 6px 6px 12px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-inverse);color:var(--text-inverse);font-size:13px;line-height:18px;box-shadow:var(--elev-3)}
.hintbubble svg{flex:none;color:var(--cobalt-300)}
.digest .wake{--cut:var(--bg-surface)}

/* ---------- keyframes ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dotp{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes blinkOnce{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,-3px)}60%{transform:translate(3px,-3px)}}
@keyframes scan{from{transform:translate(-3px,1px)}to{transform:translate(3px,1px)}}
@keyframes rise{from{opacity:0;transform:translateY(var(--rise))}}
@keyframes fadeIn{from{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes dlgIn{from{opacity:0;transform:scale(.97)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes timer{to{transform:scaleX(0)}}
@keyframes tickOut{to{transform:translateY(-100%);opacity:0}}
@keyframes tickIn{from{transform:translateY(100%);opacity:0}}
@keyframes ckRow{from{opacity:.25}}
@keyframes ckDraw{from{stroke-dashoffset:24}}
@keyframes learned{0%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 var(--agent-tint)}30%{box-shadow:inset 0 0 0 1px var(--agent-base),0 0 0 6px var(--agent-tint)}100%{box-shadow:inset 0 0 0 1px var(--line),0 0 0 0 var(--agent-tint)}}
@keyframes hoFly{0%{offset-distance:0%;opacity:0;scale:.7}14%{offset-distance:0%;opacity:1;scale:1;animation-timing-function:cubic-bezier(.65,0,.35,1)}76%{offset-distance:100%;opacity:1;scale:1}100%{offset-distance:100%;opacity:0;scale:.4}}
@keyframes hoBump{0%,100%{transform:scale(1)}35%{transform:scale(1.1,.92)}70%{transform:scale(.97,1.03)}}
@keyframes ndIn{from{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes ndOut{to{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes catch{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rowFlash{0%{background:var(--agent-tint,var(--state-selected))}100%{background:transparent}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes tagDrop{from{opacity:0;transform:translateY(-10px)}}
@keyframes condense{to{opacity:0;transform:scaleY(.6);transform-origin:top}}
@keyframes memoIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes inkFill{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fadeOut{to{opacity:0}}
.tick{display:inline-grid;overflow:hidden;vertical-align:top;line-height:inherit}
.tick>span{grid-area:1/1}
.tick .o{animation:tickOut var(--dur-move) var(--spring-snappy) forwards}
.tick .n{animation:tickIn var(--dur-move) var(--spring-snappy) both}

/* ---------- reduced motion: the same information at rest ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important;scroll-behavior:auto!important}
  .hero-av .body,.hero-av .blink,.hero-av .look,.g-spin,.g-think circle,.tdots i,.think-dots i,.busy-dots i{animation:none!important}
  .applied.glow{animation:none!important;box-shadow:inset 0 0 0 1px var(--agent-base),0 0 0 3px var(--agent-tint)}
}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}
html.rm .hero-av .body,html.rm .hero-av .blink,html.rm .hero-av .look,html.rm .g-spin,html.rm .g-think circle,html.rm .tdots i,html.rm .think-dots i,html.rm .busy-dots i{animation:none!important}
html.rm .applied.glow{animation:none!important;box-shadow:inset 0 0 0 1px var(--agent-base),0 0 0 3px var(--agent-tint)}
</style>
</head>
<body>

<!-- ============ Prototype chrome (not part of the UI) ============ -->
<header class="demo" aria-label="Prototype controls (not part of the UI)">
  <div class="demo-id"><b>Direction v0.4 · calm</b></div>
  <div class="demo-tabs" role="tablist" aria-label="Sample screens">
    <button role="tab" id="t-home" data-scr="home" aria-selected="true">Home</button>
    <button role="tab" id="t-agent" data-scr="agent" aria-selected="false" tabindex="-1">Noor</button>
    <button role="tab" id="t-team" data-scr="team" aria-selected="false" tabindex="-1">Team chat</button>
    <button role="tab" id="t-split" data-scr="split" aria-selected="false" tabindex="-1">Split view</button>
    <button role="tab" id="t-tokens" data-scr="tokens" aria-selected="false" tabindex="-1">System</button>
  </div>
  <label><span class="sr">Jump to a state, worst moment or flow</span><select id="jump"></select></label>
  <button type="button" class="demo-play" id="playBtn" hidden><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"/></svg><span id="playLbl">Play the moment</span></button>
  <label id="heroDemo" hidden><span class="sr">Noor's state (demo)</span><select id="heroSel">
    <option value="live">Noor: live</option><option value="idle">Idle</option><option value="thinking">Thinking</option><option value="working">Working</option>
    <option value="waiting">Needs you</option><option value="blocked">Blocked</option><option value="paused">Paused</option><option value="error">Error</option><option value="done">Done</option>
  </select></label>
  <label class="demo-rm demo-snd" title="The three sounds play in the demos once you've clicked or pressed a key"><input type="checkbox" id="sndToggle" checked> Sound</label>
  <label class="demo-rm"><input type="checkbox" id="rmToggle"> Reduce motion</label>
</header>

<!-- ============ App ============ -->
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Your team and navigation">
    <div class="side-top">
      <a class="brand" href="#home" aria-label="bench, Home" id="brandLink"></a>
      <button type="button" class="btn icon" id="sideToggle" aria-expanded="true" aria-label="Collapse the sidebar" title="Collapse the sidebar"></button>
      <button type="button" class="btn icon" data-menu="new" aria-haspopup="menu" aria-expanded="false" aria-label="New agent or project" title="New agent or project" id="newBtn"></button>
    </div>
    <div class="side-search"><span id="searchIc"></span><input type="search" id="sideSearch" placeholder="Search your team" aria-label="Search agents and chats"><span class="kbd" aria-hidden="true">Ctrl K</span></div>
    <nav class="side-scroll" id="sideList" aria-label="Agents, projects and pages"></nav>
    <div class="side-foot">
      <span class="me-av" aria-hidden="true">M</span>
      <div class="grow fade"><div class="strong ellip" style="font-size:13px;line-height:18px">You</div></div>
      <button type="button" class="btn icon fade" data-act="stub" aria-label="Settings" title="Settings" id="gearBtn"></button>
    </div>
  </aside>

  <div class="main" id="main">
    <div class="topbar">
      <nav class="crumbs" aria-label="Breadcrumb" id="crumbs"></nav>
      <div class="top-r">
        <button type="button" class="quiet" id="ringBtn" data-go="usage"></button>
        <button type="button" class="quiet" id="needsTop" aria-haspopup="dialog" aria-expanded="false" aria-controls="needsOv"></button>
      </div>
    </div>
    <div id="bannerHost"></div>

    <section class="screen home" id="p-home" aria-label="Home: Atlas" data-hue="lavender"></section>

    <!-- AGENT PAGE (Noor): the chat; the panel (screen, routines, settings) starts closed -->
    <section class="screen" id="p-agent" aria-label="Noor" hidden data-hue="coral">
      <div class="split pane-off" id="split">
        <div class="chatroom" id="conv">
          <div class="ahead" id="nHead"></div>
          <div class="chat-scroll" id="convScroll">
            <div class="hero-wrap" id="nHero"></div>
            <div class="msgs" id="nMsgs"></div>
          </div>
          <form class="composer" id="nForm" aria-label="Message Noor">
            <button type="button" class="btn icon" aria-label="Attach a file" data-act="stub" id="nAttach"></button>
            <textarea id="nIn" rows="1" placeholder="Message Noor · after this step" aria-label="Message Noor"></textarea>
            <button type="button" class="btn secondary" id="nStop"></button>
            <button type="submit" class="btn icon inkbtn" id="nSend" aria-label="Send to Noor" disabled></button>
          </form>
          <p class="comp-hint" id="nHint"></p>
        </div>
        <aside class="ws" id="wsPane" aria-label="Noor's panel: screen, routines and settings" inert>
          <div class="ws-inner">
            <div class="ws-head">
              <button type="button" class="btn icon sm" id="wsBack" aria-label="Back to the screen and routines" title="Back" hidden></button>
              <h2 class="ws-h" id="wsTitle"></h2>
              <span class="cap" id="wsCap"></span>
              <span class="grow"></span>
              <button type="button" class="btn icon" id="wsGear" aria-pressed="false" aria-label="Noor's settings" title="Settings"></button>
              <button type="button" class="btn icon" id="wsClose" aria-label="Close the panel" title="Close"></button>
            </div>
            <div class="ws-panel" data-wpanel="home">
              <div class="ws-scroll">
                <div id="scrSlot"></div>
                <div id="guardSlot"></div>
                <div class="rt-head"><h3 id="rtH">Routines</h3><span class="rt-cap" id="rtCap"></span><button type="button" class="btn tertiary sm" id="rtNewBtn" aria-controls="rtNew"></button></div>
                <form class="rt-new" id="rtNew" aria-label="New routine" hidden>
                  <label for="rtIn">Describe the routine</label>
                  <div class="rt-new-row"><input class="inp sm" id="rtIn" autocomplete="off" placeholder="every Friday at 4 pm, list the merged PRs"><button type="submit" class="btn secondary sm">Draft it</button></div>
                  <div id="rtOut" aria-live="polite"></div>
                </form>
                <ul class="rt-list" id="rtList" aria-labelledby="rtH"></ul>
                <p class="ws-quiet" id="rtEmpty" hidden>No routines yet.</p>
                <p class="rt-sum" id="rtSum"></p>
              </div>
            </div>
            <div class="ws-panel" data-wpanel="screen" hidden>
              <div class="files" role="tablist" aria-label="Changed files and terminal">
                <button role="tab" aria-selected="true" data-file="diff">Composer.tsx <span class="plus">+9</span> <span class="minus">−3</span></button>
                <button role="tab" aria-selected="false" tabindex="-1" data-file="files">3 files changed</button>
                <button role="tab" aria-selected="false" tabindex="-1" data-file="term">Terminal</button>
              </div>
              <div class="ws-body" id="wsBody"></div>
              <div class="ws-foot"><span class="grow">S1-4 Chat UI · bench</span><button type="button" class="btn secondary sm" id="wTake">Take over</button></div>
            </div>
            <div class="ws-panel" data-wpanel="settings" hidden>
              <div class="set">
                <nav class="set-nav" id="setNav" aria-label="Noor's settings sections"></nav>
                <section class="set-main" id="setMain" aria-labelledby="secH"></section>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ANY OTHER AGENT'S ROOM (changing rooms) -->
    <section class="screen" id="p-room" aria-label="Agent" hidden></section>

    <!-- TEAM CHAT -->
    <section class="screen" id="p-team" aria-label="Bench team chat" hidden></section>

    <!-- SPLIT VIEW and ONE PROJECT -->
    <section class="screen" id="p-split" aria-label="Split view" hidden>
      <div class="splitv" id="splitv">
        <div class="pv" id="svL" role="region" aria-label="Left pane"></div>
        <div class="sv-div" id="svDiv" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize the panes" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50" title="Drag, or use the arrow keys"></div>
        <div class="pv" id="svR" role="region" aria-label="Right pane"></div>
      </div>
    </section>
    <section class="screen" id="p-project" aria-label="Project" hidden><div class="pv" id="pvSolo"></div></section>

    <!-- INSIGHT -->
    <section class="screen" id="p-memory" aria-label="Memory" hidden></section>
    <section class="screen scroll" id="p-usage" aria-label="Usage" hidden></section>
    <section class="screen" id="p-trace" aria-label="Look inside: the trace" hidden></section>

    <div class="dropzones" id="dropzones" hidden>
      <div class="dz" data-dz="here">Drop to open here</div>
      <div class="dz" data-dz="split">Drop to open in split view</div>
    </div>
  </div>
</div>

<!-- FIRST RUN (before the app shell exists) -->
<div class="firstrun" id="p-first" hidden></div>

<!-- SYSTEM SHEET -->
<main class="sheet" id="p-tokens" hidden><div class="sheet-wrap" id="sheet"></div></main>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="Look inside" hidden></div>

<!-- WHAT NEEDS YOU: an overlay over the current screen (C6); close returns you where you were -->
<div class="nd-scrim" id="ndScrim" hidden></div>
<div class="needs-ov" id="needsOv" role="dialog" aria-modal="true" aria-labelledby="ndT" hidden>
  <div class="nd-h"><h2 id="ndT" tabindex="-1">What needs you</h2><span class="count attn" data-cnt="all" id="ndCount"></span><button type="button" class="btn icon" id="ndClose" aria-label="Close What needs you" title="Close"></button></div>
  <div class="nd-body"><div id="needsList" data-tkbox="needs"></div></div>
  <div class="nd-f" id="ndFoot"></div>
</div>

<!-- TAKE-OVER -->
<div class="takeover" id="takeover" role="dialog" aria-modal="true" aria-labelledby="toT" hidden>
  <div class="to-head">
    <span id="toAv"></span>
    <div class="grow"><b id="toT">You have Noor's workspace</b><span>Noor continues from your edits. They're logged in the trace.</span></div>
    <span class="tag">Paused</span>
    <button type="button" class="btn primary lg" id="toDone">Done editing, continue</button>
  </div>
  <div class="files"><button type="button" role="tab" aria-selected="true">Composer.tsx</button></div>
  <div class="to-body" id="toBody">
    <div class="cursor" id="cursor" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.6L9.5 19z" fill="#15171d" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><span>You</span></div>
    <div id="toDiff"></div>
  </div>
</div>

<!-- DIALOG (New agent / New project) -->
<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT" id="dlg"></div>
</div>

<div id="toastHost" aria-live="polite"></div>
<div id="liveHost" class="sr" aria-live="polite"></div>

/* ---------- sound (P-7, decided 23 Oct): the explorations' three sounds, synthesised live, no files ----------
   On by default (the Sound switch in the demo bar). Nothing plays before your first click or key press, and the
   AudioContext is only created then (browser autoplay rules). In the app, needs you and done play only when Bench
   isn't the window you're in; here they play in view so you can hear them. Sound is separate from reduced motion. */
const SND = {on:true, armed:false, ac:null, master:null, nb:null, last:{}};
try { SND.on = localStorage.getItem("bench-proto-sound") !== "off"; } catch (e) { SND.on = true; }
function sndArm(){ SND.armed = true; removeEventListener("pointerdown", sndArm, true); removeEventListener("keydown", sndArm, true); }
addEventListener("pointerdown", sndArm, true);
addEventListener("keydown", sndArm, true);
function sndCtx(){
  if (!SND.ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    const ac = SND.ac = new C();
    SND.master = ac.createGain(); SND.master.gain.value = 0.7;   /* --sound-volume */
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = .003; comp.release.value = .12;
    SND.master.connect(comp); comp.connect(ac.destination);
  }
  if (SND.ac.state === "suspended") SND.ac.resume();
  return SND.ac;
}
function sndTone(t0, freq, dur, o = {}){
  const ac = SND.ac, gain = o.gain ?? .16, attack = o.attack ?? .008;
  const osc = ac.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (o.glide) osc.frequency.exponentialRampToValueAtTime(freq * o.glide, t0 + dur * .8);
  const g = ac.createGain();
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g);
  let out = g;

const DAYS = {monday:"Mon 26 Oct",tuesday:"Tue 27 Oct",wednesday:"Wed 28 Oct",thursday:"Thu 29 Oct",friday:"Fri 23 Oct",saturday:"Sat 24 Oct",sunday:"Sun 25 Oct"};
function draftRoutine(text){
  const t = text.toLowerCase(), day = Object.keys(DAYS).find(d => t.indexOf(d) >= 0);
  const m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
  let hh = m ? +m[1] : 8; const mm = m && m[2] ? m[2] : "00";
  if (m && m[3] === "pm" && hh < 12) hh += 12; if (hh > 23) hh = 8;
  const time = String(hh).padStart(2, "0") + ":" + mm, weekday = /weekday|every morning|each morning/.test(t);
  const when = day ? `Every ${day.charAt(0).toUpperCase() + day.slice(1)} at ${time}` : weekday ? `Every weekday at ${time}` : `Every day at ${time}`;
  const core = text.replace(/^[^,]*\b(every|each)\b[^,]*,\s*/i, "").replace(/[.!]+$/, "").trim();
  const ws = core.split(/\s+/).filter(Boolean), words = ws.length > 7 ? ws.slice(0, 6).join(" ") + "…" : ws.join(" ");
  const name = words ? words.charAt(0).toUpperCase() + words.slice(1) : "New routine";
  const perm = /\b(list|report|digest|summar|check)\w*/.test(t) && !/\bfix\b/.test(t) ? "read" : "edit";
  const est = 4.0, perWeek = day ? 1 : weekday ? 5 : 7;
  RT_DRAFT = {id:"r" + Date.now(), name, when, perm, next:day ? DAYS[day] : "Tomorrow", nextSub:time, last:"—", lastSub:"Never run", lastK:0, est, perWeek, on:true};
  $("#rtOut").innerHTML = `<div class="rt-draft"><div class="rcard" style="box-shadow:none;padding:0"><div class="top"><h3>${esc(name)}</h3>${permTag(perm)}</div><div class="when">${esc(when)} · Noor</div></div>
    <p class="rt-est">≈ ${est.toFixed(1)}k tokens per run (${fmtPct(pctW(est))} of your week), about ${fmtPct(pctW(est) * perWeek)} a week. Anything outward or reserved waits for you.</p>
    <div class="row"><button type="button" class="btn secondary sm" id="rtSave">Save routine</button><button type="button" class="btn tertiary sm" id="rtCancel">Cancel</button></div></div>`;
}
function openRtNew(text){
  $("#rtNew").hidden = false; $("#rtOut").innerHTML = ""; RT_DRAFT = null; $("#rtIn").value = text || "";
  if (text) { draftRoutine(text); const s = $("#rtSave"); if (s) s.focus(); } else $("#rtIn").focus();
}
function closeRtNew(){ $("#rtNew").hidden = true; $("#rtOut").innerHTML = ""; $("#rtIn").value = ""; RT_DRAFT = null; }

$("#rtNew").addEventListener("submit", e => { e.preventDefault(); const v = $("#rtIn").value.trim(); if (!v) { $("#rtIn").focus(); return; } draftRoutine(v); });
$("#rtNew").addEventListener("click", e => {

    const d = RT_DRAFT; RT.empty = false; RT.list.push(d);

    toast(`<b>Routine saved: ${esc(d.name)}.</b> First run ${esc(d.next)} at ${esc(d.nextSub)} · ≈ ${fmtPct(pctW(d.est))} of your week each time.`, {undo:() => { RT.list = RT.list.filter(x => x.id !== d.id); renderRoutines(); toast("Undone. The routine is gone; nothing ran.", {icon:"undo"}); }});
    $("#rtNewBtn").focus();
  } else if (e.target.closest("#rtCancel")) { closeRtNew(); $("#rtNewBtn").focus(); }
});
$("#rtEmpty").addEventListener("click", e => { const b = e.target.closest("[data-rt-ex]"); if (b) openRtNew(b.dataset.rtEx); });
$("#rtList").addEventListener("click", e => {

  const row = t.closest("#sideList [data-row]"); if (row) { sideNav(row.dataset.row); return; }
  const fq = t.closest("[data-first]"); if (fq) { firstAsk(fq.dataset.first); return; }
  if (t.closest("#needsTop")) { if (ND.open) closeNeeds(); else openNeeds({ret:$("#needsTop")}); return; }
  if (t.closest("#ringBtn")) { nav("usage"); return; }
  if (t.closest("#sideToggle")) { const side = $("#side"), col = !side.classList.contains("collapsed"); side.classList.toggle("collapsed", col); const b = $("#sideToggle"); b.setAttribute("aria-expanded", !col); b.setAttribute("aria-label", col ? "Expand the sidebar" : "Collapse the sidebar"); b.title = b.getAttribute("aria-label"); return; }
  const act = t.closest("[data-act]"); if (act) { e.preventDefault(); doAct(act.dataset.act, act); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "askForm") return;
  e.preventDefault();
  const v = $("#askIn").value.trim(); if (!v) return;
  $("#askIn").value = ""; $("#askSend").disabled = true; $("#askHint").innerHTML = "";
  if (S.scen === "first") { firstAsk(v); return; }
  homeSend(v);
});
/* The cost of a message shows while you type it, before you send (one estimate, like Noor's composer) */
document.addEventListener("input", e => {
  if (e.target.id !== "askIn") return;
  const v = e.target.value.trim();
  $("#askSend").disabled = !v;
  $("#askHint").innerHTML = v ? `<span>≈ ${(0.4 + v.length / 400).toFixed(1)}k tokens · ${(0.01 + v.length / 12000).toFixed(2)} % of your week</span>` : "";
});
document.addEventListener("keydown", e => {
  if (e.target.id === "askIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const f = $("#askForm"); if (f) f.requestSubmit(); return; }
  if (e.key === "Escape" && POP) { closePop(true); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); $("#sideSearch").focus(); return; }
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const t = e.target.closest && e.target.closest('[role="tab"]');
  if (!t || t.closest(".demo")) return;
  const list = $$('[role="tab"]', t.parentElement), i = list.indexOf(t), n = list[(i + (e.key === "ArrowRight" ? 1 : list.length - 1)) % list.length];
  e.preventDefault(); n.focus(); n.click();
});
document.addEventListener("mousedown", e => { if (MENU && !e.target.closest("#menu") && e.target.closest("[data-menu]") !== MENU.anchor) closeMenu(false); });
window.addEventListener("resize", () => { closeMenu(false); closePop(false); });
document.addEventListener("contextmenu", e => {
  const t = e.target.closest && e.target.closest("[data-drag-proj], .pcard[data-pid], .pv-head[data-pv]");
  if (!t) return;
  const btn = t.querySelector("[data-menu]"); if (!btn) return;
  e.preventDefault(); openMenuFor(btn, {x:e.clientX, y:e.clientY});
});
let DRAG = null;
document.addEventListener("dragstart", e => { const h = e.target.closest && e.target.closest("[data-drag-proj]"); if (!h) return; DRAG = h.dataset.dragProj; e.dataTransfer.setData("text/plain", DRAG); e.dataTransfer.effectAllowed = "copy"; closeMenu(false); setTimeout(() => { if (DRAG) $("#dropzones").hidden = false; }, 0); });
document.addEventListener("dragend", () => { DRAG = null; $("#dropzones").hidden = true; $$(".dz").forEach(z => z.classList.remove("over")); });
$$(".dz").forEach(z => {
  z.addEventListener("dragover", e => { if (!DRAG) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; z.classList.add("over"); });
  z.addEventListener("dragleave", () => z.classList.remove("over"));
  z.addEventListener("drop", e => { e.preventDefault(); const pid = DRAG; DRAG = null; $("#dropzones").hidden = true; z.classList.remove("over"); if (pid) projAction(pid, z.dataset.dz); });
});

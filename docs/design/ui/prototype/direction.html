<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bench · UI direction v0.4 · the calm pass</title>
<link rel="icon" type="image/svg+xml" href="../brand/logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
/* Prototype safety net: any script error shows here instead of a blank page. Not part of the UI. */
window.addEventListener("error", function (e) {
  var b = document.getElementById("errBox");
  var msg = "Prototype error: " + (e.message || e) + (e.lineno ? " (line " + e.lineno + ")" : "");
  if (b) { b.hidden = false; b.textContent = msg; } else { document.addEventListener("DOMContentLoaded", function () { var x = document.getElementById("errBox"); if (x) { x.hidden = false; x.textContent = msg; } }); }
});
</script>
<style>
/* ==========================================================================
   bench direction v0.4 · the calm pass (client feedback round 3, C1–C7)
   v0.3 "In plain sight", made calm: Home is a conversation with Atlas,
   What needs you is an overlay, the agent panel starts closed, and every
   screen shows only what it needs right now (the rest is one click away).
   Built on the stage-1 brand (BRAND.md) and design system (DESIGN-SYSTEM.md,
   tokens.css), inlined here so the file stays single, plus the UX premium
   spec (state matrix, worst moments, intelligence layer, moments).
   Decided and applied: R1–R11 (UX recommendations), D-UI7–11, P-5 (via R3),
   P-6 (Look inside), and brand round 2 (2026-10-23): B-2 Quartet mark,
   P-1/P-2 Porcelain, Ink, Cobalt, P-3 Instrument Sans + JetBrains Mono,
   P-4 Pear, P-7 sound on. The only network use is Google Fonts, for review;
   the app bundles the same OFL files.
   ========================================================================== */
:root{
  color-scheme:light;
  /* Porcelain and Ink (P-1) */
  --porcelain-0:#ffffff; --porcelain-25:#f9fafb; --porcelain-50:#f3f4f7; --porcelain-100:#eceef2; --porcelain-150:#e4e6ec;
  --porcelain-200:#d8dbe2; --porcelain-300:#c4c8d1; --porcelain-500:#868b97; --porcelain-600:#646976; --porcelain-700:#474b57; --porcelain-900:#15171d;
  /* Cobalt (P-2) */
  --cobalt-50:#ebf0ff; --cobalt-300:#8fa8ff; --cobalt-500:#2e5bff; --cobalt-600:#2550eb; --cobalt-700:#1f45d1;
  /* Feedback */
  --green-50:#e3f5ea; --green-500:#22a35a; --green-700:#1b7a45;
  --amber-50:#fff1d9; --amber-500:#f5a20a; --amber-700:#8a5300;
  --red-50:#fdeaea; --red-500:#e5383b; --red-700:#c0262d;
  /* Agent hues (Pear replaces Periwinkle, P-4) */
  --hue-coral-base:#ff5f73; --hue-coral-light:#ffb8c1; --hue-coral-deep:#e0364f; --hue-coral-ink:#c4283f; --hue-coral-tint:#ffe6e9; --hue-coral-wash:#fff8f9;
  --hue-tangerine-base:#ff8a3d; --hue-tangerine-light:#ffc9a3; --hue-tangerine-deep:#e0601a; --hue-tangerine-ink:#b04a00; --hue-tangerine-tint:#ffeee2; --hue-tangerine-wash:#fffaf6;
  --hue-honey-base:#f2ab1d; --hue-honey-light:#ffe2a0; --hue-honey-deep:#cf8600; --hue-honey-ink:#8a5a00; --hue-honey-tint:#fff4dc; --hue-honey-wash:#fffcf4;
  --hue-pear-base:#96bf2c; --hue-pear-light:#d6ec9a; --hue-pear-deep:#6c9410; --hue-pear-ink:#4d6a00; --hue-pear-tint:#f0f7dc; --hue-pear-wash:#fbfdf4;
  --hue-mint-base:#3cc47c; --hue-mint-light:#aeedc9; --hue-mint-deep:#1f9658; --hue-mint-ink:#1d7a43; --hue-mint-tint:#e5f7ec; --hue-mint-wash:#f6fcf8;
  --hue-teal-base:#1fb5a3; --hue-teal-light:#9ee8dc; --hue-teal-deep:#0c8a7c; --hue-teal-ink:#00756a; --hue-teal-tint:#e1f6f2; --hue-teal-wash:#f5fcfb;
  --hue-aqua-base:#2db4dc; --hue-aqua-light:#a6e6f7; --hue-aqua-deep:#0e86b0; --hue-aqua-ink:#006b85; --hue-aqua-tint:#e3f6fb; --hue-aqua-wash:#f6fcfe;
  --hue-lavender-base:#8e6cf0; --hue-lavender-light:#cbbcff; --hue-lavender-deep:#5f3fd0; --hue-lavender-ink:#5a3dc8; --hue-lavender-tint:#efeaff; --hue-lavender-wash:#faf8ff;
  --hue-orchid-base:#e05cb4; --hue-orchid-light:#f6b6e1; --hue-orchid-deep:#b8358d; --hue-orchid-ink:#b0287f; --hue-orchid-tint:#fbe7f4; --hue-orchid-wash:#fef8fc;
  --hue-cocoa-base:#a66e4e; --hue-cocoa-light:#dcb59d; --hue-cocoa-deep:#7d4c31; --hue-cocoa-ink:#7a4a2e; --hue-cocoa-tint:#f5ebe4; --hue-cocoa-wash:#fcf8f5;
  --hue-none-base:#b4b7bf; --hue-none-light:#dfe1e6; --hue-none-deep:#8b8f99; --hue-none-ink:#474b57; --hue-none-tint:#eceef2; --hue-none-wash:#f9fafb;
  /* Roles */
  --bg-ground:var(--porcelain-50); --bg-surface:var(--porcelain-0); --bg-sunken:var(--porcelain-100); --bg-inverse:var(--porcelain-900);
  --state-hover:rgb(21 23 29 / .045); --state-press:rgb(21 23 29 / .085); --state-selected:rgb(21 23 29 / .07);
  --text-1:var(--porcelain-900); --text-2:var(--porcelain-700); --text-3:var(--porcelain-600);
  --text-inverse:#eceef3; --text-inverse-2:#a9adb8; --text-on-action:#fff;
  --line-subtle:rgb(21 23 29 / .07); --line:rgb(21 23 29 / .11); --line-control:var(--porcelain-500);
  --action:var(--cobalt-500); --action-hover:var(--cobalt-600); --action-press:var(--cobalt-700); --action-tint:var(--cobalt-50); --action-text:var(--cobalt-500); --focus:var(--cobalt-500);
  --ok-ink:var(--green-700); --ok-tint:var(--green-50); --ok-fill:var(--green-500);
  --attn-ink:var(--amber-700); --attn-tint:var(--amber-50); --attn-fill:var(--amber-500);
  --danger-ink:var(--red-700); --danger-tint:var(--red-50); --danger-fill:var(--red-500);
  --agent-base:var(--hue-none-base); --agent-light:var(--hue-none-light); --agent-deep:var(--hue-none-deep); --agent-ink:var(--hue-none-ink); --agent-tint:var(--hue-none-tint); --agent-wash:var(--hue-none-wash);
  /* Type (P-3, decided 23 Oct): Instrument Sans 400/600, JetBrains Mono for code; both OFL, bundled in the app */
  --font-text:"Instrument Sans","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-display:var(--font-text);
  --font-mono:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Consolas,monospace;
  --fs-meta:12px; --lh-meta:16px; --fs-sub:13px; --lh-sub:18px; --fs-body:15px; --lh-body:22px;
  --fs-title:20px; --lh-title:26px; --fs-headline:28px; --lh-headline:34px; --fs-display:44px; --lh-display:48px;
  --measure-chat:34em;
  /* Shape (R3, decided): one continuous-corner family, three values.
     18 = objects on the canvas (tickets, cards, bubbles, dialogs, menus, toasts) ·
     10 = things inside them (options, inputs, wells, menu items, the bubble's tail) · pill = controls.
     The xs/md/xl names stay as aliases so the system's token names still resolve. */
  --corner:round; --r-in:10px; --r-obj:18px;
  --r-xs:var(--r-in); --r-sm:var(--r-in); --r-md:var(--r-obj); --r-lg:var(--r-obj); --r-xl:var(--r-obj);
  /* Elevation: tone first, shadow only for what floats */
  --shadow-color:228 16% 10%;
  --elev-1:0 0 0 1px var(--line-subtle);
  --elev-2:0 0 0 1px var(--line-subtle),0 1px 2px hsl(var(--shadow-color) / .05),0 4px 12px hsl(var(--shadow-color) / .05);
  --elev-3:0 0 0 1px hsl(var(--shadow-color) / .07),0 4px 10px hsl(var(--shadow-color) / .08),0 16px 40px hsl(var(--shadow-color) / .10);
  --elev-4:0 0 0 1px hsl(var(--shadow-color) / .06),0 12px 32px hsl(var(--shadow-color) / .14),0 40px 96px hsl(var(--shadow-color) / .18);
  --scrim:rgb(21 23 29 / .32);
  /* Motion: physics, not timelines */
  --dur-micro:140ms; --dur-short:200ms; --dur-move:320ms; --dur-scene:420ms; --dur-character:640ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-exit:cubic-bezier(.55,0,1,.45);
  --spring-smooth:linear(0,.078 5%,.235 10%,.401 15%,.549 20%,.669 25%,.762 30%,.831 35%,.882 40%,.944 50%,.974 60%,.988 70%,.995 80%,1);
  --spring-snappy:linear(0,.061 5%,.198 10%,.36 15%,.518 20%,.656 25%,.768 30%,.854 35%,.917 40%,.987 50%,1.012 60%,1.015 70%,1.011 80%,1.006 90%,1);
  --spring-gentle:linear(0,.074 5%,.249 10%,.463 15%,.673 20%,.85 25%,.983 30%,1.069 35%,1.114 40%,1.127 45%,1.117 50%,1.068 60%,1.019 70%,.991 80%,.984 90%,1);
  --press-scale:.97; --rise:8px;
}
@supports (corner-shape:squircle){:root{--corner:squircle;--r-in:16px;--r-obj:28px}}
[data-hue="coral"]{--agent-base:var(--hue-coral-base);--agent-light:var(--hue-coral-light);--agent-deep:var(--hue-coral-deep);--agent-ink:var(--hue-coral-ink);--agent-tint:var(--hue-coral-tint);--agent-wash:var(--hue-coral-wash)}
[data-hue="tangerine"]{--agent-base:var(--hue-tangerine-base);--agent-light:var(--hue-tangerine-light);--agent-deep:var(--hue-tangerine-deep);--agent-ink:var(--hue-tangerine-ink);--agent-tint:var(--hue-tangerine-tint);--agent-wash:var(--hue-tangerine-wash)}
[data-hue="honey"]{--agent-base:var(--hue-honey-base);--agent-light:var(--hue-honey-light);--agent-deep:var(--hue-honey-deep);--agent-ink:var(--hue-honey-ink);--agent-tint:var(--hue-honey-tint);--agent-wash:var(--hue-honey-wash)}
[data-hue="pear"]{--agent-base:var(--hue-pear-base);--agent-light:var(--hue-pear-light);--agent-deep:var(--hue-pear-deep);--agent-ink:var(--hue-pear-ink);--agent-tint:var(--hue-pear-tint);--agent-wash:var(--hue-pear-wash)}
[data-hue="mint"]{--agent-base:var(--hue-mint-base);--agent-light:var(--hue-mint-light);--agent-deep:var(--hue-mint-deep);--agent-ink:var(--hue-mint-ink);--agent-tint:var(--hue-mint-tint);--agent-wash:var(--hue-mint-wash)}
[data-hue="teal"]{--agent-base:var(--hue-teal-base);--agent-light:var(--hue-teal-light);--agent-deep:var(--hue-teal-deep);--agent-ink:var(--hue-teal-ink);--agent-tint:var(--hue-teal-tint);--agent-wash:var(--hue-teal-wash)}
[data-hue="aqua"]{--agent-base:var(--hue-aqua-base);--agent-light:var(--hue-aqua-light);--agent-deep:var(--hue-aqua-deep);--agent-ink:var(--hue-aqua-ink);--agent-tint:var(--hue-aqua-tint);--agent-wash:var(--hue-aqua-wash)}
[data-hue="lavender"]{--agent-base:var(--hue-lavender-base);--agent-light:var(--hue-lavender-light);--agent-deep:var(--hue-lavender-deep);--agent-ink:var(--hue-lavender-ink);--agent-tint:var(--hue-lavender-tint);--agent-wash:var(--hue-lavender-wash)}
[data-hue="orchid"]{--agent-base:var(--hue-orchid-base);--agent-light:var(--hue-orchid-light);--agent-deep:var(--hue-orchid-deep);--agent-ink:var(--hue-orchid-ink);--agent-tint:var(--hue-orchid-tint);--agent-wash:var(--hue-orchid-wash)}
[data-hue="cocoa"]{--agent-base:var(--hue-cocoa-base);--agent-light:var(--hue-cocoa-light);--agent-deep:var(--hue-cocoa-deep);--agent-ink:var(--hue-cocoa-ink);--agent-tint:var(--hue-cocoa-tint);--agent-wash:var(--hue-cocoa-wash)}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:400 var(--fs-body)/var(--lh-body) var(--font-text);letter-spacing:-.006em;color:var(--text-1);background:var(--bg-ground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--action-text);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,h5,p,ul,ol,dl,dd,figure{margin:0}
b,strong,th{font-weight:600}
ul,ol{padding:0}
code,.mono{font-family:var(--font-mono);font-size:.92em;letter-spacing:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--cobalt-500);color:#fff}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.t-meta{font-size:var(--fs-meta);line-height:var(--lh-meta);letter-spacing:.005em}
.t-sub{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:0}
.t-title{font:600 var(--fs-title)/var(--lh-title) var(--font-display);letter-spacing:-.014em}
.t-head{font:600 var(--fs-headline)/var(--lh-headline) var(--font-display);letter-spacing:-.022em}
.ink2{color:var(--text-2)} .ink3{color:var(--text-3)}
.strong{font-weight:600}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#errBox{position:fixed;left:12px;bottom:12px;z-index:9999;max-width:640px;padding:10px 12px;border-radius:8px;background:#c0262d;color:#fff;font:12px/16px var(--font-mono);white-space:pre-wrap}

/* ---------- prototype chrome (not part of the UI) ---------- */
.demo{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:#0b0c10;color:var(--text-inverse);position:relative;z-index:700;font-size:13px;white-space:nowrap}
.demo :focus-visible{outline-color:var(--cobalt-300)}
.demo-id{display:flex;flex-direction:column;line-height:15px;min-width:0;flex:0 1 auto}
.demo-id b{font-size:13px;font-weight:600}
.demo-id span{font-size:12px;color:var(--text-inverse-2);overflow:hidden;text-overflow:ellipsis}
.demo-tabs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgb(255 255 255 / .08);flex:none}
.demo-tabs button{height:28px;padding:0 12px;border-radius:999px;color:var(--text-inverse-2);font-size:13px;font-weight:600;transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)}
.demo-tabs button:hover{color:var(--text-inverse)}
.demo-tabs button[aria-selected="true"]{background:var(--text-inverse);color:var(--text-1)}
.demo select{height:30px;max-width:230px;border:0;border-radius:8px;background:rgb(255 255 255 / .1);color:var(--text-inverse);padding:0 8px;font-size:13px}
.demo select option,.demo select optgroup{color:#15171d;background:#fff}
.demo-play{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--text-inverse);color:var(--text-1);font-size:13px;font-weight:600;flex:none}
.demo-play svg{width:12px;height:12px}
.demo-rm{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--text-inverse-2);cursor:pointer;flex:none}
.demo-rm input{appearance:none;width:30px;height:18px;border-radius:999px;background:rgb(255 255 255 / .18);position:relative;margin:0;cursor:pointer;transition:background-color var(--dur-short) ease}
.demo-rm input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform var(--dur-move) var(--spring-snappy)}
.demo-rm input:checked{background:var(--cobalt-300)}
.demo-rm input:checked::after{transform:translateX(12px)}
.demo-snd{margin-left:auto}
.demo-snd+.demo-rm{margin-left:0}
@media (max-width:1500px){.demo-id span{display:none}}

/* ---------- buttons (one recipe, components.html §buttons) ---------- */
.btn{--h:32px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h);padding:0 14px;border-radius:999px;font-size:13px;line-height:1;font-weight:600;letter-spacing:0;white-space:nowrap;color:var(--text-1);transition:background-color var(--dur-micro) ease,box-shadow var(--dur-micro) ease,color var(--dur-micro) ease,transform var(--dur-micro) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn svg{width:16px;height:16px;flex:none}
.btn.lg{--h:40px;padding:0 20px;font-size:15px}
.btn.sm{--h:28px;padding:0 10px;font-size:12px}
.btn.sm svg{width:14px;height:14px}
.btn.primary{background:var(--action);color:var(--text-on-action)}
.btn.primary:hover{background:var(--action-hover)}
.btn.primary:active{background:var(--action-press)}
.btn .cons{font-weight:400}
.btn.secondary{background:var(--bg-surface);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .16)}
.btn.secondary:hover{background:var(--porcelain-25);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .26)}
.btn.secondary:active{background:var(--bg-sunken)}
.btn.tertiary{color:var(--text-2)}
.btn.tertiary:hover{background:var(--state-hover);color:var(--text-1)}
.btn.tertiary:active{background:var(--state-press);color:var(--text-1)}
.btn.inkbtn{background:var(--text-1);color:#fff}
.btn.inkbtn:hover{background:#2b2e37}
.btn.danger{background:var(--danger-ink);color:#fff}
.btn.danger:hover{background:#a81f26}
.btn.quiet-danger{color:var(--danger-ink)}
.btn.quiet-danger:hover{background:var(--danger-tint)}
.btn.on-ink{background:rgb(255 255 255 / .1);color:var(--text-inverse)}
.btn.on-ink:hover{background:rgb(255 255 255 / .18)}
.btn.on-ink.solid{background:var(--text-inverse);color:var(--text-1)}
.btn.on-ink.solid:hover{background:#fff}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--bg-sunken)!important;color:var(--text-3)!important;box-shadow:none!important;cursor:not-allowed;transform:none}
.btn.tertiary:disabled{background:transparent!important}
.btn.is-done{background:var(--ok-ink)!important;color:#fff!important;box-shadow:none!important}
.btn.is-busy{cursor:progress}
.btn.icon{width:var(--h);padding:0;color:var(--text-2)}
.btn.icon:hover{background:var(--state-hover);color:var(--text-1)}
.btn.icon:active{background:var(--state-press)}
.btn.icon[aria-pressed="true"]{background:var(--state-selected);color:var(--text-1)}
.btn.icon.sm{width:28px}
/* C1: Send with a draft. .btn.icon's Text 2 colour used to win over .inkbtn, so the arrow sank into the Ink fill (2.1:1).
   White on Ink is 17.9:1, on the hover Ink 13.6:1, on the pressed black 21:1; disabled keeps the sunken pill (Text 3, 4.7:1). */
.btn.icon.inkbtn{background:var(--text-1);color:#fff}
.btn.icon.inkbtn:hover{background:#2b2e37;color:#fff}
.btn.icon.inkbtn:active{background:#000;color:#fff}
.btn.icon.inkbtn svg{stroke-width:2}
.busy-dots{display:inline-flex;gap:3px;margin-left:2px}
.busy-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dotp 1.2s infinite ease-in-out}
.busy-dots i:nth-child(2){animation-delay:.16s}.busy-dots i:nth-child(3){animation-delay:.32s}
.linkbtn{display:inline;padding:0 2px;border-radius:4px;color:var(--action-text);font-weight:600;font-size:inherit}
.linkbtn:hover{text-decoration:underline}

/* ---------- tags, counts, chips ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:var(--bg-sunken);color:var(--text-2);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;flex:none;transition:background-color var(--dur-short) ease,color var(--dur-short) ease}
.tag svg{width:12px;height:12px;flex:none}
.tag.attn{background:var(--attn-tint);color:var(--attn-ink)}
.tag.ok{background:var(--ok-tint);color:var(--ok-ink)}
.tag.danger{background:var(--danger-tint);color:var(--danger-ink)}
.tag.ink{background:var(--text-1);color:#fff}
.tag.risk{background:transparent;color:var(--text-1);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .32)}
.tag.action{background:var(--action-tint);color:var(--action-text)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--text-1);color:#fff;font-size:12px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.count.attn{background:var(--attn-fill);color:var(--text-1)}
.count.soft{background:var(--bg-sunken);color:var(--text-2)}
.est{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;background:var(--bg-sunken);font-size:12px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.est svg{width:14px;height:14px;color:var(--text-3)}
.est.ok svg{color:var(--ok-ink)}
.lookin{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 5px;border-radius:999px;color:var(--action-text);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;transition:background-color var(--dur-micro) ease}
.lookin:hover{background:var(--action-tint)}
.lookin svg{width:14px;height:14px}
.mention{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 3px;border-radius:999px;background:var(--agent-tint);color:var(--agent-ink);font-weight:600;font-size:13px;line-height:1;vertical-align:-4px;--cut:var(--agent-tint)}
.filter{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .14);transition:background-color var(--dur-micro) ease,color var(--dur-micro) ease}
.filter:hover{background:var(--state-hover);color:var(--text-1)}
.filter[aria-pressed="true"]{background:var(--text-1);color:#fff;box-shadow:none}
.filter .n{font-weight:400;font-variant-numeric:tabular-nums}
.filter:disabled{color:var(--text-3);box-shadow:inset 0 0 0 1px var(--porcelain-200);cursor:not-allowed;background:transparent}
.kbd{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:var(--r-xs);corner-shape:var(--corner);background:var(--bg-sunken);font:600 11px/1 var(--font-text);color:var(--text-3)}

/* ---------- switch, segmented, fields ---------- */
.switch{display:inline-flex;align-items:center;gap:8px;min-height:32px;font-size:12px;color:var(--text-3);cursor:pointer;flex:none}
.sw{position:relative;width:36px;height:22px;border-radius:999px;background:var(--porcelain-300);box-shadow:inset 0 0 0 1px rgb(21 23 29 / .12);transition:background-color var(--dur-short) ease;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(21 23 29 / .25),0 0 0 .5px rgb(21 23 29 / .08);transition:transform var(--dur-move) var(--spring-snappy)}
.switch:hover .sw{background:#b3b8c3}
.switch[aria-checked="true"] .sw{background:var(--text-1)}
.switch[aria-checked="true"]:hover .sw{background:#2b2e37}
.switch[aria-checked="true"] .sw::after{transform:translateX(14px)}
.switch:focus-visible{outline:none}
.switch:focus-visible .sw{outline:2px solid var(--focus);outline-offset:2px}
.switch[aria-disabled="true"]{cursor:not-allowed}
.switch[aria-disabled="true"] .sw{background:var(--porcelain-500)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:var(--bg-sunken);flex:none}
.seg button{height:28px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2);transition:background-color var(--dur-move) var(--spring-smooth),color var(--dur-micro) ease,box-shadow var(--dur-move) var(--spring-smooth)}
.seg button:hover{color:var(--text-1)}
.seg button[aria-selected="true"]{background:var(--bg-surface);color:var(--text-1);box-shadow:0 0 0 .5px rgb(21 23 29 / .1),0 1px 3px rgb(21 23 29 / .1)}
.field{display:grid;gap:6px;min-width:0;margin:0 0 16px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--text-1)}
/* C3: "(Optional)" is a quiet word after the label. It was .opt, which is also the ticket option card: the collision drew a grey box. */
.optl{font-size:12px;font-weight:400;color:var(--text-3);margin-left:2px}
.field .help{font-size:12px;line-height:16px;color:var(--text-3)}
.inp{width:100%;height:40px;padding:0 12px;border:0;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line-control);font-size:15px;transition:box-shadow var(--dur-micro) ease}
.inp:hover{box-shadow:inset 0 0 0 1px var(--text-2)}
.inp:focus-visible,.inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
textarea.inp{height:auto;padding:10px 12px;line-height:22px;resize:vertical}
.inp.sm{height:32px;font-size:13px;width:auto;min-width:104px}
.inp::placeholder{color:var(--text-3)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

/* ---------- avatars ---------- */
.av{position:relative;display:inline-block;width:var(--s);height:var(--s);flex:none;vertical-align:middle}
.av>svg{display:block;width:100%;height:100%;overflow:visible}
.av.fluid{width:100%;height:100%}
.av.is-paused>svg{opacity:.5}
.bdg{position:absolute;right:-2px;bottom:-2px;width:var(--b);height:var(--b);border-radius:50%;display:grid;place-items:center;background:var(--bg-surface);color:var(--text-2);box-shadow:0 0 0 2px var(--cut,var(--bg-surface)),inset 0 0 0 1px var(--line);transition:background-color var(--dur-short) ease}
.bdg svg{width:70%;height:70%}
.bdg.attn{background:var(--attn-fill);color:var(--text-1);box-shadow:0 0 0 2px var(--cut,var(--bg-surface))}
.bdg.solid{background:var(--text-1);color:#fff;box-shadow:0 0 0 2px var(--cut,var(--bg-surface))}
.bdg.err{background:var(--danger-fill);color:#fff;box-shadow:0 0 0 2px var(--cut,var(--bg-surface))}
.bdg.ok{background:var(--ok-fill);color:#fff;box-shadow:0 0 0 2px var(--cut,var(--bg-surface))}
.g-spin{transform-origin:6px 6px;animation:spin 1.6s linear infinite}
.g-think circle{animation:dotp 1.2s infinite ease-in-out}
.g-think circle:nth-child(2){animation-delay:.16s}.g-think circle:nth-child(3){animation-delay:.32s}
.blink-once{animation:blinkOnce .26s ease-in-out 1!important}
.hero-av{display:block;width:96px;height:102px;margin:0 auto}
.hero-av>svg{display:block;width:100%;height:100%;overflow:visible}
.hero-av .xp{opacity:0;transition:opacity 180ms ease}
.hero-av[data-expr="calm"] .x-calm,.hero-av[data-expr="focused"] .x-focused,.hero-av[data-expr="sleepy"] .x-sleepy,.hero-av[data-expr="surprised"] .x-surprised,.hero-av[data-expr="curious"] .x-curious,.hero-av[data-expr="pleased"] .x-pleased,.hero-av[data-expr="concerned"] .x-concerned{opacity:1}
.hero-av .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 5.2s ease-in-out infinite}
.hero-av[data-status="paused"] .body,.hero-av[data-status="stopped"] .body{animation-duration:10.4s}
.hero-av .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s infinite}
.hero-av[data-expr="sleepy"] .blink,.hero-av[data-expr="pleased"] .blink{animation:none}
.hero-av .look{transition:transform var(--dur-character) var(--spring-gentle)}
.hero-av[data-status="thinking"] .look{animation:drift 3.2s var(--ease-in-out) infinite}
.hero-av[data-status="working"] .look{animation:scan 2.4s var(--ease-in-out) infinite alternate}
.hero-av[data-status="waiting"] .look{transform:translate(0,-2px)}
.hero-av[data-status="error"] .look,.hero-av[data-status="blocked"] .look{transform:translate(0,3px)}
.hero-av.is-paused>svg{opacity:.6}
.glance .look{transform:translate(3px,3px)}
.cluster{position:relative;display:inline-block;width:var(--s);height:var(--s);flex:none}
.cluster>span{position:absolute;line-height:0}
.stack{display:inline-flex;align-items:center;flex:none}
.stack>.av{box-shadow:none}
.stack>.av+.av{margin-left:-6px}
.markbox{display:inline-grid;place-items:center;flex:none}
.markbox svg{display:block}

/* ---------- app shell ---------- */
.app{display:flex;height:calc(100vh - 48px)}
.side{width:280px;flex:none;display:flex;flex-direction:column;background:var(--bg-ground);box-shadow:inset -1px 0 0 var(--line-subtle);overflow:hidden;--cut:var(--bg-ground);transition:width var(--dur-scene) var(--spring-smooth);position:relative;z-index:20}
.side.collapsed{width:56px}
.side-top{display:flex;align-items:center;gap:6px;height:56px;padding:0 8px 0 14px;flex:none}
/* Lockup (Quartet): mark, gap 0.36 × its height, the name in Instrument Sans 600 at 0.84 × height, −0.035em */
.brand{display:flex;align-items:center;flex:1;min-width:0;height:28px;padding:0 2px;border-radius:6px;color:var(--text-1)}
.brand:hover{text-decoration:none}
.lockup{display:inline-flex;align-items:center;gap:calc(var(--h) * .36);line-height:1;flex:none}
.lockup svg{display:block;flex:none}
.wm{font-family:var(--font-display);font-size:calc(var(--h) * .84);font-weight:600;line-height:1;letter-spacing:-.035em;color:var(--text-1);white-space:nowrap;transform:translateY(-.04em)}
.side-search{position:relative;margin:0 12px 6px;flex:none}
.side-search svg{position:absolute;left:10px;top:8px;width:16px;height:16px;color:var(--text-3);pointer-events:none}
.side-search input{width:100%;height:32px;border:0;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line-control);padding:0 44px 0 32px;font-size:13px}
.side-search input:focus{box-shadow:inset 0 0 0 2px var(--focus)}
.side-search input::placeholder{color:var(--text-3)}
.side-search .kbd{position:absolute;right:6px;top:6px}
.side-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;overscroll-behavior:contain}
.side-sec{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 4px 0 10px;margin-top:8px}
.side-sec h2{font-size:12px;font-weight:600;color:var(--text-3);white-space:nowrap}
.secbtn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2)}
.secbtn:hover{background:var(--state-hover);color:var(--text-1)}
.secbtn svg{width:14px;height:14px}
.nav{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;height:36px;padding:0 10px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left;font-size:15px;color:var(--text-1);transition:background-color var(--dur-micro) ease}
.nav svg{width:18px;height:18px;color:var(--text-2)}
.nav:hover{background:var(--state-hover)}
.nav[aria-current="page"]{background:var(--state-selected);font-weight:600}
.nav:focus-visible,.srow:focus-visible,.pg-toggle:focus-visible{outline-offset:-2px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;width:100%;min-height:40px;padding:6px 10px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left;color:var(--text-1);transition:background-color var(--dur-micro) ease;--cut:var(--bg-ground)}
.srow:hover{background:var(--state-hover);--cut:#e9eaed}
.srow[aria-current="page"]{background:var(--state-selected);--cut:#e4e5e8}
.srow.flash{animation:rowFlash 1.2s var(--ease-out) 1}
.srow .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.srow .n b{font-size:15px;line-height:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow[aria-current="page"] .n b{font-weight:600}
.srow .n span{font-size:12px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.srow .s{display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.srow .s>span{overflow:hidden;text-overflow:ellipsis}
.srow.attn .s{color:var(--attn-ink)}
.srow.sm{min-height:36px;grid-template-columns:20px minmax(0,1fr) auto;padding:0 10px}
.srow.sm svg{width:18px;height:18px;color:var(--text-2)}
.srow.sm .lbl{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdots{display:inline-flex;gap:2px;margin-left:2px}
.tdots i{width:3px;height:3px;border-radius:50%;background:var(--agent-ink);animation:dotp 1.2s infinite ease-in-out}
.tdots i:nth-child(2){animation-delay:.16s}.tdots i:nth-child(3){animation-delay:.32s}
.pg{margin:2px 0}
.pg-h{display:flex;align-items:center;gap:2px;border-radius:var(--r-sm)}
.pg-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left;transition:background-color var(--dur-micro) ease}
.pg-toggle:hover{background:var(--state-hover)}
.pg-chev{flex:none;display:grid;place-items:center;width:20px;height:20px;color:var(--text-3);transition:transform var(--dur-move) var(--spring-smooth)}
.pg-chev svg{width:16px;height:16px}
.pg[data-open="false"] .pg-chev{transform:rotate(-90deg)}
.pg-name{flex:0 1 auto;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-sub{flex:1 1 0;min-width:0;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-list{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--dur-move) var(--spring-smooth)}
.pg[data-open="false"] .pg-list{grid-template-rows:0fr}
.pg-list>div{overflow:hidden;min-height:0;padding-left:8px}
.dashrow{display:flex;align-items:center;gap:2px}
.dashrow .srow{flex:1;min-width:0}
/* Calm: secondary icon actions in the sidebar show on hover or keyboard focus only */
.dashrow>.btn,.side-sec>.btn.icon{opacity:0;transition:opacity var(--dur-micro) ease}
.dashrow:hover>.btn,.dashrow:focus-within>.btn,.side-sec:hover>.btn.icon,.side-sec:focus-within>.btn.icon{opacity:1}
.nav .av>svg{width:100%;height:100%}
.side-foot{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:0 10px 0 14px;box-shadow:inset 0 1px 0 var(--line-subtle)}
.me-av{width:28px;height:28px;border-radius:50%;background:var(--text-1);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.side.collapsed .fade,.side.collapsed .side-sec>*,.side.collapsed .pg-h,.side.collapsed .srow .n,.side.collapsed .srow .s,.side.collapsed .nav .lbl,.side.collapsed .nav .count,.side.collapsed .srow.sm .lbl,.side.collapsed .brand .wm,.side.collapsed .side-search,.side.collapsed .dashrow .btn{display:none}
.side.collapsed .side-sec{height:12px;margin-top:4px}
.side.collapsed .srow,.side.collapsed .nav{grid-template-columns:32px;justify-content:center;padding:6px;min-height:44px}
.side.collapsed .pg-list>div{padding-left:0}
.side.collapsed .side-top{padding:0 12px;flex-direction:column;justify-content:center;height:auto;padding-top:10px;gap:6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg-ground);transition:background-color var(--dur-scene) ease}
/* In a 1:1 chat (Home is Atlas's) the top bar sits on the agent's wash, so there's no band between them */
.main[data-hue]{background:var(--agent-wash)}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px 0 24px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.crumbs .sep{color:var(--porcelain-500);padding:0 2px}
.crumbs button{height:24px;padding:0 8px;border-radius:999px;font-size:13px;color:var(--text-2)}
.crumbs button:hover{background:var(--state-hover);color:var(--text-1)}
.crumbs b{color:var(--text-1);font-weight:600;padding:0 6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.quiet{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--text-2);white-space:nowrap;transition:background-color var(--dur-micro) ease}
.quiet:hover{background:var(--state-hover)}
.quiet b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.quiet .ring{flex:none;width:18px;height:18px}
.quiet.is-limit b{color:var(--text-1)}
.banner{display:flex;align-items:center;gap:12px;margin:0 24px 8px;padding:10px 10px 10px 14px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1);font-size:13px;line-height:18px;color:var(--text-2);flex:none}
.banner>svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.banner b{color:var(--text-1);font-weight:600}
.banner .bt{flex:1;min-width:0}
.banner .acts{display:flex;gap:6px;flex:none;align-items:center}
.banner.ink{background:var(--bg-inverse);color:var(--text-inverse-2);box-shadow:var(--elev-2)}
.banner.ink b{color:var(--text-inverse)}
.banner.ink>svg{color:var(--text-inverse)}
.banner.ink code{background:rgb(255 255 255 / .1);color:var(--text-inverse);padding:1px 6px;border-radius:var(--r-xs);corner-shape:var(--corner)}
.banner.thin{padding:6px 8px 6px 14px}
.banner .count{background:var(--text-inverse);color:var(--text-1)}
.banner.drop{animation:dropIn var(--dur-move) var(--spring-smooth) both}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto}

/* ---------- toast, menu, popover, scrim ---------- */
#toastHost{position:fixed;right:24px;bottom:24px;z-index:550;display:grid;justify-items:end}
.toast{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;max-width:460px;padding:10px 10px 10px 14px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-inverse);color:var(--text-inverse);box-shadow:var(--elev-3);font-size:13px;line-height:18px;overflow:hidden;animation:rise var(--dur-short) var(--ease-out) both}
.toast>svg{width:18px;height:18px;flex:none;color:var(--text-inverse-2)}
.toast .tx{flex:1;min-width:0}
.toast .tx b{font-weight:600}
.toast .ta{display:flex;gap:2px;flex:none}
.toast .ta button{height:28px;padding:0 10px;border-radius:999px;color:var(--cobalt-300);font-size:13px;font-weight:600}
.toast .ta button:hover{background:rgb(255 255 255 / .08)}
.toast .timer{position:absolute;left:0;bottom:0;height:2px;background:var(--cobalt-300);opacity:.7;width:100%;transform-origin:left;animation:timer var(--t,10s) linear forwards}
.menu{position:fixed;z-index:600;min-width:248px;max-width:300px;padding:6px;background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-3)}
.menu.anim{animation:menuIn var(--dur-short) var(--ease-out)}
.menu [role="menuitem"]{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 10px;border-radius:var(--r-xs);corner-shape:var(--corner);font-size:13px;text-align:left}
.menu [role="menuitem"] svg{width:16px;height:16px;color:var(--text-2);flex:none}
.menu [role="menuitem"]:hover,.menu [role="menuitem"]:focus{background:var(--state-hover)}
.menu [role="menuitem"]:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.menu [role="menuitem"][aria-disabled="true"]{color:var(--text-3);cursor:not-allowed}
.menu [role="menuitem"] .why{margin-left:auto;font-size:12px;color:var(--text-3)}
.menu hr{border:0;height:1px;background:var(--line);margin:6px 4px}
.menu .m-cap{padding:6px 10px 4px;font-size:12px;line-height:16px;color:var(--text-3)}
.pop{position:fixed;z-index:600;width:380px;padding:8px;background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-3)}
.pop.anim{animation:menuIn var(--dur-short) var(--ease-out)}
.pop-h{display:flex;align-items:center;gap:8px;padding:6px 8px 8px;font-size:13px;line-height:18px}
.pop-h b{font-weight:600}
.pop ol{list-style:none;display:grid;gap:2px}
.pop li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;line-height:18px}
.pop li:hover{background:var(--state-hover)}
.pop li svg{width:16px;height:16px;color:var(--text-3)}
.pop li .tk-n{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.pop-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 4px;margin-top:4px;box-shadow:inset 0 1px 0 var(--line);font-size:12px;color:var(--text-3)}
.scrim{position:fixed;inset:0;z-index:400;background:var(--scrim);display:grid;place-items:center}
.scrim.anim{animation:fadeIn var(--dur-short) ease both}
.dialog{width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--bg-surface);border-radius:var(--r-xl);corner-shape:var(--corner);box-shadow:var(--elev-4);overflow:hidden}
.dialog.anim{animation:dlgIn var(--dur-scene) var(--spring-smooth) both}
.dialog.leaving{animation:dlgOut 240ms var(--ease-exit) both}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px 24px}
.dlg-h h2{flex:1;font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.dlg-body{flex:1;min-height:0;overflow-y:auto;background:var(--agent-wash);transition:background-color var(--dur-scene) ease}
.dlg-f{display:flex;align-items:center;gap:8px;padding:12px 16px 16px 24px;box-shadow:inset 0 1px 0 var(--line)}
.dlg-f .hint{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--text-3)}
.flyer{position:fixed;z-index:650;pointer-events:none;transform-origin:0 0}
.flyer svg{display:block;width:100%;height:100%}

/* ---------- home ---------- */
/* C6: Home is a calm conversation with Atlas. One column, the face, one question, one composer. */
.home{background:var(--agent-wash);--cut:var(--agent-wash)}
.home-scroll{display:flex;flex-direction:column}
.home-col{width:100%;max-width:680px;margin:auto;padding:32px 24px 40px}
.home-hero{display:grid;justify-items:center;gap:6px;padding-bottom:20px;text-align:center}
.home-hero .hero-av{width:80px;height:85px;margin:0}
.home-hero .nametag{margin-top:0}
.home-hero .statusline{margin-top:0}
.home .msgs{max-width:none;margin:0;padding:0}
.home .composer{width:min(680px,calc(100% - 48px));margin:0 auto}
.home .comp-hint{width:min(680px,calc(100% - 48px));margin:0 auto;padding-left:4px}
.ask-acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.wake{display:flex;gap:4px;margin-top:10px;--cut:var(--bg-surface)}
/* What needs you: an overlay over whatever you're looking at, anchored under the top bar's count */
.nd-scrim{position:fixed;inset:0;z-index:380;background:rgb(21 23 29 / .16)}
.nd-scrim.anim{animation:fadeIn var(--dur-short) ease both}
.nd-scrim.leaving{animation:fadeOut 200ms ease both}
.needs-ov{position:fixed;z-index:390;top:100px;right:16px;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 116px);display:flex;flex-direction:column;background:var(--bg-ground);border-radius:var(--r-xl);corner-shape:var(--corner);box-shadow:var(--elev-4);overflow:hidden;transform-origin:calc(100% - 56px) 0}
.needs-ov.anim{animation:ndIn var(--dur-scene) var(--spring-smooth) both}
.needs-ov.leaving{animation:ndOut 200ms var(--ease-exit) both}
.nd-h{flex:none;display:flex;align-items:center;gap:8px;padding:14px 12px 10px 24px}
.nd-h h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd-h h2:focus-visible{outline-offset:4px;border-radius:4px}
.nd-h h2[tabindex="-1"]:focus{outline:none}
.nd-h .btn.icon{margin-left:auto}
.nd-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 16px}
.nd-f{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px 8px 24px;box-shadow:inset 0 1px 0 var(--line-subtle);font-size:12px;line-height:16px;color:var(--text-3)}
.nd-f .grow{min-width:0}
.nd-done{display:grid;justify-items:center;gap:4px;padding:40px 16px 48px;text-align:center}
.nd-done b{font-weight:600}
.nd-done span{color:var(--text-2)}
.hello .date{font-size:12px;line-height:16px;color:var(--text-3)}
.hello h1{margin-top:2px;font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.hello p{font-size:15px;line-height:22px;color:var(--text-2)}
.ask{display:flex;align-items:center;gap:10px;max-width:720px;margin-top:16px;padding:6px 6px 6px 10px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:inset 0 0 0 1px var(--line-control);transition:box-shadow var(--dur-micro) ease}
.ask:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.ask input{flex:1;min-width:0;height:36px;border:0;background:transparent;font-size:15px}
.ask input:focus{outline:none}
.ask input::placeholder{color:var(--text-3)}
.atlas-line{display:flex;align-items:center;gap:8px;max-width:720px;margin:10px 0 0 4px;font-size:15px;line-height:22px;color:var(--text-2);min-width:0}
.atlas-line .t-meta{color:var(--text-3);flex:none}
.atlas-line .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;margin-top:28px;align-items:start}
.sec-h{display:flex;align-items:center;gap:8px;min-height:28px;margin:0 4px 12px}
.sec-h h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;display:flex;align-items:center;gap:8px}
.sec-h .cap{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.grp-l{display:flex;align-items:baseline;gap:6px;margin:16px 4px 8px;font-size:12px;font-weight:600;color:var(--text-3)}
.grp-l:first-child{margin-top:0}
.grp-l span{font-weight:400}
.moreline{display:flex;align-items:center;gap:12px;margin:12px 4px 0;font-size:12px;color:var(--text-3)}
.moreline .grow{min-width:0}
.digest{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 16px 18px;margin:0 0 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.digest .d-t{font-weight:600}
.digest p{margin-top:2px;color:var(--text-2);max-width:60ch}
.digest .wake{display:flex;gap:4px;margin-top:10px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:24px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.empty b{font-weight:600}
.empty p{color:var(--text-2);max-width:46ch;margin-bottom:8px}
.empty.dashed{background:transparent;box-shadow:inset 0 0 0 1px var(--line-control)}

/* ---------- tickets: one component, three sizes (rest · open · small) ---------- */
.tickets{list-style:none;display:flex;flex-direction:column;gap:8px;container-type:inline-size;--tk-open-fs:28px;--tk-open-lh:34px}
.tickets.in-pane,.tickets.compact{--tk-open-fs:20px;--tk-open-lh:26px}
.tk{position:relative;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);transition:box-shadow var(--dur-move) var(--spring-smooth),opacity var(--dur-short) ease}
.tk:hover{box-shadow:0 0 0 1px rgb(21 23 29 / .13),0 2px 6px hsl(var(--shadow-color) / .05)}
.tk[data-state="open"]{box-shadow:var(--elev-2)}
.tk.rise{animation:rise var(--dur-move) var(--spring-smooth) both;animation-delay:var(--d,0ms)}
.tk.folding{overflow:hidden;transition:height var(--dur-move) var(--spring-smooth),opacity var(--dur-short) var(--ease-exit),margin var(--dur-move) var(--spring-smooth),transform var(--dur-move) var(--ease-exit)}
.tk.leave-left{transform:translateX(-24px)}
.tk-head{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;text-align:left;border-radius:var(--r-lg);corner-shape:var(--corner);transition:padding var(--dur-move) var(--spring-smooth)}
.tk-head:focus-visible{outline-offset:-2px}
.tk[data-state="open"] .tk-head{align-items:flex-start;padding:20px 20px 0}
.tk[data-state="small"] .tk-head{min-height:44px;padding:8px 14px}
.tk-av{flex:none;width:32px;height:32px;--b:14px;transition:width var(--dur-move) var(--spring-smooth),height var(--dur-move) var(--spring-smooth)}
.tk[data-state="open"] .tk-av{width:40px;height:40px;--b:16px}
.tk[data-state="small"] .tk-av{width:24px;height:24px;--b:12px}
.tk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tk[data-state="open"] .tk-main{flex-direction:column-reverse;gap:4px}
.tk-tl{display:flex;align-items:center;gap:8px;min-width:0}
.tk-title{flex:0 1 auto;min-width:0;font-size:15px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size var(--dur-move) var(--spring-smooth),line-height var(--dur-move) var(--spring-smooth)}
.tk[data-state="open"] .tk-title{white-space:normal;font-family:var(--font-display);font-size:var(--tk-open-fs);line-height:var(--tk-open-lh);letter-spacing:-.022em;text-wrap:balance}
.tk-mini{display:none}
.tk[data-state="small"] .tk-mini{display:inline-flex}
.tk-line{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;line-height:16px;color:var(--text-3)}
.tk-line .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-line .age{margin-left:auto;flex:none;padding-left:8px;font-variant-numeric:tabular-nums}
.tk[data-state="small"] .tk-line{display:none}
.tk-chev{flex:none;display:grid;place-items:center;width:24px;height:24px;color:var(--text-3);transition:transform var(--dur-move) var(--spring-smooth)}
.tk-chev svg{width:16px;height:16px}
.tk[data-state="open"] .tk-chev{transform:rotate(180deg)}
.tk-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-move) var(--spring-smooth)}
.tk[data-state="open"] .tk-more{grid-template-rows:1fr}
.tk-more>div{overflow:hidden;min-height:0}
.tk-body{padding:12px 20px 20px 72px}
@container (max-width:520px){.tk-body{padding-left:20px}}
.tk-d{max-width:58ch;color:var(--text-2)}
.tk-d code{color:var(--text-1)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground);box-shadow:inset 0 0 0 1px transparent;cursor:pointer;transition:box-shadow var(--dur-micro) ease,background-color var(--dur-micro) ease}
.opt:hover{box-shadow:inset 0 0 0 1px rgb(21 23 29 / .18)}
.opt:has(input:checked){background:var(--bg-surface);box-shadow:inset 0 0 0 2px var(--text-1)}
.opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.opt input{flex:none;width:16px;height:16px;margin:3px 0 0;accent-color:var(--text-1)}
.opt input:focus-visible{outline:none}
.opt .ob{flex:1;min-width:0;display:grid;gap:2px}
.opt .ob b{font-weight:600}
.opt .ob span{font-size:12px;line-height:16px;color:var(--text-3)}
.opt .tag{margin-left:auto}
.mail{display:grid;gap:8px;margin-top:16px;padding:14px 16px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground)}
.mail .to{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 8px;font-size:12px;line-height:16px;color:var(--text-3)}
.mail .to b{color:var(--text-1);font-weight:400}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin-top:14px}
.facts dt{color:var(--text-3);font-size:12px;line-height:22px}
.cmd{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground);font:400 15px/22px var(--font-mono);letter-spacing:0;min-width:0}
.cmd .in{margin-left:auto;font:400 12px/16px var(--font-text);color:var(--text-3);white-space:nowrap}
.cmd .dollar{color:var(--text-3)}
.cons-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
/* Calm: what an action will cost or touch is one quiet line, not a row of pills */
.cons-line{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:12px;font-size:13px;line-height:18px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cons-line .sp{color:var(--porcelain-500)}
.tk-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.tk-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:14px;font-size:12px;line-height:16px;color:var(--text-3)}
.tk-why{margin-top:8px;font-size:12px;line-height:16px;color:var(--text-3)}
.tk-note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground);font-size:12px;line-height:16px;color:var(--text-2)}
.tk-note svg{width:16px;height:16px;flex:none;color:var(--text-3)}
.deny-box{display:grid;gap:8px;margin-top:14px;padding:12px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground)}
.deny-box label{font-size:12px;font-weight:600;color:var(--text-2)}
.resolved{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);font-size:13px;line-height:18px;color:var(--text-2)}
.resolved .ok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-tint);color:var(--ok-ink)}
.resolved .ok.neutral{background:var(--bg-sunken);color:var(--text-1)}
.resolved .ok svg{width:16px;height:16px}
.resolved b{color:var(--text-1);font-weight:600;display:block}

/* ---------- project cards, learned strip ---------- */
.projects{display:grid;gap:12px}
.pcard{position:relative;display:grid;gap:14px;padding:16px 12px 16px 20px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);transition:box-shadow var(--dur-short) ease}
.pcard:has(.pc-link:hover){box-shadow:0 0 0 1px rgb(21 23 29 / .13),0 2px 8px hsl(var(--shadow-color) / .06)}
.pcard:has(.pc-link:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.pc-top{display:flex;align-items:flex-start;gap:8px}
.pc-id{flex:1;min-width:0}
.pc-id h3{font-size:15px;line-height:22px;font-weight:600}
.pc-id .pc-link{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-weight:600}
.pc-link{text-align:left}
.pc-link::after{content:"";position:absolute;inset:0;border-radius:inherit}
.pc-link:focus-visible{outline:none}
.pc-id .t-meta{display:block;color:var(--text-3)}
.pc-top>.tag,.pc-top>.btn{position:relative;z-index:1}
.pc-top>.tag{margin-top:1px}
.pc-top>.btn{margin:-4px 0 0}
.prog{display:grid;gap:6px;padding-right:8px}
.prog .ends{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--text-3)}
.prog .ends b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:relative;display:block;height:6px;border-radius:999px;background:var(--bg-sunken)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--text-1);transition:width var(--dur-scene) var(--spring-smooth)}
.bar>.mark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text-2)}
.bar>.ceiling{position:absolute;top:0;bottom:0;right:0;border-radius:0 999px 999px 0;background:repeating-linear-gradient(135deg,rgb(21 23 29 / .3) 0 2px,transparent 2px 5px)}
.pc-foot{display:flex;align-items:center;gap:12px;min-width:0;padding-right:8px}
.pc-foot .act{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.new{grid-template-columns:40px minmax(0,1fr);align-items:center;gap:14px;padding:14px 20px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-control);text-align:left;width:100%}
.pcard.new:hover{background:var(--bg-surface)}
.pc-plus{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--bg-sunken)}
.pc-plus svg{width:20px;height:20px}
.pcard.new b{display:block;font-weight:600}
.pcard.new .t-meta{display:block;color:var(--text-3)}
.pcard.gather .stack>.av{transition:margin var(--dur-move) var(--spring-smooth)}
.pcard.gather .stack>.av+.av{margin-left:-12px}
.pcard.gather .stack{animation:hop .64s var(--spring-gentle) .32s 1}
.learned{margin-top:24px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);overflow:hidden}
.learned-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 16px;text-align:left}
.learned-h:hover{background:var(--porcelain-25)}
.learned-h:focus-visible{outline-offset:-2px}
.l-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bg-sunken);color:var(--text-1);flex:none}
.l-ic svg{width:18px;height:18px}
.learned-h .tx{flex:1;min-width:0}
.learned-h .tx b{display:block;font-weight:600}
.learned-h .tx span{display:block;font-size:12px;line-height:16px;color:var(--text-3)}
.learned-h .chev{width:16px;height:16px;color:var(--text-3);transition:transform var(--dur-move) var(--spring-smooth);flex:none}
.learned[data-open="true"] .learned-h .chev{transform:rotate(180deg)}
.learned-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-move) var(--spring-smooth)}
.learned[data-open="true"] .learned-list{grid-template-rows:1fr}
.learned-list>div{overflow:hidden;min-height:0}
.learned-list ul{list-style:none;padding:0 12px 12px}
.learned-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px 6px;box-shadow:inset 0 1px 0 var(--line-subtle)}
.learned-list li b{font-weight:600;line-height:20px}
.learned-list li .src{grid-column:1;font-size:12px;line-height:16px;color:var(--text-3)}
.learned-list li .la{grid-row:1/3;grid-column:2;display:flex;gap:2px}
.learned-list li.gone{opacity:.5}
.learned-list li.gone b{text-decoration:line-through}
.learned-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px 14px;font-size:12px;color:var(--text-3)}

/* ---------- conversation (shared) ---------- */
.chatroom{display:flex;flex-direction:column;min-height:0;background:var(--agent-wash);transition:background-color var(--dur-scene) ease;--cut:var(--agent-wash)}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.msgs{display:flex;flex-direction:column;gap:6px;max-width:740px;margin:0 auto;padding:16px 24px 20px}
.day{align-self:center;margin:8px 0;font-size:12px;color:var(--text-3)}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;margin-top:8px}
.msg .who{display:flex;align-items:baseline;gap:8px;margin:0 0 4px 4px;font-size:13px;line-height:18px}
.msg .who b{font-weight:600;color:var(--agent-ink)}
.msg .who span{font-size:12px;color:var(--text-3)}
.msg .stackb{display:grid;justify-items:start;gap:4px;min-width:0}
.bubble{width:fit-content;max-width:min(var(--measure-chat),100%);padding:10px 14px;border-radius:var(--r-lg);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1);overflow-wrap:anywhere}
.msg .bubble{border-top-left-radius:var(--r-xs)}
.bubble p+p{margin-top:6px}
.mine{display:grid;justify-items:end;gap:4px;margin:8px 0 0 auto;max-width:min(var(--measure-chat),88%)}
.mine .bubble{background:var(--agent-tint);box-shadow:none;border-bottom-right-radius:var(--r-xs)}
.mine.neutral .bubble{background:var(--porcelain-150)}
.mine .bubble.is-queued{background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line-control)}
.mine .thread{max-width:100%;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:2px 4px 0;font-size:12px;line-height:16px;color:var(--text-3);font-variant-numeric:tabular-nums}
.msg-meta .sp{color:var(--porcelain-500)}
/* Calm: a receipt shows under the latest message of each sender; older ones appear on hover or keyboard focus.
   The glass box stays one glance away, without a meta line under every bubble. */
.msgs>.msg .msg-meta,.msgs>.mine .msg-meta{opacity:0;transition:opacity var(--dur-short) ease}
.msgs>.msg:hover .msg-meta,.msgs>.msg:focus-within .msg-meta,.msgs>.mine:hover .msg-meta,.msgs>.mine:focus-within .msg-meta,
.msgs>.msg:not(:has(~ .msg)) .msg-meta,.msgs>.mine:not(:has(~ .mine)) .msg-meta{opacity:1}
.msg-meta .lookin{margin-left:-4px}
.receipt{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;color:var(--text-3)}
.receipt svg{width:13px;height:13px}
.sys{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;max-width:46em;margin:12px auto;font-size:13px;line-height:18px;color:var(--text-3);text-align:center}
.sys>svg{width:14px;height:14px;flex:none}
.sys .linkbtn{font-size:13px}
.sys.learn{color:var(--text-2)}
.sys.learn>svg{color:var(--agent-ink)}
.checklist{display:grid;gap:4px;margin-top:6px}
.checklist>div{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start}
.checklist svg{width:16px;height:16px;margin-top:3px;color:var(--ok-fill)}
.checklist .ar{color:var(--text-3);margin:0 4px}
.checklist .ck-path{stroke-dasharray:24;stroke-dashoffset:0}
.cascade .checklist>div{animation:ckRow 240ms var(--ease-out) both;animation-delay:calc(var(--i) * 90ms)}
.cascade .checklist .ck-path{animation:ckDraw 120ms var(--ease-out) both;animation-delay:calc(var(--i) * 90ms + 40ms)}
.thinking{display:flex;align-items:center;gap:8px;margin:6px 0 0 42px;font-size:13px;line-height:18px;color:var(--text-2)}
.think-dots{display:inline-flex;gap:4px;padding:10px 12px;border-radius:var(--r-lg);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1)}
.think-dots i{width:6px;height:6px;border-radius:50%;background:var(--agent-ink);animation:dotp 1.2s infinite ease-in-out}
.think-dots i:nth-child(2){animation-delay:.16s}.think-dots i:nth-child(3){animation-delay:.32s}
.liveline{display:flex;align-items:center;gap:8px;margin:8px 0 0 42px;font-size:13px;line-height:18px;color:var(--text-2)}
.liveline .tdots i{width:4px;height:4px}
.applied{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:24px;max-width:100%;padding:3px 10px 3px 8px;border-radius:999px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;line-height:16px;color:var(--text-2);text-align:left}
.applied:hover{box-shadow:inset 0 0 0 1px rgb(21 23 29 / .22)}
.applied svg{width:14px;height:14px;color:var(--agent-ink);flex:none}
.applied b{color:var(--text-1);font-weight:600}
.applied .src{color:var(--text-3)}
.applied.glow{animation:learned 2.4s var(--ease-out) .3s 1 both}
.recovery{display:grid;gap:12px;max-width:var(--measure-chat);padding:16px 18px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-2)}
.recovery .why{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px}
.recovery .why>svg{width:18px;height:18px;margin-top:2px;color:var(--text-2)}
.recovery .why b{display:block;font-weight:600}
.recovery .why p{color:var(--text-2)}
.recovery .kept{display:flex;flex-wrap:wrap;gap:6px}
.recovery .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recovery details{font-size:12px;line-height:16px;color:var(--text-3)}
.recovery summary{cursor:pointer;font-weight:600;color:var(--text-2);width:fit-content;border-radius:4px}
.recovery pre{margin:8px 0 0;padding:10px 12px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-sunken);font:12px/18px var(--font-mono);color:var(--text-2);white-space:pre-wrap;max-height:150px;overflow:auto}
.recovery.resolved-card{box-shadow:var(--elev-1);opacity:.85}
.long{position:relative;max-height:132px;overflow:hidden}
.long::after{content:"";position:absolute;inset:auto 0 0 0;height:48px;background:linear-gradient(transparent,var(--bg-surface))}
.code{font:12px/20px var(--font-mono);background:var(--bg-sunken);border-radius:var(--r-sm);corner-shape:var(--corner);padding:10px 12px;margin-top:6px;white-space:pre;overflow:hidden}
.code.long{max-height:260px}
.code.long::after{background:linear-gradient(rgb(236 238 242 / 0),var(--bg-sunken))}
.code.all{max-height:360px;overflow:auto}
.code{overflow:auto;max-width:100%}
.code .hl,.term .hl{display:inline-block;min-width:100%;background:var(--danger-tint);color:var(--danger-ink)}
.code .ln,.term .ln{display:inline-block;min-width:3.5ch;color:var(--text-3);user-select:none}
.logacts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.suggest{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;margin:0 16px 12px;padding:14px 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-2)}
.suggest b{display:block;font-weight:600}
.suggest p{color:var(--text-2);margin-top:2px}
.suggest .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.suggest .l-ic{color:var(--text-1)}
.suggest.arrive{animation:rise var(--dur-move) var(--spring-smooth) both}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;margin:0 auto;width:min(692px,calc(100% - 48px));box-sizing:border-box;padding:6px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:inset 0 0 0 1px var(--line-control),var(--elev-2);transition:box-shadow var(--dur-micro) ease}
.composer:focus-within{box-shadow:inset 0 0 0 2px var(--focus),var(--elev-2)}
.composer textarea{flex:1;min-width:0;min-height:36px;max-height:120px;padding:7px 4px;border:0;background:transparent;resize:none;font-size:15px;line-height:22px}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--text-3)}
.comp-hint{display:flex;align-items:center;gap:6px;min-height:28px;margin:0 28px;padding:4px 0 8px;font-size:12px;line-height:16px;color:var(--text-3);font-variant-numeric:tabular-nums}
/* C2: the brand board's handoff. The brief chip (sender's face + "Brief · S1-6") rises, flies an arc on ease-in-out,
   is absorbed at the receiver, who squashes once as it lands. At rest (and with reduced motion) it waits at the top of the arc. */
.handoff-row{display:flex;flex-direction:column;align-items:center;gap:2px;margin:14px 0}
.ho-stage{position:relative;display:block;width:200px;height:68px}
.ho-from,.ho-to{position:absolute;bottom:4px;line-height:0}
.ho-from{left:0}.ho-to{right:0}
.ho-body{display:inline-block;transform-origin:50% 100%}
.ho-chip{position:absolute;left:0;top:0;offset-path:path("M 14 50 C 60 2, 140 2, 186 50");offset-rotate:0deg;offset-distance:50%;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 3px;border-radius:999px;background:var(--bg-surface);box-shadow:var(--elev-3);font-size:12px;line-height:1;font-weight:600;white-space:nowrap;color:var(--text-1)}
.handoff-row.go .ho-chip{animation:hoFly 1300ms both}
.handoff-row.go .ho-body{animation:hoBump 620ms ease-out 1000ms both}

/* ---------- agent page ---------- */
/* C5: the agent page opens as just the chat. Its few tools float top-right on the wash (no header bar);
   the face, name and status live in the hero. */
.chatroom{position:relative;container-type:inline-size}
.ahead{position:absolute;top:8px;right:24px;z-index:6;display:flex;align-items:center;gap:10px}
.scr-btn{position:relative}
.scr-btn.is-live::after{content:"";position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--agent-ink);box-shadow:0 0 0 2px var(--agent-wash)}
@container (max-width:620px){.ahead .ctx{display:none}}
.ah-id{flex:1;min-width:0}
.ah-name{display:flex;align-items:center;gap:8px;min-width:0}
.ah-name h1{font:600 20px/26px var(--font-display);letter-spacing:-.014em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ah-id .t-meta{display:block;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah-r{display:flex;align-items:center;gap:12px;flex:none}
.needlink{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:var(--attn-tint);color:var(--attn-ink);font-size:12px;font-weight:600}
.needlink:hover{box-shadow:inset 0 0 0 1px var(--attn-ink)}
.ctx{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);white-space:nowrap}
.ctx .bar{width:64px;height:4px}
.ctx .bar>.mark{top:-3px;bottom:-3px}
.ctx b{font-weight:600;color:var(--text-1);font-variant-numeric:tabular-nums}
.runrcpt{font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.runrcpt b{color:var(--text-1);font-weight:600}
@media (max-width:1400px){.ctx-x,.runrcpt .rx{display:none}}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,1fr) 360px;transition:grid-template-columns var(--dur-scene) var(--spring-smooth)}
.split.wide-pane{grid-template-columns:minmax(340px,.85fr) minmax(500px,1.15fr)}
.split.pane-off{grid-template-columns:minmax(380px,1fr) 0px}
/* The hero is sticky. Its own box is solid wash, so nothing that scrolls under it can show through the
   ledger line (the v0.3-partial bug); the fade lives below the box, over the messages, not under the text. */
.hero-wrap{position:sticky;top:0;z-index:3;padding:14px 0 12px;text-align:center;background:var(--agent-wash)}
.hero-wrap::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--agent-wash),rgb(255 255 255 / 0));pointer-events:none}
.hero-wrap .ledger{position:relative;z-index:1}
.nametag{display:inline-block;max-width:calc(100% - 48px);height:26px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;margin-top:4px;padding:0 12px;border-radius:999px;background:var(--bg-surface);box-shadow:var(--elev-1);color:var(--agent-ink);font-size:15px;font-weight:600}
.statusline{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:13px;line-height:18px;color:var(--text-2);transition:opacity var(--dur-short) ease}
.statusline.swap{opacity:0}
.statusline .bdg{position:static;width:16px;height:16px;box-shadow:inset 0 0 0 1px var(--line)}
.statusline .bdg.attn,.statusline .bdg.solid,.statusline .bdg.err,.statusline .bdg.ok{box-shadow:none}
.ledger{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:2px 8px;border-radius:999px;font-size:12px;line-height:16px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ledger:hover{background:var(--state-hover);color:var(--text-2)}
.ledger svg{width:13px;height:13px}
.wcard{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center;width:min(calc(100% - 42px),32em);margin:10px 0 0 42px;padding:10px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.wthumb{height:80px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-ground);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-subtle)}
.wthumb .mini{font:400 5.5px/8px var(--font-mono);padding:6px;white-space:pre;color:var(--text-2)}
.wthumb .mini .a{background:#dff2e5}.wthumb .mini .r{background:#fbe3e3}
.wcard .wt{font-weight:600;margin:2px 0 8px;line-height:20px}
.wcard .wrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline-ask{margin:12px 0 4px 42px}
.inline-ask[hidden]{display:none!important}
.pointer{display:inline-flex;align-items:center;gap:8px;height:32px;margin:10px 0 0 42px;padding:0 12px 0 4px;border-radius:999px;background:var(--bg-surface);box-shadow:var(--elev-1);font-size:13px;width:fit-content}
.pointer:hover{box-shadow:0 0 0 1px rgb(21 23 29 / .16)}
.pointer svg{width:14px;height:14px;color:var(--text-3)}
.ws{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-surface);box-shadow:inset 1px 0 0 var(--line-subtle);overflow:hidden;container-type:inline-size}
.ws-inner{display:flex;flex-direction:column;min-height:0;height:100%;transition:opacity var(--dur-short) ease,transform var(--dur-scene) var(--spring-smooth)}
.pane-off .ws-inner{opacity:0;transform:translateX(24px)}
.ws-head{flex:none;display:flex;align-items:center;gap:6px;min-height:52px;padding:8px 10px 4px 16px}
.ws-head .ws-h{font-size:15px;line-height:22px;font-weight:600;white-space:nowrap}
.ws-head .cap{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:4px}
.ws-head .grow{flex:1}
.ws-head #wsBack{margin-left:-6px}
/* The compact live preview: click to enter the full view */
.scr-prev{display:block;width:calc(100% - 32px);margin:4px 16px 0;padding:0;text-align:left;border-radius:var(--r-lg);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:box-shadow var(--dur-micro) ease}
.scr-prev:hover{box-shadow:inset 0 0 0 1px rgb(21 23 29 / .22)}
.scr-thumb{display:block;height:128px;overflow:hidden;background:var(--bg-ground);box-shadow:inset 0 -1px 0 var(--line-subtle)}
.scr-thumb .mini{display:block;font:400 7px/10px var(--font-mono);padding:8px 10px;white-space:pre;color:var(--text-2)}
.scr-thumb .mini .a{background:#dff2e5}.scr-thumb .mini .r{background:#fbe3e3}
.scr-cap{display:flex;align-items:center;gap:6px;min-width:0;padding:8px 12px;font-size:12px;line-height:16px;color:var(--text-2)}
.scr-cap .mono{color:var(--text-1);min-width:0}
.scr-cap .plus{color:var(--ok-ink)}.scr-cap .minus{color:var(--danger-ink)}
.scr-cap .grow{flex:1}
.scr-live{display:inline-flex;align-items:center;gap:5px;color:var(--text-3);white-space:nowrap}
.scr-live i{width:6px;height:6px;border-radius:50%;background:var(--agent-ink)}
.ws-quiet{margin:6px 20px 0;font-size:13px;line-height:18px;color:var(--text-3)}
.ws-foot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px 14px;box-shadow:inset 0 1px 0 var(--line-subtle);font-size:12px;color:var(--text-3)}
.ws-foot .grow{flex:1}
.ws-panel{flex:1;min-height:0;display:flex;flex-direction:column}
.ws-title{display:flex;align-items:baseline;gap:10px;padding:2px 20px 6px;min-width:0}
.ws-title h2{font-size:15px;font-weight:600;white-space:nowrap}
.ws-title .t-meta{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files{display:flex;gap:4px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line-subtle);overflow-x:auto;flex:none}
.files button{height:34px;padding:0 10px;font:12px/1 var(--font-mono);letter-spacing:0;color:var(--text-3);box-shadow:inset 0 -2px 0 transparent;white-space:nowrap}
.files button[aria-selected="true"]{color:var(--text-1);box-shadow:inset 0 -2px 0 var(--text-1)}
.files .plus{color:var(--ok-ink)}.files .minus{color:var(--danger-ink)}
.ws-body{flex:1;min-height:0;overflow:auto}
.diff{font:400 12.5px/20px var(--font-mono);letter-spacing:0;padding:8px 0 16px;min-width:max-content}
.dl{display:grid;grid-template-columns:44px 20px 1fr;padding-right:20px}
.dl .ln{color:var(--text-3);text-align:right;padding-right:10px;user-select:none}
.dl .sg{color:var(--text-2);user-select:none}
.dl code{font-size:inherit;white-space:pre;color:var(--text-1)}
.dl-add{background:#e9f6ee}.dl-del{background:#fdeeee}
.dl-hunk{background:var(--bg-sunken)}.dl-hunk code{color:var(--text-2)}
.term{font:400 12.5px/20px var(--font-mono);letter-spacing:0;padding:14px 20px;white-space:pre-wrap;color:var(--text-1)}
.term .pass{color:var(--ok-ink);font-weight:600}.term .run{color:var(--attn-ink);font-weight:600}.term .fail{color:var(--danger-ink);font-weight:600}.term .mut{color:var(--text-3)}
.flist{list-style:none;padding:8px 12px}
.flist li{display:flex;justify-content:space-between;padding:10px 8px;box-shadow:inset 0 -1px 0 var(--line-subtle);font:12.5px/18px var(--font-mono)}
.dock{flex:none;padding:12px 14px 14px;background:var(--bg-ground);box-shadow:inset 0 1px 0 var(--line-subtle)}
.dock .tk{box-shadow:var(--elev-2)}
.ws-scroll{flex:1;min-height:0;overflow-y:auto}
.ws-empty{margin:24px 20px;padding:24px;border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:inset 0 0 0 1px var(--line-control);display:grid;gap:6px;justify-items:start}
.ws-empty b{font-weight:600}
.ws-empty p{color:var(--text-2);max-width:44ch}
/* routines */
.rt-head{flex:none;display:flex;align-items:center;gap:8px;padding:20px 12px 6px 20px}
.rt-head h3{font-size:15px;line-height:22px;font-weight:600}
.rt-cap{font-size:12px;color:var(--text-3);white-space:nowrap}
.rt-head .btn{margin-left:auto}
.rt-sum{margin:2px 20px 20px;font-size:12px;line-height:16px;color:var(--text-3);max-width:62ch}
/* Compact routine rows: name, when and the cost per run; the figures open on click */
.rt-row{border-radius:var(--r-sm);corner-shape:var(--corner);transition:background-color var(--dur-micro) ease}
.rt-row:hover,.rt-row.is-open{background:var(--bg-ground)}
.rt-top{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 0}
.rt-name{flex:1;min-width:0;display:grid;gap:1px;padding:8px 4px 8px 12px;text-align:left;border-radius:var(--r-sm);corner-shape:var(--corner)}
.rt-name:focus-visible{outline-offset:-2px}
.rt-name b{font-size:13px;line-height:18px;font-weight:600}
.rt-when{font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-row.is-off .rt-name b{color:var(--text-2)}
.rt-more{display:grid;gap:10px;padding:2px 12px 12px}
.rt-more .figs{padding-top:8px}
.rt-more .row{gap:6px}
.rt-sum b{color:var(--text-1);font-weight:600}
.rt-new{margin:0 16px 12px;padding:14px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-ground)}
.rt-new label{display:block;margin:0 0 6px;font-size:13px;font-weight:600}
.rt-new-row{display:flex;gap:8px;align-items:center}
.rt-new-row .inp{flex:1;min-width:0}
.rt-draft{margin-top:12px;padding:14px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1)}
.rt-est{margin:8px 0 10px;font-size:12px;line-height:16px;color:var(--text-2)}
.rt-list{list-style:none;padding:0 8px 4px;display:grid;gap:2px}
.rcard{display:grid;gap:10px;padding:14px 12px 14px 16px;background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.rcard .top{display:flex;align-items:center;gap:8px;min-width:0}
.rcard .top h3{min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .top .switch{margin-left:auto}
.rcard .when{font-size:13px;color:var(--text-2);margin-top:-6px}
.rcard.is-off h3,.rcard.is-off .figs b{color:var(--text-2)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:10px;box-shadow:inset 0 1px 0 var(--line-subtle)}
.figs dt{font-size:12px;line-height:16px;color:var(--text-3)}
.figs dd{margin:2px 0 0;font-size:13px;line-height:18px;font-weight:600;font-variant-numeric:tabular-nums}
.figs small{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--text-3)}
.inline-alert{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;line-height:18px}
.inline-alert>svg{width:16px;height:16px}
.inline-alert.attn{background:var(--attn-tint);color:var(--attn-ink)}
.inline-alert.danger{background:var(--danger-tint);color:var(--danger-ink)}
.inline-alert.neutral{background:var(--bg-sunken);color:var(--text-2)}
/* settings */
.set{flex:1;min-height:0;display:grid;grid-template-columns:168px minmax(0,1fr)}
.set-nav{overflow-y:auto;padding:4px 8px 16px;box-shadow:inset -1px 0 0 var(--line-subtle)}
.set-nav h3{margin:12px 10px 4px;font-size:12px;font-weight:600;color:var(--text-3)}
.set-nav h3:first-child{margin-top:4px}
.set-nav button{display:block;width:100%;min-height:36px;padding:8px 10px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left;transition:background-color var(--dur-micro) ease}
.set-nav button:hover{background:var(--state-hover)}
.set-nav button[aria-current="true"]{background:var(--state-selected)}
.set-nav b{display:block;font-size:13px;font-weight:400;line-height:18px}
.set-nav button[aria-current="true"] b{font-weight:600}
/* Progressive disclosure inside settings and insight pages: a quiet summary row, chevron, then the rows */
.disc{margin-top:20px}
.disc>summary{display:flex;align-items:center;gap:6px;width:fit-content;min-height:32px;padding:0 8px 0 4px;margin-left:-4px;border-radius:var(--r-sm);corner-shape:var(--corner);list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2)}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary:hover{background:var(--state-hover);color:var(--text-1)}
.disc>summary svg{width:16px;height:16px;color:var(--text-3);transform:rotate(-90deg);transition:transform var(--dur-move) var(--spring-smooth)}
.disc[open]>summary svg{transform:none}
.disc>summary .n{font-weight:400;color:var(--text-3)}
.set-nav span{display:block;font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-main{overflow-y:auto;min-width:0;padding:8px 20px 32px}
.set-main h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.set-lede{margin:2px 0 16px;color:var(--text-2);max-width:52ch}
.set-main h2+.pf-av,.set-main h2+.memhead{margin-top:16px}
.set-group{margin-top:24px}
.set-group>h3{margin-bottom:4px;font-size:12px;font-weight:600;color:var(--text-3)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;box-shadow:inset 0 1px 0 var(--line-subtle)}
.set-group>h3+.setrow,.set-lede+.setrow{box-shadow:none}
.setrow-m{flex:1;min-width:0}
.setrow-t{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:600;line-height:20px}
.setrow-d{margin-top:2px;font-size:12px;line-height:16px;color:var(--text-3)}
.setrow>.ic{flex:none;width:16px;height:16px;color:var(--text-3)}

.sv-div::after{content:"";position:absolute;top:50%;left:2px;width:5px;height:32px;margin-top:-16px;border-radius:3px;background:var(--porcelain-300)}
.sv-div:hover::before,.sv-div:focus-visible::before,.sv-div.drag::before{left:3px;width:3px;background:var(--text-2)}
.sv-div:focus-visible{outline:none}
.pv{display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;background:var(--bg-ground)}
#p-project .pv{flex:1}
.pv-head{flex:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px 8px 24px;width:100%;max-width:1040px;margin:0 auto;box-sizing:border-box}
.pv-id{flex:1;min-width:0}
.pv-id h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-id .t-meta{display:block;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-body{flex:1;min-height:0;overflow-y:auto}
.pv-inner{max-width:1040px;margin:0 auto;padding:4px 24px 40px}
.pv-sec{margin-top:32px}
.pv-needs{display:inline-flex;align-items:center;gap:8px;height:32px;margin-top:16px;padding:0 12px 0 6px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-1);transition:background-color var(--dur-micro) ease}
.pv-needs:hover{background:var(--state-hover)}
.pv-needs svg{width:14px;height:14px;color:var(--text-3)}
.pv-sec>h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600}
.pv-none{color:var(--text-3)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col h4{display:flex;gap:6px;margin:0 0 8px;font-size:12px;font-weight:600;color:var(--text-3)}
.col h4 span{font-weight:400}
.col ul{list-style:none;display:grid;gap:8px}
.col .colempty{padding:4px 0;font-size:12px;line-height:16px;color:var(--text-3)}
.bcard{display:grid;gap:6px;padding:12px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1);--cut:var(--bg-surface)}
.bcard .bt{font-size:13px;line-height:18px;font-weight:600;overflow-wrap:anywhere}
.bcard .bm{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;line-height:16px;color:var(--text-3)}
.col-more{margin:8px 2px 0;font-size:12px;color:var(--text-3)}
.setup{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.setup .grow b{display:block;font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.setup .grow p{color:var(--text-2)}
.setup.gather .stack>.av+.av{margin-left:-12px}
.setup.gather .stack{animation:hop .64s var(--spring-gentle) .3s 1}
.setup .stack>.av{transition:margin var(--dur-scene) var(--spring-smooth)}
@container (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
@container (max-width:440px){.pv-head .stack{display:none}}
.dropzones{position:absolute;inset:0;z-index:40;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:color-mix(in srgb,var(--bg-ground) 94%,transparent)}
.dz{display:grid;place-items:center;padding:16px;border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:inset 0 0 0 2px var(--line-control);font-weight:600;color:var(--text-2);text-align:center}
.dz.over{box-shadow:inset 0 0 0 2px var(--text-1);color:var(--text-1);background:var(--bg-surface)}

/* ---------- insight: memory, usage, trace, needs ---------- */
.page{max-width:1080px;width:100%;margin:0 auto;padding:12px 40px 56px}
.page.narrow{max-width:760px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.page-h h1{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.page-h p{color:var(--text-2);margin-top:2px}
.page-h .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.history{list-style:none;display:grid;gap:8px}
.history li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);--cut:var(--bg-surface)}
.history li .grow b{display:block;font-weight:600}
.history li .grow span{display:block;font-size:12px;line-height:16px;color:var(--text-3)}
.mem{flex:1;min-height:0;display:grid;grid-template-columns:224px 300px minmax(0,1fr);margin:0 24px 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);overflow:hidden}
.mem-top{flex:none;display:flex;align-items:center;gap:16px;padding:4px 24px 14px}
.mem-top h1{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.mem-top .acts{margin-left:auto;display:flex;gap:8px}
.mem-scopes{overflow-y:auto;padding:12px 8px;box-shadow:inset -1px 0 0 var(--line-subtle);--cut:var(--bg-surface)}
.mem-scopes h3{margin:12px 10px 4px;font-size:12px;font-weight:600;color:var(--text-3)}
.mem-scopes h3:first-child{margin-top:0}
.mem-scopes button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;text-align:left}
.mem-scopes button:hover{background:var(--state-hover)}
.mem-scopes button[aria-current="true"]{background:var(--state-selected);font-weight:600}
.mem-scopes button .n{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:400;font-variant-numeric:tabular-nums}
.mem-scopes button svg{width:16px;height:16px;color:var(--text-2);flex:none}
.mem-list{overflow-y:auto;box-shadow:inset -1px 0 0 var(--line-subtle)}
.mem-list .srch{padding:12px}
.mem-list ul{list-style:none;padding:0 8px 12px}
.mem-list li button{display:grid;gap:2px;width:100%;padding:10px 12px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left}
.mem-list li button:hover{background:var(--state-hover)}
.mem-list li button[aria-current="true"]{background:var(--state-selected)}
.mem-list li b{font-size:13px;line-height:18px;font-weight:600}
.mem-list li span{font-size:12px;line-height:16px;color:var(--text-3)}
.mem-note{overflow-y:auto;padding:20px 28px 28px;min-width:0}
.mem-note h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em;margin-top:8px}
.mem-note .srcline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--text-3)}
.mem-note .md{margin-top:16px;max-width:62ch;color:var(--text-1)}
.mem-note .md p+p,.mem-note .md ul{margin-top:10px}
.mem-note .md ul{padding-left:20px}
.fm{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-sunken);font:12px/18px var(--font-mono);color:var(--text-2);white-space:pre}
.backlinks{margin-top:24px;padding-top:16px;box-shadow:inset 0 1px 0 var(--line)}
.backlinks h3{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.backlinks ul{list-style:none;display:grid;gap:4px}
.backlinks li{display:flex;gap:8px;align-items:center;font-size:13px}
.backlinks li .t-meta{color:var(--text-3)}
.use-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);padding:20px;--cut:var(--bg-surface)}
.card>h2{font-size:15px;font-weight:600;margin-bottom:12px}
.card+.card{margin-top:16px}
.card>h2+.setrow,.card>p+.setrow{box-shadow:none}
.use-big{display:flex;align-items:center;gap:20px}
.use-big .fig{font:600 28px/34px var(--font-display);letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.use-big p{color:var(--text-2)}
.use-bar{margin-top:20px}
.use-bar .bar{height:8px}
.use-bar .ends{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.brk{list-style:none;display:grid;gap:10px}
.brk li{display:grid;grid-template-columns:24px 56px minmax(0,1fr) 128px;gap:10px;align-items:center;font-size:13px}
.brk li .bar{height:6px}
.brk li .v{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;font-size:12px}
.resume{list-style:none;display:grid;gap:8px;counter-reset:r}
.resume li{display:flex;align-items:center;gap:10px;font-size:13px}
.resume li::before{counter-increment:r;content:counter(r);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg-sunken);font-size:12px;font-weight:600;flex:none}
.trc{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);margin:0 24px 16px;background:var(--bg-surface);border-radius:var(--r-lg);corner-shape:var(--corner);box-shadow:var(--elev-1);overflow:hidden;--cut:var(--bg-surface)}
.trc-runs{overflow-y:auto;padding:12px 8px;box-shadow:inset -1px 0 0 var(--line-subtle)}
.trc-runs button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;width:100%;padding:10px;border-radius:var(--r-sm);corner-shape:var(--corner);text-align:left}
.trc-runs button:hover{background:var(--state-hover)}
.trc-runs button[aria-current="true"]{background:var(--state-selected)}
.trc-runs b{font-size:13px;font-weight:600;line-height:18px}
.trc-runs span.t-meta{grid-column:2;color:var(--text-3)}
.trc-steps{overflow-y:auto;padding:16px 24px 24px;min-width:0}
.trc-steps h2{font:600 20px/26px var(--font-display);letter-spacing:-.014em}
.steps{list-style:none;margin-top:16px;display:grid;gap:2px}
.step{display:grid;grid-template-columns:56px 20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r-sm);corner-shape:var(--corner);font-size:13px;line-height:18px}
.step:hover{background:var(--state-hover)}
.step .tm{color:var(--text-3);font-variant-numeric:tabular-nums}
.step>svg{width:16px;height:16px;margin-top:1px;color:var(--text-2)}
.step .tok{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.step .d{color:var(--text-3);font-size:12px;line-height:16px;margin-top:2px}
.step.mem>svg{color:var(--agent-ink)}
.step.gate{background:var(--attn-tint)}
.step.gate>svg{color:var(--attn-ink)}

/* ---------- first run ---------- */
.firstrun{height:calc(100vh - 48px);overflow-y:auto;background:var(--bg-ground)}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:64px;max-width:1120px;margin:0 auto;padding:32px 48px 48px;min-height:100%;align-items:center}
.fr-stage{display:grid;justify-items:center;gap:12px;align-self:center;text-align:center}
.fr-stage .birth{position:relative;width:144px;height:153px}
.fr-stage .birth>*{position:absolute;inset:0}
.fr-stage .birth .hero-av{width:144px;height:153px}
.fr-stage .nametag{margin-top:0}
.fr-stage .nametag.drop{animation:tagDrop var(--dur-move) var(--spring-snappy) both}
.fr-stage .say{max-width:36ch;color:var(--text-2)}
.fr-main .brandrow{display:flex;align-items:center;gap:12px}
.fr-main h1{margin-top:28px;font:600 var(--fs-display)/var(--lh-display) var(--font-display);letter-spacing:-.032em}
.fr-main .lede{margin-top:8px;color:var(--text-2);max-width:46ch}
.steps-fr{list-style:none;margin-top:28px;display:grid;gap:8px}
.sfr{background:transparent;border-radius:var(--r-lg);corner-shape:var(--corner);transition:background-color var(--dur-move) ease,box-shadow var(--dur-move) ease}
.sfr-h{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px}
.sfr-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-control);font-size:12px;font-weight:600;color:var(--text-3);flex:none}
.sfr-h b{font-weight:600}
.sfr-h .res{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sfr.done .sfr-n{background:var(--ok-tint);box-shadow:none;color:var(--ok-ink)}
.sfr.done .sfr-n svg{width:14px;height:14px}
.sfr.todo{opacity:.6}
.sfr.cur{background:var(--bg-surface);box-shadow:var(--elev-2)}
.sfr.cur .sfr-n{background:var(--text-1);color:var(--text-on-ink);box-shadow:none}
.sfr-b{padding:0 20px 20px 52px}
.sfr-b p{color:var(--text-2);max-width:52ch}
.sfr-b .acts{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.sfr-b .why{font-size:12px;color:var(--text-3)}
.found{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;color:var(--text-1)}
.found svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ok-ink)}
.fr-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--text-2)}
.fr-note svg{width:16px;height:16px;flex:none;margin:1px 1px 0;color:var(--text-3)}
.found b{font-weight:600;display:block}
.found span{color:var(--text-2);display:block}
.creating{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--text-2)}

/* ---------- system sheet ---------- */
.sheet{height:calc(100vh - 48px);overflow-y:auto;background:var(--bg-surface)}
.sheet-wrap{max-width:1120px;margin:0 auto;padding:48px 48px 96px}
.sheet .lede{max-width:62ch;margin-top:8px;color:var(--text-2)}
.sheet section{padding:40px 0;box-shadow:inset 0 1px 0 var(--line)}
.sheet section:first-of-type{box-shadow:none;padding-top:24px}
.sheet h2{font:600 28px/34px var(--font-display);letter-spacing:-.022em}
.sheet h3{font-size:15px;font-weight:600;margin:24px 0 12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.swatch{border-radius:var(--r-md);corner-shape:var(--corner);overflow:hidden;background:var(--bg-surface);box-shadow:var(--elev-1)}
.swatch i{display:block;height:56px;box-shadow:inset 0 -1px 0 var(--line-subtle)}
.swatch div{display:grid;gap:1px;padding:8px 10px 10px;font-size:12px;line-height:16px;color:var(--text-3)}
.swatch b{font-size:13px;color:var(--text-1);font-weight:600}
.aa{font-size:12px;font-weight:600;color:var(--ok-ink)}
.aa.fail{color:var(--danger-ink)}
table.spec{width:100%;border-collapse:collapse;font-size:13px}
table.spec th{text-align:left;font-size:12px;font-weight:600;color:var(--text-3);padding:8px 12px 8px 0;box-shadow:inset 0 -1px 0 var(--line)}
table.spec td{padding:10px 12px 10px 0;box-shadow:inset 0 -1px 0 var(--line-subtle);vertical-align:middle}
.gallery{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.gallery figure{display:grid;justify-items:center;gap:8px;text-align:center}
.gallery figcaption{font-size:12px;line-height:16px;color:var(--text-3)}
.gallery figcaption b{display:block;color:var(--text-1);font-size:13px;font-weight:600}
.shape-demo{display:flex;flex-wrap:wrap;gap:16px}
.shape-demo div{display:grid;place-items:center;width:220px;height:84px;padding:8px 12px;background:var(--bg-ground);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--text-2);text-align:center;corner-shape:var(--corner)}

/* ---------- moments: arrivals, birth, picker, first receipt ---------- */
.arrive{animation:rise var(--dur-short) var(--ease-out) both}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg button{height:32px;padding:0 12px;border-radius:999px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb) / .16);font-size:13px;font-weight:600;color:var(--text-1);transition:box-shadow var(--dur-micro) ease}
.sugg button:hover{box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb) / .3)}
.birth-wrap{text-align:center;padding:20px 0 4px}
.birth{position:relative;width:96px;height:102px;margin:0 auto}
.birth>.hero-av{position:absolute;inset:0;width:100%;height:100%;margin:0}
.knows{display:flex;align-items:center;gap:6px;margin:10px 0 0 42px;font-size:13px;line-height:18px;color:var(--text-2)}
.knows svg{color:var(--agent-ink);flex:none}
/* C4: the draft's name pill is a button; click it and it becomes the field, in the same pill */
.nm-btn{display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 48px);cursor:text;transition:box-shadow var(--dur-micro) ease}
.nm-btn svg{flex:none;width:14px;height:14px;color:var(--text-3)}
.nm-btn:hover{box-shadow:0 0 0 1px rgb(var(--ink-rgb) / .2),var(--elev-1)}
.nm-btn:hover svg{color:var(--text-1)}
.nm-inp{width:200px;max-width:calc(100% - 48px);border:0;text-align:center;font:600 15px/26px var(--font-text);box-shadow:inset 0 0 0 2px var(--focus);color:var(--text-1)}
.nm-inp:focus{outline:none}
.nm-inp[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--danger-ink)}
.nm-err{max-width:40ch;margin:6px auto 0;font-size:12px;line-height:16px;color:var(--danger-ink)}
.picker{display:grid;justify-items:center;gap:10px;padding:2px 24px 12px;text-align:center}
.picker .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip-shape{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-sm);corner-shape:var(--corner);background:var(--bg-sunken);transition:box-shadow var(--dur-micro) ease,background-color var(--dur-micro) ease}
.chip-shape span{display:block;width:22px;height:22px}
.chip-shape svg{display:block;width:100%;height:100%}
.chip-shape:hover{background:var(--porcelain-150)}
.chip-shape[aria-checked="true"]{background:var(--bg-surface);box-shadow:0 0 0 2px var(--text-1)}
.chip-hue{width:24px;height:24px;border-radius:50%;transition:box-shadow var(--dur-micro) ease,opacity var(--dur-micro) ease}
.chip-hue.used{opacity:.35}
.chip-hue:hover{opacity:1}
.chip-hue[aria-checked="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg-surface),0 0 0 4px var(--text-1)}
.np-team{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:12px 8px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-ground)}
.npm{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0;--cut:var(--bg-ground)}
.npm figcaption{min-width:0;max-width:100%}
.npm figcaption b{display:block;font-size:12px;line-height:16px;font-weight:600}
.npm figcaption span{display:block;font-size:12px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hintbubble{display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin-top:8px;padding:6px 6px 6px 12px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-inverse);color:var(--text-inverse);font-size:13px;line-height:18px;box-shadow:var(--elev-3)}
.hintbubble svg{flex:none;color:var(--cobalt-300)}
.digest .wake{--cut:var(--bg-surface)}

/* ---------- v0.5 · round 4 (F1–F6, CR-007) ---------- */
/* F1/F2: an agent's face and name are the door to its profile and settings. The chevron says "this opens"; hovering the
   face lights the name pill, so the two read as one control. The face is a pointer target only; the name is the tab stop. */
.id-face{display:block;width:fit-content;margin:0 auto;padding:0;border-radius:var(--r-obj);corner-shape:var(--corner)}
/* Bug (round 4): on Home the hero is a centred grid, so the h1 shrinks to fit its pill; the pill's old
   max-width:calc(100% - 48px) then resolved against that shrunk width and squeezed the name to nothing (a circle
   and a chevron). The h1 now carries the limit against the column, the pill fills at most the h1, and the name
   keeps its own width unless the column truly runs out (then it ellipsizes). */
.id-h{margin:0;font:inherit;max-width:calc(100% - 48px);min-width:0}
.hero-wrap .id-h{margin:0 auto}
.nametag.id-tag{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:0 8px 0 12px;cursor:pointer;transition:box-shadow var(--dur-micro) ease,background-color var(--dur-micro) ease}
.id-tag svg{width:14px;height:14px;flex:none;color:var(--text-3);transition:color var(--dur-micro) ease}
.id-tag:hover,.id-face:hover+.id-h .id-tag{background:color-mix(in srgb,var(--bg-surface),rgb(var(--ink-rgb)) 5%);box-shadow:0 0 0 1px rgb(var(--ink-rgb) / .2),var(--elev-1)}
.id-tag:hover svg,.id-face:hover+.id-h .id-tag svg{color:var(--text-1)}
.id-tag:focus-visible{outline-offset:3px}
.id-nm{flex:0 1 auto;min-width:1.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-sub{font-size:12px;line-height:16px;color:var(--text-3)}
/* F3: the optional title, next to the name, in the expanded sidebar only (it truncates first) */
.nmt{display:flex;align-items:baseline;gap:6px;min-width:0}
.nmt .ag-nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-ttl,.srow .n .ag-ttl{flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;font-weight:400;color:var(--text-3)}
/* F1: what makes the main agent special, quietly, at the top of its profile */
.ma-well{display:grid;gap:8px;margin:0 0 20px;padding:12px 14px;border-radius:var(--r-in);corner-shape:var(--corner);background:var(--bg-ground)}
.ma-well>b{font-size:13px;line-height:18px;font-weight:600}
.ma-list{list-style:none;display:grid;gap:6px}
.ma-list li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;line-height:18px;color:var(--text-2)}
.ma-list svg{width:16px;height:16px;margin-top:1px;color:var(--text-3)}
.pf-pick{display:grid;gap:10px;margin:-8px 0 20px}
.pf-pick .chips{display:flex;flex-wrap:wrap;gap:6px}
/* F3: a filled title can be removed in one click */
.clr-wrap{position:relative}
.clr-wrap .inp{padding-right:44px}
.clr-btn{position:absolute;right:4px;top:4px}
.ttl-f{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px 12px}
.ttl-f label{font-size:13px;font-weight:600;white-space:nowrap}
.ttl-f .inp.sm{width:200px}
/* CR-007: Ready to test says what to try and how, in order */
.try{margin-top:16px;padding:12px 14px;border-radius:var(--r-in);corner-shape:var(--corner);background:var(--bg-ground)}
.try>b{display:block;margin-bottom:8px;font-size:12px;line-height:16px;font-weight:600;color:var(--text-3)}
.try .resume li{align-items:flex-start;line-height:20px}
/* F1/F6: onboarding step 3 picks the main agent's look; the face on the left is the live preview */
.fr-look .chips{display:flex;flex-wrap:wrap;gap:6px}
.fr-look .chips+.chips{margin-top:4px}

/* ---------- v0.6 · Laws of UX fixes ---------- */
/* Tesler + glass box (fix 12, D-A): the context meter lives in the agent's panel; in the chat only from 60 % */
.ws-ctx{display:flex;align-items:center;gap:8px;margin:12px 20px 0;font-size:12px;line-height:16px;color:var(--text-3)}
.ws-ctx .bar{flex:1;height:4px}
.ws-ctx .bar>.mark{top:-3px;bottom:-3px}
.ws-ctx b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
/* Mental model (fix 9): the five kinds that always need you, one click from the Autonomous preset */
.pop.kinds{width:340px}
.pop.kinds .ma-list{padding:2px 8px 6px}
/* Occam (fix 17): a title is optional, so it waits behind one quiet link until you want it */
.ttl-add{display:flex;justify-content:center;padding:0 24px 8px}
/* Theme preview in Settings › Appearance */
.theme-note{margin-top:2px;font-size:12px;line-height:16px;color:var(--text-3)}

/* ---------- v0.6.1 · @-mention picker and the blurred scroll edge (client, 23 Oct) ---------- */
:root{--edge-h:40px;--edge-blur:6px}
.composer{position:relative}
/* The draft field. A mirror behind the textarea paints each resolved @mention as a tinted pill under its letters,
   so the token reads as a chip while you type and stays plain, editable text (undo, paste, IME all still work). */
.mn-field{position:relative;flex:1;min-width:0;display:flex}
.mn-field>textarea{position:relative;z-index:1;scrollbar-gutter:stable}
.mn-mirror{position:absolute;inset:0;z-index:0;overflow:hidden;scrollbar-gutter:stable;padding:7px 4px;font-size:15px;line-height:22px;white-space:pre-wrap;overflow-wrap:break-word;color:transparent;pointer-events:none}
.mn-hl{border-radius:6px;background:var(--agent-tint);box-shadow:0 0 0 2px var(--agent-tint);color:transparent}
/* The picker rises out of the composer, aligned with the text. Only who's reachable from this chat is listed. */
.mn-pop{position:absolute;z-index:40;left:40px;bottom:calc(100% + 8px);width:min(320px,calc(100% - 48px));padding:6px;background:var(--bg-raised);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-3);transform-origin:24px 100%}

.mn-grp{padding:8px 8px 2px;font-size:12px;line-height:16px;font-weight:600;color:var(--text-3)}
.mn-grp:first-child{padding-top:0}
.mn-opt{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;padding:6px 10px 6px 8px;border-radius:var(--r-in);corner-shape:var(--corner);cursor:pointer;transition:background-color var(--dur-micro) ease}
.mn-opt:hover{background:var(--state-hover)}

.mn-none{padding:8px 8px 10px;font-size:13px;line-height:18px;color:var(--text-2)}
.mn-keys{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;padding:8px 8px 2px;box-shadow:inset 0 1px 0 var(--line-subtle);font-size:12px;line-height:16px;color:var(--text-3)}
.mn-keys .kbd{height:18px;padding:0 5px;margin-right:2px}

/* Blurred scroll edge. Older messages don't stop at a hard line under a header or the sticky hero: they soften into a
   short progressive blur and fade into the canvas. One 40 px strip per scroller (never a full-area blur), shown only
   while something is actually under the edge. The mask makes the blur strongest at the edge and zero at its foot. */
.chatroom{--edge-bg:var(--agent-wash)}
.tc-conv{--edge-bg:var(--bg-ground)}
.chat-scroll::before,.hero-wrap::after{content:"";pointer-events:none;height:var(--edge-h);opacity:0;transition:opacity var(--dur-short) ease;
  background:linear-gradient(var(--edge-bg),color-mix(in srgb,var(--edge-bg) 45%,transparent) 40%,transparent 80%);
  -webkit-backdrop-filter:blur(var(--edge-blur));backdrop-filter:blur(var(--edge-blur));
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.chat-scroll::before{position:sticky;top:0;z-index:4;display:block;flex:none;margin-bottom:calc(var(--edge-h) * -1)}
.hero-wrap::after{position:absolute;left:0;right:0;top:100%}
.chat-scroll:has(>.hero-wrap)::before{display:none}
.chat-scroll.is-scrolled::before,.chat-scroll.is-scrolled>.hero-wrap::after{opacity:1}
/* Reduced transparency: the same edge as a plain fade, no blur */
@media (prefers-reduced-transparency:reduce){
  .chat-scroll::before,.hero-wrap::after{-webkit-backdrop-filter:none;backdrop-filter:none;-webkit-mask-image:none;mask-image:none;background:linear-gradient(var(--edge-bg) 20%,transparent)}
}

/* ---------- v0.7 · reply to a message (client, 23 Oct) ----------
   Nothing shows at rest. Hover or focus a message and one small Reply button appears on its bubble's top corner
   (or press R on a focused message, or right-click it). Select part of a message and Reply and Copy float by the
   selection. Either way a one-line preview joins the composer: face, name, excerpt, × (Esc cancels). Once sent, the
   quote sits at the top of your bubble and takes you back to the original, which glows once where it lives. */
:root{--rp-hit:rgb(46 91 255 / .2)}
:root[data-theme="dark"]{--rp-hit:rgb(143 168 255 / .3)}
.rp-vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rp-msg{scroll-margin:96px 0}
.rp-msg:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:var(--r-in)}
.rp-anchor{position:relative}
/* The hover action: a 28 px circle (32 px hit area) on the bubble's outer top corner, off the text */
.rp-act{position:absolute;z-index:2;top:-14px;right:-10px;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--bg-raised);color:var(--text-2);box-shadow:0 0 0 1px var(--line),0 2px 8px hsl(var(--shadow-color) / .14);opacity:0;transform:translateY(3px) scale(.92);pointer-events:none;transition:opacity var(--dur-micro) ease,transform var(--dur-short) var(--spring-snappy),color var(--dur-micro) ease,box-shadow var(--dur-micro) ease}
.rp-act::after{content:"";position:absolute;inset:-2px}
.rp-act svg{width:16px;height:16px}
.mine .rp-act{right:auto;left:-10px}
.rp-msg:hover .rp-act,.rp-msg:focus-within .rp-act{opacity:1;transform:none;pointer-events:auto}
.rp-act:hover{color:var(--text-1);box-shadow:0 0 0 1px rgb(var(--ink-rgb) / .24),0 2px 8px hsl(var(--shadow-color) / .14)}
.rp-msg .rp-act:active{transform:scale(var(--press-scale))}
.rp-act:focus-visible{outline-offset:1px}
/* The preview joins the composer as its first row, so the focus ring wraps both and nothing floats over the chat */
.composer.rp-on{flex-wrap:wrap;row-gap:4px}
.composer>.rp-bar:first-child+.btn.icon{margin-bottom:4px}
.rp-bar{flex:1 0 100%;display:flex;align-items:center;gap:8px;min-width:0;height:32px;padding:0 2px 0 10px;border-radius:var(--r-in);corner-shape:var(--corner);background:rgb(var(--ink-rgb) / .05);box-shadow:inset 2px 0 0 var(--agent-base);font-size:13px;line-height:18px}
.rp-bar.anim{animation:rpIn var(--dur-short) var(--spring-smooth) both}
.rp-bar>.av,.rp-bar>.me-av{flex:none}
.rp-me{width:20px;height:20px;font-size:10px}
.rp-bar-tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.rp-bar-tx b{margin-right:6px;color:var(--agent-ink);font-weight:600}
.rp-bar .rp-x{flex:none}
/* The sent quote: inside your bubble, above your words. A button: it takes you to the original */
.rp-quote{display:grid;gap:1px;width:100%;margin:-2px 0 8px;padding:6px 10px 7px 12px;border-radius:var(--r-in);corner-shape:var(--corner);background:rgb(var(--ink-rgb) / .06);box-shadow:inset 2px 0 0 var(--agent-base);text-align:left;font-size:13px;line-height:18px;color:var(--text-2);transition:background-color var(--dur-micro) ease}
.rp-quote:hover{background:rgb(var(--ink-rgb) / .1)}
.rp-quote b{font-size:12px;line-height:16px;font-weight:600;color:var(--agent-ink)}
.rp-q-x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
/* Back at the original: one glow on the bubble (the whole message), or a band under the exact words (a part) */
.rp-flash .bubble{animation:rpFlash 1600ms var(--ease-out) both}
.rp-hold .bubble{box-shadow:0 0 0 2px var(--agent-base)}
::highlight(rp-hit){background-color:var(--rp-hit);color:var(--text-1)}
/* Selection: Reply and Copy float just above what you selected (below it near the top edge) */
.rp-sel{position:fixed;z-index:590;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-raised);box-shadow:var(--elev-3);transform-origin:50% 100%}
.rp-sel.below{transform-origin:50% 0}
.rp-sel.anim{animation:rpSelIn var(--dur-short) var(--spring-snappy) both}
.rp-sel button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-1);transition:background-color var(--dur-micro) ease}
.rp-sel button:hover{background:var(--state-hover)}
.rp-sel button:active{background:var(--state-press)}
.rp-sel button svg{width:16px;height:16px;color:var(--text-2)}
.rp-sel button:focus-visible{outline-offset:-2px}

/* F2: a gear with teeth (the old one read as a sun). Six broad teeth, so it stays legible at 16 px. */
IC.gear = (() => {
  const pt = (r, deg) => { const t = (deg - 90) * Math.PI / 180; return (12 + r * Math.cos(t)).toFixed(2) + "," + (12 + r * Math.sin(t)).toFixed(2); };
  const p = [];
  for (let i = 0; i < 6; i++) { const a = i * 60; p.push(pt(7.3, a - 19), pt(9.8, a - 10), pt(9.8, a + 10), pt(7.3, a + 19)); }
  return `<polygon points="${p.join(" ")}"/><circle cx="12" cy="12" r="2.8"/>`;
})();

/* ---------- sound (P-7, decided 23 Oct): the explorations' three sounds, synthesised live, no files ----------
   On by default (the Sound switch in the demo bar). Nothing plays before your first click or key press, and the
   AudioContext is only created then (browser autoplay rules). In the app, needs you and done play only when Eucas
   isn't the window you're in; here they play in view so you can hear them. Sound is separate from reduced motion. */
const SND = {on:true, armed:false, ac:null, master:null, nb:null, last:{}};

    const comp = ac.createDynamicsCompressor();

/* One family: D major pentatonic, sine bodies, a soft low-pass, 8 ms attacks. */
const SFX = {
  needs:{n:"Needs you", spec:"A4 → D5, a rising fourth · 320 ms", when:"An approval or question lands in What needs you",
    play(t){ sndTone(t, 440, .17, {gain:.17, lp:2600}); sndTone(t, 880, .09, {gain:.025}); sndTone(t + .11, 587.33, .21, {gain:.18, lp:2600}); sndTone(t + .11, 1174.66, .1, {gain:.03}); }},
  done:{n:"Done", spec:"F♯5 with soft partials · 380 ms", when:"A run finishes all green, or a ticket you decided resolves",
    play(t){ sndTone(t, 739.99 * 1.012, .38, {gain:.19, glide:1 / 1.012, lp:3200}); sndTone(t, 1479.98, .16, {gain:.04}); sndTone(t, 2219.97, .08, {gain:.014}); }},
  handoff:{n:"Handoff", spec:"A breath, left → right, E5 → A5 · 290 ms", when:"The brief travels from one agent to another in the project you're viewing",
    play(t){
      const ac = SND.ac, src = ac.createBufferSource(); src.buffer = sndNoise();
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.3;
      bp.frequency.setValueAtTime(650, t); bp.frequency.exponentialRampToValueAtTime(2600, t + .24);

/* Play a sound if sound is on and you've interacted; one sound per kind per 600 ms. Audio never breaks the demo. */
function sfx(key, delayMs = 0){
  if (!SND.on || !SND.armed || !SFX[key]) return;
  const now = performance.now();
  if (now - (SND.last[key] || 0) < 600) return;
  SND.last[key] = now;
  try { const ac = sndCtx(); if (ac) SFX[key].play(ac.currentTime + .02 + delayMs / 1000); } catch (e) { /* no audio: carry on silently */ }

/* drop zones: left | right before the first split; afterwards, above or below a pane that is still alone in its column */
function spZones(){
  const m = mainEl.getBoundingClientRect();
  if (!spCount()) return [{z:"0", ins:"col", side:1, label:"Open on the right", x:m.width / 2 + 6, y:60, w:m.width / 2 - 18, h:m.height - 72},
                           {z:"1", ins:"col", side:0, label:"Open on the left", x:12, y:60, w:m.width / 2 - 18, h:m.height - 72}];
  const out = [];
  SP.cols.forEach((col, ci) => {
    if (col.length !== 1) return;
    const el = $(`#mSplit .pn[data-h="${CSS.escape(col[0].hash)}"]`); if (!el) return;
    const r = el.getBoundingClientRect(), x = r.left - m.left, y = r.top - m.top;
    out.push({z:`${ci}t`, ins:"row", col:ci, at:0, label:`Open above ${col[0].label}`, x, y, w:r.width, h:r.height / 2 - 4});
    out.push({z:`${ci}b`, ins:"row", col:ci, at:1, label:`Open below ${col[0].label}`, x, y:y + r.height / 2 + 4, w:r.width, h:r.height / 2 - 4});
  });
  return out;
}
let SPDRAG = null, SPZ = [];
function showZones(){
  SPZ = spZones();
  dropEl.innerHTML = SPZ.length ? SPZ.map(z => `<div class="z" data-z="${z.z}" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px"><span>${esc(z.label)}</span></div>`).join("")
    : `<div class="sp-full">4 panes is the most. Close one first.</div>`;
}
$("#sideList").addEventListener("dragstart", e => {
  const r = e.target.closest("[data-row]"); if (!r || !rowTarget(r.dataset.row)) return;
  SPDRAG = r.dataset.row; e.dataTransfer.setData("text/plain", SPDRAG); e.dataTransfer.effectAllowed = "copy";
  showZones(); mainEl.classList.add("sp-dragging");
});
addEventListener("dragend", () => { SPDRAG = null; mainEl.classList.remove("sp-dragging"); });
dropEl.addEventListener("dragover", e => {
  if (!SPDRAG) return; e.preventDefault();
  const z = e.target.closest(".z"); $$(".sp-drop .z").forEach(x => x.classList.toggle("on", x === z));
});
dropEl.addEventListener("drop", e => {
  e.preventDefault(); const z = e.target.closest(".z"), k = SPDRAG;
  mainEl.classList.remove("sp-dragging"); SPDRAG = null;
  if (z && k) addPane(k, SPZ.find(x => x.z === z.dataset.z));
});
/* zone: {ins:"col", side} for the first split, {ins:"row", col, at} for a third or fourth pane; none = the next free spot */
function addPane(k, zone){
  const t = rowTarget(k); if (!t || EMBED) return;
  if (spCount() >= SP.MAX) return toast("<b>4 panes is the most.</b> Close one first.");
  if (spAll().some(p => p.hash === t.hash) || (!spCount() && curTarget().hash === t.hash)) return toast(`<b>${esc(t.label)} is already open.</b>`);
  if (!zone) zone = !spCount() ? {ins:"col", side:1} : SP.cols[1].length < 2 ? {ins:"row", col:1, at:1} : {ins:"row", col:0, at:1};
  if (!spCount()) { const cur = curTarget(); SP.cols = zone.side === 0 ? [[t], [cur]] : [[cur], [t]]; }
  else SP.cols[zone.col].splice(zone.at, 0, t);
  renderSplitPanes(t.hash);
  announce(`${t.label} opened in a split. ${spCount()} panes.`);
}
function paneSrc(h){ const th = document.documentElement.dataset.theme || "dark"; return location.pathname + "?embed=1&theme=" + encodeURIComponent(th) + "#" + h; }
function renderSplitPanes(fresh){
  const box = $("#mSplit");
  if (spCount() < 2) { const last = spAll()[0]; SP.cols = [[], []]; box.hidden = true; box.innerHTML = ""; if (last) go(last.hash); return; }
  const live = new Set(spAll().map(p => p.hash));
  $$("#mSplit .pn").forEach(el => { if (!live.has(el.dataset.h)) el.remove(); });
  SP.cols.forEach((col, ci) => col.forEach((p, ri) => {
    let el = $(`#mSplit .pn[data-h="${CSS.escape(p.hash)}"]`);
    if (!el) {
      el = document.createElement("section"); el.className = "pn" + (p.hash === fresh && animate() ? " enter" : ""); el.dataset.h = p.hash;
      const st = p.ag && AG[p.ag] ? effStatus(p.ag) : null;
      const who = st ? `${avatar(p.ag, 24, {status:st, hidden:true})}<span class="pn-t"><b>${esc(p.label)}</b><span class="pn-s">${esc(ST[st].l)}${AG[p.ag].title ? " · " + esc(AG[p.ag].title) : ""}</span></span>` : `<span class="pn-t"><b>${esc(p.label)}</b></span>`;
      el.innerHTML = `<div class="pn-h">${who}<button type="button" class="btn icon" data-pane-close="${esc(p.hash)}" aria-label="Close ${esc(p.label)}" title="Close">${ic("x", 16)}</button></div><iframe title="${esc(p.label)}" src="${paneSrc(p.hash)}"></iframe>`;
      box.appendChild(el);
    }
    el.style.gridColumn = String(ci + 1);
    el.style.gridRow = col.length === 1 ? "1 / span 2" : String(ri + 1);
  }));
  box.hidden = false;
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-pane-close]"); if (!c) return;
  SP.cols = SP.cols.map(col => col.filter(p => p.hash !== c.dataset.paneClose));
  /* an empty side takes the bottom pane of the other side, so the split stays left | right */
  const empty = SP.cols.findIndex(col => !col.length), other = 1 - empty;
  if (empty >= 0 && SP.cols[other].length === 2) SP.cols[empty] = [SP.cols[other].pop()];
  renderSplitPanes();
});
$("#sideList").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.shiftKey) return;
  const r = e.target.closest("[data-row]"); if (!r || !rowTarget(r.dataset.row)) return;
  e.preventDefault(); e.stopPropagation(); addPane(r.dataset.row);
}, true);
/* a normal navigation leaves the split */
addEventListener("hashchange", () => { if (spCount() && !$("#mSplit").hidden) { SP.cols = [[], []]; $("#mSplit").hidden = true; $("#mSplit").innerHTML = ""; } });

/* ---------- UF5-4: Memory · List or Graph ---------- */
MEM.view = MEM.view || "list";
const GRAPH = {
  hubs:[["you","You",500,280,"var(--action)"],["atlas","Atlas",290,150,null],["noor","Noor",760,170,null],["karim","Karim",810,430,null],["dev","Dev team",690,495,"var(--text-3)"],["product","Product team",290,440,"var(--text-3)"],["company","Company",150,290,"var(--text-3)"]],
  notes:{prstyle:[470,150,["you","noor","karim"]],datelib:[640,300,["noor","dev"]],signoff:[360,235,["you","atlas"]],routing:[400,515,["karim","product"]],windows:[420,345,["you"]],components:[530,420,["dev","noor","karim"]]}
};
function hubColor(h){ return h[4] || `var(--hue-${AG[h[0]] ? AG[h[0]].hue : "lavender"}-base)`; }
function memGraphHTML(){
  const hub = Object.fromEntries(GRAPH.hubs.map(h => [h[0], h]));
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const dust = GRAPH.hubs.flatMap(h => Array.from({length:h[0] === "you" ? 26 : 16}, () => { const a = rnd() * 6.283, d = 34 + rnd() * 70; return `<circle class="dust" cx="${(h[2] + Math.cos(a) * d).toFixed(1)}" cy="${(h[3] + Math.sin(a) * d * .8).toFixed(1)}" r="${(1.6 + rnd() * 1.6).toFixed(1)}"/>`; })).join("");
  const edges = Object.entries(GRAPH.notes).flatMap(([id, n]) => n[2].map(t => `<line class="edge" data-e="${id} ${t}" x1="${n[0]}" y1="${n[1]}" x2="${hub[t][2]}" y2="${hub[t][3]}"/>`)).join("");
  const notes = MEMNOTES.filter(n => GRAPH.notes[n.id]).map(n => { const g = GRAPH.notes[n.id]; return `<g class="nd" tabindex="0" role="button" data-gnote="${n.id}" aria-label="${esc(n.t)}, ${esc(n.type)}"><circle cx="${g[0]}" cy="${g[1]}" r="8" fill="var(--bg-raised)" stroke="var(--text-2)" stroke-width="1.5"/><text x="${g[0] + 12}" y="${g[1] + 4}">${esc(n.t.length > 34 ? n.t.slice(0, 33) + "…" : n.t)}</text></g>`; }).join("");
  const hubs = GRAPH.hubs.map(h => `<g class="nd hub" data-ghub="${h[0]}"><circle cx="${h[2]}" cy="${h[3]}" r="${h[0] === "you" ? 16 : 12}" fill="${hubColor(h)}"/><text x="${h[2]}" y="${h[3] + (h[0] === "you" ? 32 : 28)}" text-anchor="middle">${esc(h[1])}</text></g>`).join("");
  return `<div class="mgraph" id="mGraph"><svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Memory graph: 214 things your team knows, linked to who learned them">${dust}${edges}${hubs}${notes}</svg>
    <div class="key"><span><i style="background:var(--action)"></i>You</span><span><i style="background:var(--hue-coral-base)"></i>Agents</span><span><i style="background:var(--text-3)"></i>Teams and company</span><span>Labelled: the 6 notes used most · dots: the other 208</span></div><div class="tip" id="gTip" hidden></div></div>`;
}
const renderMemoryList = renderMemory;
renderMemory = function(){
  renderMemoryList();
  const top = $("#p-memory .mem-top .acts");
  if (top && !top.querySelector(".mem-view")) top.insertAdjacentHTML("afterbegin", `<div class="mem-view" role="group" aria-label="View"><button type="button" data-mview="list" aria-pressed="${MEM.view === "list"}">List</button><button type="button" data-mview="graph" aria-pressed="${MEM.view === "graph"}">Graph</button></div>`);
  if (MEM.view === "graph") { const m = $("#p-memory .mem"); if (m) { m.outerHTML = memGraphHTML(); $("#mGraph").style.height = "calc(100vh - 200px)"; } }
};
document.addEventListener("click", e => {
  const v = e.target.closest("[data-mview]"); if (v) { MEM.view = v.dataset.mview; renderMemory(); return; }
  const g = e.target.closest("[data-gnote]"); if (g) { MEM.note = g.dataset.gnote; MEM.view = "list"; renderMemory(); const b = $(`[data-mnote="${MEM.note}"]`); if (b) b.focus(); }
});
document.addEventListener("keydown", e => { const g = e.target.closest && e.target.closest("[data-gnote]"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles:true})); } });
function gHot(id, on, x, y){
  $$("#mGraph .edge").forEach(l => l.classList.toggle("hot", on && l.dataset.e.split(" ").includes(id)));
  const tip = $("#gTip"); if (!tip) return;
  const n = MEMNOTES.find(m => m.id === id);
  if (!on || !n) { tip.hidden = true; return; }
  tip.innerHTML = `${esc(n.t)}<span>${esc(n.type)} · ${esc(n.used)}</span>`; tip.hidden = false;
  const box = $("#mGraph").getBoundingClientRect(); tip.style.left = Math.min(x - box.left + 14, box.width - 270) + "px"; tip.style.top = (y - box.top + 14) + "px";
}
document.addEventListener("mouseover", e => { const g = e.target.closest && e.target.closest("#mGraph [data-gnote], #mGraph [data-ghub]"); if (g) gHot(g.dataset.gnote || g.dataset.ghub, true, e.clientX, e.clientY); });
document.addEventListener("mouseout", e => { const g = e.target.closest && e.target.closest("#mGraph [data-gnote], #mGraph [data-ghub]"); if (g) gHot(g.dataset.gnote || g.dataset.ghub, false); });
document.addEventListener("focusin", e => { const g = e.target.closest && e.target.closest("#mGraph [data-gnote]"); if (g) { const r = g.getBoundingClientRect(); gHot(g.dataset.gnote, true, r.right, r.top); } });

/* ---------- UF5-6: start as a new user: welcome, a live Claude Code check, then the four steps ---------- */
const renderFirstSteps = renderFirst, renderFrStepsBase = renderFrSteps;
renderFirst = function(asleep){
  if (FR.step !== 0) return renderFirstSteps(asleep);
  $("#p-first").innerHTML = `<div class="fr-welcome"><div class="brandrow">${lockupHTML(40)}</div><h1>Every idea deserves a happy ending.</h1>
    <p>Eucas gives you a team of Claude agents that builds your ideas with you.<br>You stay the boss: you decide, test and accept. Setup takes about a minute.</p>
    <div class="acts"><button type="button" class="btn primary lg" data-fr="start">Get started</button></div></div>`;
  $('[data-fr="start"]').focus();
};
renderFrSteps = function(){
  renderFrStepsBase();
  if (FR.checking && FR.step === 1) { const b = $("#frSteps .sfr.cur .sfr-b"); if (b) b.innerHTML = `<div class="fr-check" role="status"><span class="busy-dots" aria-hidden="true"><i></i><i></i><i></i></span>Looking for Claude Code on this PC…</div>`; }
};
$("#p-first").addEventListener("click", e => {
  if (!e.target.closest('[data-fr="start"]')) return;
  FR.step = 1; FR.checking = true; renderFirst(); setHash("fresh-check");
  setTimeout(() => { FR.checking = false; renderFrSteps(); announce("Found Claude Code, signed in."); const c = $('#frSteps [data-fr="next"]'); if (c) c.focus(); }, reduced() ? 200 : 1400);
});
ROUTES.fresh = () => {
  Object.assign(FR, {step:0, team:"ceo", formed:false, name:"Atlas", shape:"sphere", hue:"lavender", checking:false});
  S.firstTeam = false; show("first", "fresh"); renderFirst(); syncDemo("fresh");
};
ROUTES["fresh-check"] = ROUTES.fresh;
$(".demo-tabs").insertAdjacentHTML("afterend", `<button type="button" class="demo-fresh" id="freshBtn" title="Reset the demo to a fresh install and run setup from the start">New user</button>`);
$("#freshBtn").addEventListener("click", () => go("fresh"));
const H0 = (window.H0 || "").slice(1);
if (H0 === "fresh" || H0 === "fresh-check") ROUTES.fresh();
/* v0.8 demo routes: each new state can be opened from the Jump menu */
const V08_LONG = "Here's the plan for the onboarding copy:\n1. Step 1 says what Eucas found\n2. Step 2 shows the folder\n3. Step 3 wakes your main agent\n4. Step 4 picks how the team starts\nKeep each line under 60 characters.";
function v08Fill(big){ const ta = $("#nIn"); if (!ta) return; ta.value = V08_LONG; ta.dispatchEvent(new Event("input", {bubbles:true})); if (big) cmpBig(ta.closest(".composer"), true); }
ROUTES["team-card"] = () => { T.roster = true; ROUTES.team(); setHash("team-card"); setTimeout(() => { const r = $("#roster"); if (r && r.hidden) { const b = $('[aria-label="Members"]'); if (b) b.click(); } requestAnimationFrame(() => requestAnimationFrame(() => { const row = $('#roster [data-card="karim"]'); if (row) openCard("karim", row); })); }, 60); };
ROUTES["composer-grow"] = () => { noorScreen(null, null, "agent"); setHash("composer-grow"); setTimeout(() => v08Fill(false), 60); };
ROUTES["composer-big"] = () => { noorScreen(null, null, "agent"); setHash("composer-big"); setTimeout(() => v08Fill(true), 60); };
ROUTES["split-drag"] = () => { noorScreen(null, null, "agent"); setHash("split-drag"); setTimeout(() => { addPane("karim"); addPane("tc-bench", {ins:"row", col:1, at:1}); }, 60); };
ROUTES["memory-graph"] = () => { MEM.view = "graph"; insightScreen("memory"); setHash("memory-graph"); };
JUMP.push(["Your review, round 5 (v0.8)", [["fresh","Start as a new user · welcome, then setup"],["team-card","Team chat · titles and the agent card"],["composer-grow","Composer · grows as you write"],["composer-big","Composer · expanded"],["split-drag","Split view · dragged from the sidebar (3 panes)"],["memory-graph","Memory · the graph"]]]);
buildJump();
if (["team-card","composer-grow","composer-big","split-drag","memory-graph"].includes(H0)) ROUTES[H0]();
</script>

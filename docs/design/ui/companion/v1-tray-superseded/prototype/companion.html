<style>
/* ---- ../../system/tokens.css ---- */
/*
 * Bench design tokens · v2.1 (2026-10-23: dark first; v2.1 = dark neutrals are true charcoal grey, no blue cast)
 * Source of truth for the design system. Spec: ./DESIGN-SYSTEM.md
 *
 * Dark is the default theme (client, 2026-10-23: "make the app dark first and option to switch to white").
 * Light is the option. The app sets data-theme on <html> to the resolved theme: "dark" (default) or "light";
 * "Match system" is resolved in main (Electron nativeTheme) and written as one of the two.
 *   :root                     → dark (default, also [data-theme="dark"])
 *   :root[data-theme="light"] → light (Porcelain, the v1.1 values, unchanged)
 *
 * Naming: primitives (--porcelain-*, --graphite-*, --cobalt-*, --hue-*-base/light/deep) are the palette and never
 * change. Roles (--bg-*, --text-*, --line-*, --action-*, --ok-*, --attn-*, --danger-*, --hue-*-ink/tint/wash,
 * --agent-*) are theme-aware; components use only roles. A raw hex in a component is a second palette starting: don't.
 * Hairlines, hover and press are a low alpha of --ink-rgb, so one rule draws dark on Porcelain and light on Graphite.
 *
 * Contrast results quoted below are WCAG 2.x ratios computed from these exact values (the prototype's System
 * sheet recomputes them live for whichever theme is on).
 */

:root {
  /* ------------------------------------------------------------------ */
  /* 1. Colour primitives (fixed)                                        */
  /* ------------------------------------------------------------------ */

  /* Porcelain: the light neutral. A faint blue undertone shared with Ink and Cobalt. (P-1) */
  --porcelain-0: #ffffff;
  --porcelain-25: #f9fafb;
  --porcelain-50: #f3f4f7;   /* light ground */
  --porcelain-100: #eceef2;  /* light sunken */
  --porcelain-150: #e4e6ec;
  --porcelain-200: #d8dbe2;
  --porcelain-300: #c4c8d1;  /* decorative only */
  --porcelain-500: #868b97;  /* light control edge: 3.41:1 on white */
  --porcelain-600: #646976;  /* light text-3: 5.49 on white */
  --porcelain-700: #474b57;  /* light text-2: 8.71 on white */
  --porcelain-900: #15171d;  /* Ink: 17.9 on white */

  /* Graphite (now charcoal, v2.1): the dark neutral. Pure grey, R = G = B, no blue or purple cast, never #000
     (client, 2026-10-23: "make it actually dark charcoal color and grey"). The names stay for import stability.
     Depth is a lighter step: ground → surface → raised → fill. */
  --graphite-0: #161616;     /* dark ground (charcoal) */
  --graphite-1: #1f1f1f;     /* surface: cards, bubbles, panels, sidebar sheets */
  --graphite-2: #282828;     /* raised: menus, dialogs, popovers, @-mention list */
  --graphite-3: #2f2f2f;     /* fill: tags, counts, disabled, segmented track */
  --graphite-4: #333333;     /* inverse on dark: toasts, ink banners */
  --graphite-5: #3d3d3d;     /* segmented thumb */
  --graphite-6: #737373;     /* dark control edge: 3.82 ground · 3.37 surface · 3.11 raised */
  --graphite-7: #989898;     /* dark text-3: 6.27 ground · 5.54 surface · 5.11 raised · 4.62 fill */
  --graphite-8: #b8b8b8;     /* dark text-2: 9.12 ground · 8.05 surface · 6.71 fill */
  --graphite-9: #ebebeb;     /* dark Ink: a soft light grey, not white. 15.2 ground · 13.4 surface · 11.2 fill */

  /* Cobalt: the one action colour (P-2). On dark the fill lifts one step so white text still passes. */
  --cobalt-50: #ebf0ff;
  --cobalt-300: #8fa8ff;     /* links and focus on dark: 7.94 on graphite-0, 7.01 on graphite-1, 5.84 on graphite-3 */
  --cobalt-400: #3a64ff;     /* dark action fill: white on it 4.72 · edge 3.83 on graphite-0 (non-text 3:1) */
  --cobalt-500: #2e5bff;     /* light action: white on it 5.17 · on white 5.17 */
  --cobalt-600: #2550eb;
  --cobalt-700: #1f45d1;

  /* Feedback. Always with a word or a glyph, never colour alone. Dark values are desaturated light inks on dark tints. */
  --green-50: #e3f5ea;  --green-500: #22a35a;  --green-700: #1b7a45;
  --amber-50: #fff1d9;  --amber-500: #f5a20a;  --amber-700: #8a5300;
  --red-50:   #fdeaea;  --red-500:   #e5383b;  --red-700:   #c0262d;
  --green-d-ink: #6fd09a; --green-d-tint: #13261b; --green-d-fill: #3c9e66;   /* ink on tint 8.5 · on surface 8.8 */
  --amber-d-ink: #f0b45a; --amber-d-tint: #2c2213; --amber-d-fill: #e8a33a;   /* ink on tint 8.49 · Ink #15171d on fill 8.3 */
  --red-d-ink:   #ff8a85; --red-d-tint:   #2e1517; --red-d-fill:   #d9474a;   /* ink on tint 7.47 · white glyph on fill 4.24 */

  /* Agent hues: ten identities. Identity = hue × shape (D-UI8). Never on a button, never for status.
     base/light/deep are fixed (the avatar body and its hero gradient look the same in both themes). */
  --hue-coral-base: #ff5f73;     --hue-coral-light: #ffb8c1;     --hue-coral-deep: #e0364f;
  --hue-tangerine-base: #ff8a3d; --hue-tangerine-light: #ffc9a3; --hue-tangerine-deep: #e0601a;
  --hue-honey-base: #f2ab1d;     --hue-honey-light: #ffe2a0;     --hue-honey-deep: #cf8600;
  --hue-pear-base: #96bf2c;      --hue-pear-light: #d6ec9a;      --hue-pear-deep: #6c9410;
  --hue-mint-base: #3cc47c;      --hue-mint-light: #aeedc9;      --hue-mint-deep: #1f9658;
  --hue-teal-base: #1fb5a3;      --hue-teal-light: #9ee8dc;      --hue-teal-deep: #0c8a7c;
  --hue-aqua-base: #2db4dc;      --hue-aqua-light: #a6e6f7;      --hue-aqua-deep: #0e86b0;
  --hue-lavender-base: #8e6cf0;  --hue-lavender-light: #cbbcff;  --hue-lavender-deep: #5f3fd0;
  --hue-orchid-base: #e05cb4;    --hue-orchid-light: #f6b6e1;    --hue-orchid-deep: #b8358d;
  --hue-cocoa-base: #a66e4e;     --hue-cocoa-light: #dcb59d;     --hue-cocoa-deep: #7d4c31;
  --hue-none-base: #b4b7bf;      --hue-none-light: #dfe1e6;      --hue-none-deep: #8b8f99;
}

/* ==================================================================== */
/* 2. Colour roles · DARK (the default)                                  */
/* ==================================================================== */
:root,
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink-rgb: 235 235 235;

  --bg-ground: var(--graphite-0);       /* 60 %: canvas, sidebar */
  --bg-surface: var(--graphite-1);      /* 30 %: cards, bubbles, panels */
  --bg-raised: var(--graphite-2);       /* what floats: menus, dialogs, popovers */
  --bg-sunken: var(--graphite-3);       /* fills: tags, counts, disabled (lighter than the surface on dark) */
  --bg-inverse: var(--graphite-4);      /* toasts, ink banners */
  --seg-on: var(--graphite-5);          /* the selected segment */

  --state-hover: rgb(var(--ink-rgb) / 0.045);
  --state-press: rgb(var(--ink-rgb) / 0.085);
  --state-selected: rgb(var(--ink-rgb) / 0.07);

  --text-1: var(--graphite-9);
  --text-2: var(--graphite-8);
  --text-3: var(--graphite-7);
  --text-inverse: #ededed;              /* 10.8 on graphite-4 */
  --text-inverse-2: #adadad;            /* 5.63 on graphite-4 */
  --text-on-action: #ffffff;            /* 4.72 on cobalt-400 */
  --text-on-ink: var(--graphite-0);     /* text on an Ink fill (Send, counts, Blocked tag): 15.2 */
  --ink-hover: #f5f5f5;  --ink-press: #d9d9d9;
  --mark: var(--graphite-9);            /* the Quartet mark in the interface */

  --line-subtle: rgb(var(--ink-rgb) / 0.07);
  --line: rgb(var(--ink-rgb) / 0.11);
  --line-control: var(--graphite-6);

  --action: var(--cobalt-400);
  --action-hover: var(--cobalt-500);
  --action-press: var(--cobalt-600);
  --action-tint: rgb(58 100 255 / 0.18);  /* cobalt-300 text on it (over the surface) 6.09 */
  --action-text: var(--cobalt-300);       /* links on hover/focus only (Von Restorff) */
  --focus: var(--cobalt-300);

  --ok-ink: var(--green-d-ink);    --ok-tint: var(--green-d-tint);    --ok-fill: var(--green-d-fill);   --ok-solid: var(--green-700);
  --attn-ink: var(--amber-d-ink);  --attn-tint: var(--amber-d-tint);  --attn-fill: var(--amber-d-fill); --on-attn: #161616;
  --danger-ink: var(--red-d-ink);  --danger-tint: var(--red-d-tint);  --danger-fill: var(--red-d-fill); --danger-solid: var(--red-700); --danger-solid-hover: #a81f26;

  --sw-track: #404040;  --sw-track-hover: #4d4d4d;  --sw-knob: #cccccc;  --sw-knob-on: var(--graphite-0);
  --diff-add: rgb(63 185 110 / 0.14);  --diff-del: rgb(255 100 100 / 0.13);

  /* Agent hues on dark: ink = the hue's light step (≥ 7:1 on its tint); tint = the body colour at 12 % over the
     surface, 14 % for the two dim hues (the client's bubble, mention chips). No canvas wash on dark (v2.1): the
     wash resolves to the charcoal ground, so the agent's colour lives on its avatar, name and bubble only. */
  --hue-coral-ink: var(--hue-coral-light);         --hue-coral-tint: color-mix(in srgb, var(--hue-coral-base) 12%, #1f1f1f);         --hue-coral-wash: var(--graphite-0);
  --hue-tangerine-ink: var(--hue-tangerine-light); --hue-tangerine-tint: color-mix(in srgb, var(--hue-tangerine-base) 12%, #1f1f1f); --hue-tangerine-wash: var(--graphite-0);
  --hue-honey-ink: var(--hue-honey-light);         --hue-honey-tint: color-mix(in srgb, var(--hue-honey-base) 12%, #1f1f1f);         --hue-honey-wash: var(--graphite-0);
  --hue-pear-ink: var(--hue-pear-light);           --hue-pear-tint: color-mix(in srgb, var(--hue-pear-base) 12%, #1f1f1f);           --hue-pear-wash: var(--graphite-0);
  --hue-mint-ink: var(--hue-mint-light);           --hue-mint-tint: color-mix(in srgb, var(--hue-mint-base) 12%, #1f1f1f);           --hue-mint-wash: var(--graphite-0);
  --hue-teal-ink: var(--hue-teal-light);           --hue-teal-tint: color-mix(in srgb, var(--hue-teal-base) 12%, #1f1f1f);           --hue-teal-wash: var(--graphite-0);
  --hue-aqua-ink: var(--hue-aqua-light);           --hue-aqua-tint: color-mix(in srgb, var(--hue-aqua-base) 12%, #1f1f1f);           --hue-aqua-wash: var(--graphite-0);
  --hue-lavender-ink: var(--hue-lavender-light);   --hue-lavender-tint: color-mix(in srgb, var(--hue-lavender-base) 14%, #1f1f1f);   --hue-lavender-wash: var(--graphite-0);
  --hue-orchid-ink: var(--hue-orchid-light);       --hue-orchid-tint: color-mix(in srgb, var(--hue-orchid-base) 12%, #1f1f1f);       --hue-orchid-wash: var(--graphite-0);
  --hue-cocoa-ink: var(--hue-cocoa-light);         --hue-cocoa-tint: color-mix(in srgb, var(--hue-cocoa-base) 14%, #1f1f1f);         --hue-cocoa-wash: var(--graphite-0);
  --hue-none-ink: var(--hue-none-light);           --hue-none-tint: var(--graphite-3);                                              --hue-none-wash: var(--graphite-0);

  /* Elevation on dark: a lighter surface and a 1px light ring; only what floats adds a soft black shadow. No glows. */
  --shadow-color: 0 0% 0%;
  --elev-0: none;
  --elev-1: 0 0 0 1px rgb(var(--ink-rgb) / 0.055);
  --elev-2: 0 0 0 1px rgb(var(--ink-rgb) / 0.08);
  --elev-3: 0 0 0 1px rgb(var(--ink-rgb) / 0.09), 0 16px 40px rgb(0 0 0 / 0.45);
  --elev-4: 0 0 0 1px rgb(var(--ink-rgb) / 0.1), 0 24px 64px rgb(0 0 0 / 0.55);
  --scrim: rgb(0 0 0 / 0.55);
  --scrim-soft: rgb(0 0 0 / 0.35);      /* What needs you over the current screen */
}

/* ==================================================================== */
/* 2b. Colour roles · LIGHT (the option; the v1.1 values, unchanged)     */
/* ==================================================================== */
:root[data-theme="light"] {
  color-scheme: light;
  --ink-rgb: 21 23 29;

  --bg-ground: var(--porcelain-50);
  --bg-surface: var(--porcelain-0);
  --bg-raised: var(--porcelain-0);
  --bg-sunken: var(--porcelain-100);
  --bg-inverse: var(--porcelain-900);
  --seg-on: var(--porcelain-0);

  --text-1: var(--porcelain-900);
  --text-2: var(--porcelain-700);
  --text-3: var(--porcelain-600);       /* also placeholders: 4.73 on sunken */
  --text-inverse: #eceef3;
  --text-inverse-2: #a9adb8;            /* 7.98 on Ink */
  --text-on-action: #ffffff;
  --text-on-ink: #ffffff;
  --ink-hover: #2b2e37;  --ink-press: #000000;
  --mark: var(--porcelain-900);

  --line-control: var(--porcelain-500);

  --action: var(--cobalt-500);
  --action-hover: var(--cobalt-600);
  --action-press: var(--cobalt-700);
  --action-tint: var(--cobalt-50);      /* cobalt text on it 4.54 */
  --action-text: var(--cobalt-500);
  --focus: var(--cobalt-500);

  --ok-ink: var(--green-700);   --ok-tint: var(--green-50);   --ok-fill: var(--green-500);
  --attn-ink: var(--amber-700); --attn-tint: var(--amber-50); --attn-fill: var(--amber-500);
  --danger-ink: var(--red-700); --danger-tint: var(--red-50); --danger-fill: var(--red-500);

  --sw-track: var(--porcelain-300);  --sw-track-hover: #b3b8c3;  --sw-knob: #ffffff;  --sw-knob-on: #ffffff;
  --diff-add: #e9f6ee;  --diff-del: #fdeeee;

  /* Agent hues on light: ink is AA on white and on its tint */
  --hue-coral-ink: #c4283f;     --hue-coral-tint: #ffe6e9;     --hue-coral-wash: #fff8f9;
  --hue-tangerine-ink: #b04a00; --hue-tangerine-tint: #ffeee2; --hue-tangerine-wash: #fffaf6;
  --hue-honey-ink: #8a5a00;     --hue-honey-tint: #fff4dc;     --hue-honey-wash: #fffcf4;
  --hue-pear-ink: #4d6a00;      --hue-pear-tint: #f0f7dc;      --hue-pear-wash: #fbfdf4;
  --hue-mint-ink: #1d7a43;      --hue-mint-tint: #e5f7ec;      --hue-mint-wash: #f6fcf8;
  --hue-teal-ink: #00756a;      --hue-teal-tint: #e1f6f2;      --hue-teal-wash: #f5fcfb;
  --hue-aqua-ink: #006b85;      --hue-aqua-tint: #e3f6fb;      --hue-aqua-wash: #f6fcfe;
  --hue-lavender-ink: #5a3dc8;  --hue-lavender-tint: #efeaff;  --hue-lavender-wash: #faf8ff;
  --hue-orchid-ink: #b0287f;    --hue-orchid-tint: #fbe7f4;    --hue-orchid-wash: #fef8fc;
  --hue-cocoa-ink: #7a4a2e;     --hue-cocoa-tint: #f5ebe4;     --hue-cocoa-wash: #fcf8f5;
  --hue-none-ink: #474b57;      --hue-none-tint: #eceef2;      --hue-none-wash: #f9fafb;

  /* Elevation on light: tone first, shadow only for what floats */
  --shadow-color: 228 16% 10%;
  --elev-1: 0 0 0 1px var(--line-subtle);
  --elev-2: 0 0 0 1px var(--line-subtle), 0 1px 2px hsl(var(--shadow-color) / 0.05), 0 4px 12px hsl(var(--shadow-color) / 0.05);
  --elev-3: 0 0 0 1px hsl(var(--shadow-color) / 0.07), 0 4px 10px hsl(var(--shadow-color) / 0.08), 0 16px 40px hsl(var(--shadow-color) / 0.10);
  --elev-4: 0 0 0 1px hsl(var(--shadow-color) / 0.06), 0 12px 32px hsl(var(--shadow-color) / 0.14), 0 40px 96px hsl(var(--shadow-color) / 0.18);
  --scrim: rgb(21 23 29 / 0.32);
  --scrim-soft: rgb(21 23 29 / 0.16);
}

:root {
  /* The current agent. Set data-hue on any container; everything inside inherits its identity. */
  --agent-base: var(--hue-none-base);
  --agent-light: var(--hue-none-light);
  --agent-deep: var(--hue-none-deep);
  --agent-ink: var(--hue-none-ink);
  --agent-tint: var(--hue-none-tint);
  --agent-wash: var(--hue-none-wash);

  /* ------------------------------------------------------------------ */
  /* 3. Type                                                             */
  /* ------------------------------------------------------------------ */
  /* P-3 (decided 2026-10-23): Instrument Sans 400/600 for everything, JetBrains Mono for code, commands, diffs and the trace.
     Both SIL OFL 1.1 and bundled with the app, so every OS renders the same face. The fallbacks only cover a missing file.
     The app declares the bundled files once (paths are the build's, not these docs'):
       @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans[wdth,wght].woff2") format("woff2"); font-weight: 400 700; font-display: block; }
       @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono[wght].woff2") format("woff2"); font-weight: 400 600; font-display: block; }
     Review pages (brand board, components, prototype) load the same faces from Google Fonts instead. */
  --font-text: "Instrument Sans", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-display: var(--font-text);
  --font-mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", ui-monospace, Consolas, monospace;

  --weight-regular: 400;
  --weight-strong: 600;   /* the only other weight */

  /* Six steps, far apart. Any one view uses four at most. */
  --fs-meta: 12px;      --lh-meta: 16px;     --ls-meta: 0.005em;
  --fs-sub: 13px;       --lh-sub: 18px;      --ls-sub: 0;
  --fs-body: 15px;      --lh-body: 22px;     --ls-body: -0.006em;
  --fs-title: 20px;     --lh-title: 26px;    --ls-title: -0.014em;
  --fs-headline: 28px;  --lh-headline: 34px; --ls-headline: -0.022em;
  --fs-display: 44px;   --lh-display: 48px;  --ls-display: -0.032em;

  --measure-chat: 34em;
  --measure-prose: 62ch;

  /* ------------------------------------------------------------------ */
  /* 4. Space (4-pt; spacing by relationship)                            */
  /* ------------------------------------------------------------------ */
  --sp-0: 0;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;  --sp-5: 20px;  --sp-6: 24px;
  --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;

  /* ------------------------------------------------------------------ */
  /* 5. Shape: one continuous-corner family (R3)                         */
  /* ------------------------------------------------------------------ */
  --corner: round;
  --r-xs: 10px;  --r-sm: 10px;   /* things inside objects: inputs, options, wells, menu items */
  --r-md: 18px;  --r-lg: 18px;  --r-xl: 18px;   /* objects: tickets, cards, bubbles, dialogs, menus */
  --r-full: 999px;               /* controls */

  /* ------------------------------------------------------------------ */
  /* 7. Motion: physics, not timelines                                   */
  /* ------------------------------------------------------------------ */
  --dur-micro: 140ms;  --dur-short: 200ms;  --dur-move: 320ms;  --dur-scene: 420ms;  --dur-character: 640ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-exit: cubic-bezier(0.55, 0, 1, 0.45);
  --ease-color: ease;
  --spring-smooth: linear(0, 0.078 5%, 0.235 10%, 0.401 15%, 0.549 20%, 0.669 25%, 0.762 30%, 0.831 35%, 0.882 40%, 0.944 50%, 0.974 60%, 0.988 70%, 0.995 80%, 1);
  --spring-snappy: linear(0, 0.061 5%, 0.198 10%, 0.36 15%, 0.518 20%, 0.656 25%, 0.768 30%, 0.854 35%, 0.917 40%, 0.987 50%, 1.012 60%, 1.015 70%, 1.011 80%, 1.006 90%, 1);
  --spring-gentle: linear(0, 0.074 5%, 0.249 10%, 0.463 15%, 0.673 20%, 0.85 25%, 0.983 30%, 1.069 35%, 1.114 40%, 1.127 45%, 1.117 50%, 1.068 60%, 1.019 70%, 0.991 80%, 0.984 90%, 1);
  --press-scale: 0.97;
  --rise: 8px;

  /* ------------------------------------------------------------------ */
  /* 8. Layers                                                           */
  /* ------------------------------------------------------------------ */
  --z-base: 0;  --z-sticky: 10;  --z-sidebar: 20;  --z-pane: 30;  --z-dropdown: 100;  --z-popover: 200;
  --z-toast: 300;  --z-scrim: 400;  --z-dialog: 410;  --z-tooltip: 500;  --z-drag: 600;

  /* ------------------------------------------------------------------ */
  /* 9. Sizes                                                            */
  /* ------------------------------------------------------------------ */
  --control-sm: 28px;   /* visual only: its hit area is grown to 32 (Fitts, fix 15) */
  --control-md: 32px;   /* desktop click-target floor */
  --control-lg: 40px;   /* primary actions and Send (fix 13) */
  --row-1: 40px;  --row-2: 56px;
  --icon-sm: 14px;  --icon-md: 16px;  --icon-lg: 20px;  --stroke-icon: 1.5px;
  --av-xs: 16px;  --av-sm: 24px;  --av-md: 32px;  --av-lg: 40px;  --av-xl: 64px;  --av-hero: 96px;
  --focus-ring: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--focus);

  /* ------------------------------------------------------------------ */
  /* 10. Sound (P-7). Not CSS: the values the renderer's sound module reads. */
  /* ------------------------------------------------------------------ */
  /* needs-you A4 → D5 · 320 ms · done F#5 · 380 ms · handoff breath + E5 → A5 · 290 ms. Spec: DESIGN-SYSTEM.md §8.5. */
  --sound-volume: 0.7;
}

/* Continuous corners where the engine draws them. Same visual size, smoother curvature. */
@supports (corner-shape: squircle) {
  :root { --corner: squircle; --r-xs: 16px; --r-sm: 16px; --r-md: 28px; --r-lg: 28px; --r-xl: 28px; }
}

/* Agent identity scopes */
[data-hue="coral"]     { --agent-base: var(--hue-coral-base);     --agent-light: var(--hue-coral-light);     --agent-deep: var(--hue-coral-deep);     --agent-ink: var(--hue-coral-ink);     --agent-tint: var(--hue-coral-tint);     --agent-wash: var(--hue-coral-wash); }
[data-hue="tangerine"] { --agent-base: var(--hue-tangerine-base); --agent-light: var(--hue-tangerine-light); --agent-deep: var(--hue-tangerine-deep); --agent-ink: var(--hue-tangerine-ink); --agent-tint: var(--hue-tangerine-tint); --agent-wash: var(--hue-tangerine-wash); }
[data-hue="honey"]     { --agent-base: var(--hue-honey-base);     --agent-light: var(--hue-honey-light);     --agent-deep: var(--hue-honey-deep);     --agent-ink: var(--hue-honey-ink);     --agent-tint: var(--hue-honey-tint);     --agent-wash: var(--hue-honey-wash); }
[data-hue="pear"]      { --agent-base: var(--hue-pear-base);      --agent-light: var(--hue-pear-light);      --agent-deep: var(--hue-pear-deep);      --agent-ink: var(--hue-pear-ink);      --agent-tint: var(--hue-pear-tint);      --agent-wash: var(--hue-pear-wash); }
[data-hue="mint"]      { --agent-base: var(--hue-mint-base);      --agent-light: var(--hue-mint-light);      --agent-deep: var(--hue-mint-deep);      --agent-ink: var(--hue-mint-ink);      --agent-tint: var(--hue-mint-tint);      --agent-wash: var(--hue-mint-wash); }
[data-hue="teal"]      { --agent-base: var(--hue-teal-base);      --agent-light: var(--hue-teal-light);      --agent-deep: var(--hue-teal-deep);      --agent-ink: var(--hue-teal-ink);      --agent-tint: var(--hue-teal-tint);      --agent-wash: var(--hue-teal-wash); }
[data-hue="aqua"]      { --agent-base: var(--hue-aqua-base);      --agent-light: var(--hue-aqua-light);      --agent-deep: var(--hue-aqua-deep);      --agent-ink: var(--hue-aqua-ink);      --agent-tint: var(--hue-aqua-tint);      --agent-wash: var(--hue-aqua-wash); }
[data-hue="lavender"]  { --agent-base: var(--hue-lavender-base);  --agent-light: var(--hue-lavender-light);  --agent-deep: var(--hue-lavender-deep);  --agent-ink: var(--hue-lavender-ink);  --agent-tint: var(--hue-lavender-tint);  --agent-wash: var(--hue-lavender-wash); }
[data-hue="orchid"]    { --agent-base: var(--hue-orchid-base);    --agent-light: var(--hue-orchid-light);    --agent-deep: var(--hue-orchid-deep);    --agent-ink: var(--hue-orchid-ink);    --agent-tint: var(--hue-orchid-tint);    --agent-wash: var(--hue-orchid-wash); }
[data-hue="cocoa"]     { --agent-base: var(--hue-cocoa-base);     --agent-light: var(--hue-cocoa-light);     --agent-deep: var(--hue-cocoa-deep);     --agent-ink: var(--hue-cocoa-ink);     --agent-tint: var(--hue-cocoa-tint);     --agent-wash: var(--hue-cocoa-wash); }

/* Reduced motion: the same information, without travel. Opacity and colour changes stay. */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-move: 1ms; --dur-scene: 1ms; --dur-character: 1ms; --press-scale: 1; --rise: 0px; }
}

/* ---- ../tokens-companion.css ---- */
/*
 * Eucas companion tokens · v0.1 (2026-10-26)
 * Extends ../system/tokens.css. Load it after tokens.css. Spec: ./DESIGN.md §3.
 *
 * Only what the companion needs and the base system doesn't have: the guard states and the heartbeat,
 * severity aliases, the tray icon, the Windows-owned chrome (window frame, flyout, toast, context menu, UAC)
 * and the companion's fixed sizes. Everything else (colour roles, type, space, corners, motion) comes from
 * tokens.css unchanged.
 *
 * Two kinds of token live here:
 *   --guard-*, --sev-*, --hb-*, --cmp-*  follow the APP theme ([data-theme] on <html>), like every role token.
 *   --os-*, --tray-*                     follow the WINDOWS theme ([data-os-theme] on the element that hosts
 *                                        them), because the taskbar, toasts and context menus are drawn by
 *                                        Windows in its own theme, not in Eucas's (UX handoff point 11).
 * Contrast ratios are WCAG 2.x, computed from these exact values.
 */

:root,
:root[data-theme="dark"] {
  /* ---- Severity: aliases of the feedback roles, named by what they mean in the companion ---- */
  --sev-calm: var(--text-3);           /* nothing to do: idle, done, informational log rows */
  --sev-attn: var(--attn-ink);         /* needs you, not verified, user level (weaker): amber, always with a word */
  --sev-attn-tint: var(--attn-tint);
  --sev-danger: var(--danger-ink);     /* not guarded, tripwire, guard failing: red, always with a word */
  --sev-danger-tint: var(--danger-tint);
  --sev-ok: var(--ok-ink);             /* proven only: a real check passed. Never for a claim */
  --sev-ok-tint: var(--ok-tint);

  /* ---- Guard states: glyph colour per state (the word is always beside it) ---- */
  --guard-guarded: var(--ok-ink);      /* 8.8 on surface. Only while a real check landed in the last interval */
  --guard-idle: var(--text-3);         /* hollow ring: ready, not ticking */
  --guard-not-guarded: var(--danger-ink);
  --guard-not-verified: var(--attn-ink);
  --guard-user-level: var(--attn-ink);
  --guard-org: var(--text-2);          /* a lock: not ours to fix */
  --guard-failing: var(--danger-ink);

  /* ---- The heartbeat strip: one bar per 10 s bucket, newest on the right ---- */
  --hb-bar: rgb(var(--ink-rgb) / 0.32);         /* a bucket with checks (height = count) */
  --hb-bar-now: var(--ok-ink);                   /* the bucket that just got a real check */
  --hb-bar-idle: rgb(var(--ink-rgb) / 0.12);     /* no tool calls: a 2 px baseline dot, not a bar */
  --hb-bar-miss: var(--danger-ink);              /* tools ran, no check: full height, red */
  --hb-gap: 2px;
  --hb-bar-w: 3px;
  --hb-h: 24px;                                  /* 18 px in a row, 24 px on the status card */
  --hb-pulse: 2400ms;                            /* the glyph's ring: never faster than one per 2 s */
  --hb-bucket: 10s;

  /* ---- Companion surfaces ---- */
  --cmp-flyout: var(--bg-raised);      /* the tray popover: solid, no Acrylic (BRAND: no glass) */
  --cmp-flyout-card: var(--bg-surface); /* a card inside the popover sits one step down */
  --cmp-mica: color-mix(in srgb, var(--bg-ground) 94%, #3a4250);  /* Mica, emulated: the ground faintly tinted by the wallpaper */
  --cmp-scrim-trip: rgb(0 0 0 / 0.62);  /* behind the tripwire card */
  --cmp-meter-track: rgb(var(--ink-rgb) / 0.1);
  --cmp-meter-fill: var(--text-1);      /* usage is Ink, never red (BRAND tone: factual, never alarming) */
  --cmp-meter-close: var(--attn-fill);  /* at your threshold, with the word "close" */
  --cmp-meter-tick: var(--text-2);
}

:root[data-theme="light"] {
  --cmp-flyout-card: var(--porcelain-25);
  --cmp-mica: color-mix(in srgb, var(--bg-ground) 92%, #c9d6ea);
  --cmp-scrim-trip: rgb(21 23 29 / 0.38);
  --hb-bar: rgb(var(--ink-rgb) / 0.36);
  --hb-bar-idle: rgb(var(--ink-rgb) / 0.14);
}

:root {
  /* ---- Fixed sizes (UX ia-and-flows §1) ---- */
  --cmp-flyout-w: 380px;
  --cmp-flyout-max-h: 560px;
  --cmp-window-w: 1040px;   --cmp-window-h: 720px;
  --cmp-window-min-w: 880px; --cmp-window-min-h: 600px;
  --cmp-firstrun-w: 720px;  --cmp-firstrun-h: 560px;
  --cmp-sidebar-w: 216px;
  --cmp-trip-count: var(--fs-display);   /* the live delete count: the one display figure in the product */

  /* ---- Motion additions (springs and durations come from tokens.css) ---- */
  --cmp-count-up: 400ms;          /* retro numbers count once, then settle */
  --cmp-toast-in: 320ms;          /* Windows slides toasts in from the right */
  --cmp-flyout-in: 200ms;         /* flyout: rise 8 px + fade, the Windows flyout timing */
  --cmp-undo: 10s;                /* undo window after a triage action */
}

/* ==================================================================== */
/* Windows-owned chrome. Set data-os-theme="dark|light" on the host.     */
/* Values are the Windows 11 defaults, so Eucas sits in the OS, not on it. */
/* ==================================================================== */
[data-os-theme="dark"] {
  --os-font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --os-desktop: #0e0f11;
  --os-taskbar: #1c1c1c;
  --os-taskbar-line: rgb(255 255 255 / 0.08);
  --os-text: #ffffff;
  --os-text-2: rgb(255 255 255 / 0.79);
  --os-text-3: rgb(255 255 255 / 0.54);
  --os-hover: rgb(255 255 255 / 0.06);
  --os-press: rgb(255 255 255 / 0.04);
  --os-surface: #2c2c2c;           /* toasts, context menus, flyouts drawn by Windows */
  --os-surface-line: rgb(255 255 255 / 0.08);
  --os-button: rgb(255 255 255 / 0.06);
  --os-button-line: rgb(255 255 255 / 0.09);
  --os-accent: #4cc2ff;            /* the Windows default accent in dark (toast focus, UAC Yes) */
  --os-accent-text: #000000;
  --os-close-hover: #c42b1c;
  --os-shadow: 0 8px 16px rgb(0 0 0 / 0.26), 0 0 0 1px rgb(0 0 0 / 0.3);
  --os-secure-desktop: rgb(0 0 0 / 0.68);

  /* Tray glyph: white on a dark taskbar */
  --tray-glyph: #ffffff;
  --tray-glyph-dim: rgb(255 255 255 / 0.5);
  --tray-badge-attn: #f5a20a;      /* amber count / "!": Ink #15171d on it 8.58 */
  --tray-badge-text: #15171d;
  --tray-slash: #ff6b66;           /* 6.12 on #1c1c1c */
  --tray-moon: #ffffff;
}

[data-os-theme="light"] {
  --os-font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --os-desktop: #d9dee6;
  --os-taskbar: #eeeeee;
  --os-taskbar-line: rgb(0 0 0 / 0.08);
  --os-text: #1b1b1b;
  --os-text-2: rgb(0 0 0 / 0.62);
  --os-text-3: rgb(0 0 0 / 0.45);
  --os-hover: rgb(0 0 0 / 0.04);
  --os-press: rgb(0 0 0 / 0.025);
  --os-surface: #f9f9f9;
  --os-surface-line: rgb(0 0 0 / 0.07);
  --os-button: #ffffff;
  --os-button-line: rgb(0 0 0 / 0.1);
  --os-accent: #005fb8;
  --os-accent-text: #ffffff;
  --os-close-hover: #c42b1c;
  --os-shadow: 0 8px 16px rgb(0 0 0 / 0.14), 0 0 0 1px rgb(0 0 0 / 0.06);
  --os-secure-desktop: rgb(0 0 0 / 0.42);

  /* Tray glyph: near-black on a light taskbar */
  --tray-glyph: #1b1b1b;
  --tray-glyph-dim: rgb(0 0 0 / 0.42);
  --tray-badge-attn: #a86400;      /* darker amber: badge edge 4.03 on #eeeeee (non-text 3:1), white digit on it 4.68 */
  --tray-badge-text: #ffffff;
  --tray-slash: #c42b1c;           /* 4.88 on #eeeeee */
  --tray-moon: #1b1b1b;
}

/* Windows high contrast (forced colours): the glyph and its state marks use system colours; colour never carries the state */
@media (forced-colors: active) {
  [data-os-theme] { --tray-glyph: CanvasText; --tray-glyph-dim: GrayText; --tray-badge-attn: Highlight; --tray-badge-text: HighlightText; --tray-slash: CanvasText; --tray-moon: CanvasText; }
}

:root {
  --os-radius-window: 8px;    /* DWM rounds every top-level window at 8 px; ours matches what Windows draws */
  --os-radius-menu: 8px;
  --os-radius-item: 4px;
  --os-caption-h: 32px;       /* title bar height */
  --os-caption-btn-w: 46px;   /* min / max / close */
  --os-taskbar-h: 48px;
  --os-toast-w: 364px;
}

/* ---- src/app.css ---- */
/* Eucas companion prototype · v0.1
   Every colour is a role token from tokens.css or tokens-companion.css. Windows-owned chrome uses --os-*;
   our own content uses the brand roles. Spec: ../DESIGN.md */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-text);font-size:var(--fs-body);line-height:var(--lh-body);letter-spacing:var(--ls-body);color:var(--text-1);background:#0b0b0c;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:where(button,a,[tabindex],input,select,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-full)}
code,.mono{font-family:var(--font-mono);font-size:.88em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
svg{flex:none}

/* ---------------- Demo bar (prototype only, not part of the UI) ---------------- */
.demo{position:fixed;inset:0 0 auto 0;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#000;color:#ededed;font-size:13px;z-index:900;border-bottom:1px solid #262626}
.demo b{font-weight:600;white-space:nowrap}
.demo select,.demo .dbtn{height:30px;border-radius:999px;background:#1c1c1c;color:#ededed;border:1px solid #333;padding:0 12px;font:inherit;font-size:13px}
.demo select{max-width:330px}
.demo .dbtn[aria-pressed="true"]{background:#ededed;color:#111}
.demo .sp{flex:1}
.demo .dgrp{display:flex;align-items:center;gap:6px;color:#a3a3a3}
.demo details{position:relative}
.demo summary{list-style:none;height:30px;display:flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid #333;background:#1c1c1c;cursor:pointer;white-space:nowrap}
.demo summary::-webkit-details-marker{display:none}
.demo .dpanel{position:absolute;right:0;top:36px;width:360px;background:#161616;border:1px solid #333;border-radius:12px;padding:12px;display:grid;gap:10px;box-shadow:0 16px 40px rgb(0 0 0/.5)}
.demo .dpanel label{display:grid;gap:4px;font-size:12px;color:#a3a3a3}
.demo .dpanel select{max-width:none;width:100%}
.clean .demo{display:none}

/* ---------------- The Windows desktop (the stage) ---------------- */
#stage{position:fixed;inset:44px 0 0 0;background:var(--os-desktop);font-family:var(--font-text);overflow:hidden}
.clean #stage{inset:0}
#desk{position:absolute;inset:0 0 var(--os-taskbar-h) 0}

/* Taskbar (Windows-owned) */
.taskbar{position:absolute;inset:auto 0 0 0;height:var(--os-taskbar-h);background:var(--os-taskbar);border-top:1px solid var(--os-taskbar-line);display:flex;align-items:center;font-family:var(--os-font);color:var(--os-text);font-size:12px}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.tb-app{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;color:var(--os-text-2)}
.tb-app:hover{background:var(--os-hover)}
.tb-app.on{position:relative}
.tb-app.on::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;border-radius:2px;background:var(--os-text-3);transform:translateX(-50%)}
.tb-app.on.act::after{width:16px;background:var(--os-accent)}
.tray{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:8px;height:100%}
.tray-btn{height:40px;min-width:32px;padding:0 6px;border-radius:4px;display:grid;place-items:center;color:var(--os-text)}
.tray-btn:hover{background:var(--os-hover)}
.tray-btn[aria-expanded="true"]{background:var(--os-hover)}
.tray-btn:focus-visible{outline:2px solid var(--os-text);outline-offset:-2px;border-radius:4px}
.tray-sys{display:flex;gap:10px;align-items:center;padding:0 8px;height:40px;border-radius:4px;color:var(--os-text)}
.tray-sys:hover{background:var(--os-hover)}
.tray-clock{text-align:right;line-height:16px;padding:0 8px;height:40px;display:flex;flex-direction:column;justify-content:center;border-radius:4px}
.tray-clock:hover{background:var(--os-hover)}
.tray-ico{position:relative;width:16px;height:16px;display:block}
.tray-ico.big{width:48px;height:48px}

/* Overflow flyout (Windows), used by the pinning helper */
.ovf{position:absolute;right:150px;bottom:calc(var(--os-taskbar-h) + 8px);background:var(--os-surface);border-radius:var(--os-radius-menu);box-shadow:var(--os-shadow);padding:6px;display:grid;grid-template-columns:repeat(3,40px);gap:2px;font-family:var(--os-font)}
.ovf .tray-btn{width:40px}

/* ---------------- Windows-like window frame ---------------- */
.win{position:absolute;left:50%;top:50%;width:var(--cmp-window-w);height:var(--cmp-window-h);max-width:calc(100% - 32px);max-height:calc(100% - 24px);transform:translate(-50%,-50%);border-radius:var(--os-radius-window);background:var(--cmp-mica);box-shadow:0 0 0 1px rgb(var(--ink-rgb)/.1),0 24px 64px rgb(0 0 0/.45);display:flex;flex-direction:column;overflow:hidden;color:var(--text-1)}
:root[data-theme="light"] .win{box-shadow:0 0 0 1px rgb(0 0 0/.08),0 24px 64px rgb(0 0 0/.18)}
.win.max{left:0;top:0;width:100%;height:100%;max-width:none;max-height:none;transform:none;border-radius:0}
.win.fr{width:var(--cmp-firstrun-w);height:var(--cmp-firstrun-h)}
.win.enter{animation:winIn var(--dur-scene) var(--spring-smooth) both}
@keyframes winIn{from{opacity:0;transform:translate(-50%,calc(-50% + 12px)) scale(.985)}}
.cap{height:var(--os-caption-h);display:flex;align-items:center;flex:none;font-family:var(--os-font);font-size:12px;color:var(--text-2);user-select:none}
.cap .cap-t{display:flex;align-items:center;gap:10px;padding-left:14px;flex:1}
.cap .cap-b{width:var(--os-caption-btn-w);height:var(--os-caption-h);display:grid;place-items:center;color:var(--text-1)}
.cap .cap-b:hover{background:rgb(var(--ink-rgb)/.06)}
.cap .cap-b.x:hover{background:var(--os-close-hover,#c42b1c);color:#fff}
.cap .cap-b:focus-visible{outline-offset:-2px;border-radius:0}
.wbody{flex:1;display:grid;grid-template-columns:var(--cmp-sidebar-w) 1fr;min-height:0}
.layer{background:var(--bg-ground);border-top-left-radius:8px;box-shadow:inset 1px 1px 0 rgb(var(--ink-rgb)/.06);overflow:auto;min-height:0;position:relative;scrollbar-width:thin;scrollbar-color:rgb(var(--ink-rgb)/.2) transparent}

/* Sidebar (on Mica) */
.side{display:flex;flex-direction:column;padding:6px 10px 12px;gap:2px;min-height:0}
.side .hbcard{display:block;text-align:left;width:100%;padding:10px 12px;border-radius:var(--r-sm);margin:0 0 10px}
.side .hbcard:hover{background:var(--state-hover)}
.side .hbcard .hb{font-size:var(--fs-meta);line-height:var(--lh-meta)}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:var(--fs-sub);width:100%;text-align:left;position:relative}
.nav:hover{background:var(--state-hover);color:var(--text-1)}
.nav[aria-current="page"]{background:var(--state-selected);color:var(--text-1);font-weight:600}
.nav[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--text-1)}
.nav:focus-visible{border-radius:var(--r-sm)}
.nav .cnt{margin-left:auto}
.side .grow{flex:1}

/* ---------------- Type helpers ---------------- */
.t-title{font-size:var(--fs-title);line-height:var(--lh-title);letter-spacing:var(--ls-title);font-weight:600}
.t-head{font-size:var(--fs-headline);line-height:var(--lh-headline);letter-spacing:var(--ls-headline);font-weight:600;text-wrap:balance}
.t-sub{font-size:var(--fs-sub);line-height:var(--lh-sub)}
.t-meta{font-size:var(--fs-meta);line-height:var(--lh-meta);letter-spacing:var(--ls-meta)}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.strong{font-weight:600}
.attn{color:var(--sev-attn)} .danger{color:var(--sev-danger)} .ok{color:var(--sev-ok)}

/* ---------------- Page frame inside the window ---------------- */
.page{padding:28px 36px 40px;max-width:820px;display:grid;gap:28px}
.phead{display:flex;align-items:flex-end;gap:16px}
.phead .ph-t{flex:1;display:grid;gap:4px}
.sec{display:grid;gap:10px}
.sech{display:flex;align-items:center;gap:8px;font-size:var(--fs-sub);font-weight:600;color:var(--text-1);min-height:24px}
.sech .sp{flex:1}
.card{background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-1)}
.card.pad{padding:16px 20px}
.rows>*+*{box-shadow:inset 0 1px 0 var(--line-subtle)}

/* ---------------- Buttons (DESIGN-SYSTEM §11.1) ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-md);padding:0 14px;border-radius:var(--r-full);font-size:var(--fs-sub);font-weight:600;white-space:nowrap;transition:background-color var(--dur-micro) var(--ease-color),box-shadow var(--dur-micro) var(--ease-color),transform var(--dur-micro) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn.lg{height:var(--control-lg);padding:0 20px;font-size:var(--fs-body)}
.btn.sm{height:var(--control-sm);padding:0 10px;font-size:var(--fs-meta);position:relative}
.btn.sm::after{content:"";position:absolute;inset:-2px}
.btn.pri{background:var(--action);color:var(--text-on-action)}
.btn.pri:hover{background:var(--action-hover)}
.btn.sec{box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb)/.16);color:var(--text-1);background:var(--bg-surface)}
.btn.sec:hover{box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb)/.26)}
.btn.ter{color:var(--text-2);padding:0 10px}
.btn.ter:hover{color:var(--text-1);background:var(--state-hover)}
.btn.ink{background:var(--text-1);color:var(--text-on-ink)}
.btn.ink:hover{background:var(--ink-hover)}
.btn.qdanger{color:var(--danger-ink);padding:0 10px}
.btn.qdanger:hover{background:var(--danger-tint)}
.btn.dangerfill{background:var(--danger-solid);color:#fff}
.btn[disabled]{background:var(--bg-sunken);color:var(--text-3);box-shadow:none;cursor:not-allowed;transform:none}
.btn .dim{font-weight:400;opacity:.86}
.ibtn{width:32px;height:32px;border-radius:var(--r-full);display:inline-grid;place-items:center;color:var(--text-2)}
.ibtn:hover{background:var(--state-hover);color:var(--text-1)}
.link{color:var(--text-1);text-decoration:underline;text-decoration-color:rgb(var(--ink-rgb)/.3);text-underline-offset:3px;text-decoration-thickness:1px;font-weight:600}
.link:hover{color:var(--action-text);text-decoration-color:currentColor}

/* ---------------- Tags, counts, chips ---------------- */
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:var(--r-full);font-size:var(--fs-meta);font-weight:600;white-space:nowrap;background:var(--bg-sunken);color:var(--text-2)}
.tag.attn{background:var(--sev-attn-tint);color:var(--sev-attn)}
.tag.danger{background:var(--sev-danger-tint);color:var(--sev-danger)}
.tag.ok{background:var(--sev-ok-tint);color:var(--sev-ok)}
.tag.ink{background:var(--text-1);color:var(--text-on-ink)}
.tag.outline{background:none;box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb)/.2)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);font-size:var(--fs-meta);font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg-sunken);color:var(--text-2)}
.cnt.attn{background:var(--attn-fill);color:var(--on-attn)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-meta);font-weight:600;color:var(--text-2);box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb)/.14);position:relative}
.chip::after{content:"";position:absolute;inset:-2px}
.chip:hover{color:var(--text-1);box-shadow:inset 0 0 0 1px rgb(var(--ink-rgb)/.26)}
.chip[aria-pressed="true"]{background:var(--text-1);color:var(--text-on-ink);box-shadow:none}
.kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border-radius:5px;background:var(--bg-sunken);color:var(--text-2)}
.cmd{font-family:var(--font-mono);font-size:13px;line-height:20px;padding:6px 10px;border-radius:var(--r-sm);background:var(--bg-sunken);color:var(--text-1);overflow-wrap:anywhere;display:inline-block}
.dots>*+*::before{content:"·";margin:0 6px;color:var(--text-3)}

/* ---------------- The heartbeat line (one component everywhere) ---------------- */
.hb{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sub);line-height:var(--lh-sub);color:var(--text-1);min-width:0}
.hb .hb-txt{min-width:0}
.hb .hb-txt b{font-weight:600}
.hb .hb-txt .t2{color:var(--text-2)}
.hbg{position:relative;width:14px;height:14px;display:grid;place-items:center;flex:none}
.hbg svg{display:block}
.hbg[data-s="guarded"]{color:var(--guard-guarded)}
.hbg[data-s="idle"]{color:var(--guard-idle)}
.hbg[data-s="not_guarded"],.hbg[data-s="failing"]{color:var(--guard-not-guarded)}
.hbg[data-s="not_verified"],.hbg[data-s="user_level"],.hbg[data-s="untested"]{color:var(--guard-not-verified)}
.hbg[data-s="org"]{color:var(--guard-org)}
.hbg[data-s="setup"]{color:var(--text-3)}
.hbg .ring{position:absolute;inset:2px;border-radius:50%;box-shadow:0 0 0 1.5px currentColor;opacity:0}
.hbg.beat .ring{animation:beat var(--hb-pulse) var(--ease-out) 1}
@keyframes beat{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
.hb.big{font-size:var(--fs-body);line-height:var(--lh-body)}
.hb.big .hbg{width:18px;height:18px}

/* The heartbeat strip: the signature element */
.hbs{display:flex;align-items:flex-end;gap:var(--hb-gap);height:var(--hb-h);overflow:hidden;flex:none}
.hbs i{display:block;width:var(--hb-bar-w);border-radius:1.5px;background:var(--hb-bar);flex:none;transition:height var(--dur-short) var(--ease-out)}
.hbs i.idle{height:2px!important;background:var(--hb-bar-idle)}
.hbs i.miss{background:var(--hb-bar-miss)}
.hbs i.now{background:var(--hb-bar-now)}
.hbs.sm{--hb-h:16px;--hb-bar-w:2px}
.hbs-wrap{display:grid;gap:4px}
.hbs-axis{display:flex;justify-content:space-between;font-size:11px;line-height:14px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ---------------- Session avatars (flat, eyes only) ---------------- */
.av{display:inline-block;flex:none;position:relative}
.av svg{display:block;width:100%;height:100%;overflow:visible}
.av .eyes{transition:transform var(--dur-move) var(--spring-smooth)}
.av .orb{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--bg-surface);display:grid;place-items:center}
.av .orb::before{content:"";width:8px;height:8px;border-radius:50%;background:conic-gradient(from 0deg,var(--agent-ink),transparent 70%);-webkit-mask:radial-gradient(circle,transparent 2px,#000 2.5px);mask:radial-gradient(circle,transparent 2px,#000 2.5px);animation:spin 1.1s linear infinite}
.av .bdg{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg-surface)}
.av .bdg.attn{background:var(--attn-fill);color:var(--on-attn)}
.av .bdg.danger{background:var(--danger-fill);color:#fff}
.av .bdg.calm{background:var(--bg-sunken);color:var(--text-2)}
.av .bdg.ok{background:var(--ok-fill);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- Needs-you card (one pattern: popover, Today, toast landing) ---------------- */
.need{background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-1);padding:16px 18px;display:grid;gap:10px;position:relative;transition:opacity var(--dur-short) var(--ease-color)}
.need .nh{display:flex;align-items:center;gap:10px;min-width:0}
.need .nh .who{font-weight:600;font-size:var(--fs-sub)}
.need .nh .when{font-size:var(--fs-meta);color:var(--text-3);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.need .ev{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:var(--fs-sub);color:var(--text-2)}
.need .cons{font-size:var(--fs-sub);color:var(--text-2)}
.need .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.need .acts .sp{flex:1}
.need.compact{padding:12px 14px;gap:8px;border-radius:var(--r-sm);background:var(--cmp-flyout-card)}
.need.compact .cmd{font-size:12px;padding:3px 8px;line-height:18px}
.need.resolved{padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:var(--fs-sub);color:var(--text-2)}
.need.resolved .sp{flex:1}
.need.flash{animation:flash 900ms var(--ease-out) 1}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--focus)}100%{box-shadow:var(--elev-1)}}

/* Suggested-rule chip: the intelligence deposit on a needs-you card */
.srchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-full);font-size:var(--fs-meta);color:var(--text-2);background:var(--bg-sunken);position:relative}
.srchip::after{content:"";position:absolute;inset:-4px}
.srchip:hover{color:var(--text-1)}
.srchip b{font-weight:600;color:var(--text-1)}

/* ---------------- Session rows ---------------- */
.srow{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 16px;min-height:var(--row-2)}
.srow .sname{display:grid;min-width:0}
.srow .sname b{font-weight:600;font-size:var(--fs-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sname span{font-size:var(--fs-meta);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sguard{font-size:var(--fs-meta);color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.srow .stok{font-size:var(--fs-meta);color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow.p{grid-template-columns:28px minmax(0,1fr) 170px 120px}
.srow.unguarded{background:var(--danger-tint)}

/* ---------------- Log row (one pattern for blocks, warnings, tripwire, guard changes) ---------------- */
.log{display:grid}
.lrow{display:grid;grid-template-columns:20px 64px 92px minmax(0,1.3fr) minmax(0,1fr) 24px;align-items:center;gap:12px;padding:0 16px;min-height:44px;font-size:var(--fs-sub);text-align:left;width:100%}
.lrow:hover{background:var(--state-hover)}
.lrow:focus-visible{border-radius:0;outline-offset:-2px}
.lrow .lt{font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
.lrow .ls{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lw{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ly{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .chev{color:var(--text-3);transition:transform var(--dur-short) var(--ease-out)}
.lrow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lk{display:grid;place-items:center}
.lk.block{color:var(--text-1)} .lk.warn{color:var(--sev-attn)} .lk.trip,.lk.off{color:var(--sev-danger)} .lk.on{color:var(--sev-ok)}
.ldet{padding:4px 16px 16px 108px;display:grid;gap:10px;font-size:var(--fs-sub);color:var(--text-2)}
.ldet dl{display:grid;grid-template-columns:120px 1fr;gap:6px 16px;margin:0}
.ldet dt{color:var(--text-3)} .ldet dd{margin:0;color:var(--text-1)}
.lhead{display:grid;grid-template-columns:20px 64px 92px minmax(0,1.3fr) minmax(0,1fr) 24px;gap:12px;padding:10px 16px 6px;font-size:var(--fs-meta);color:var(--text-3)}

/* ---------------- Tray popover (a flyout: solid, anchored, light-dismiss) ---------------- */
.flyout{position:absolute;right:12px;bottom:calc(var(--os-taskbar-h) + 12px);width:var(--cmp-flyout-w);max-height:var(--cmp-flyout-max-h);background:var(--cmp-flyout);border-radius:var(--os-radius-window);box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;color:var(--text-1);z-index:50}
.flyout.enter{animation:flyIn var(--cmp-flyout-in) var(--ease-out) both}
@keyframes flyIn{from{opacity:0;transform:translateY(var(--rise))}}
.fly-status{display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left;width:100%}
.fly-status:hover{background:var(--state-hover)}
.fly-status:focus-visible{border-radius:0;outline-offset:-2px}
.fly-status .chev{margin-left:auto;color:var(--text-3)}
.fly-status.danger{background:var(--danger-tint)}
.fly-status.attn{background:var(--attn-tint)}
.fly-sec{padding:4px 12px 12px;display:grid;gap:8px}
.fly-sech{display:flex;align-items:center;gap:8px;padding:8px 4px 0;font-size:var(--fs-meta);font-weight:600;color:var(--text-2)}
.fly-sech .sp{flex:1}
.fly-scroll{overflow:auto;min-height:0;scrollbar-width:thin}
.fly-sess{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;text-align:left;font-size:var(--fs-sub);color:var(--text-2);box-shadow:inset 0 1px 0 var(--line-subtle)}
.fly-sess:hover{background:var(--state-hover)}
.fly-sess:focus-visible{border-radius:0;outline-offset:-2px}
.fly-sess .avs{display:flex}
.fly-sess .avs .av+.av{margin-left:-6px}
.fly-sess .avs .av{box-shadow:0 0 0 2px var(--cmp-flyout);border-radius:50%}
.fly-sess .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fly-sess .chev{color:var(--text-3);transition:transform var(--dur-short) var(--ease-out)}
.fly-sess[aria-expanded="true"] .chev{transform:rotate(90deg)}
.fly-srow{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:7px 16px 7px 20px;font-size:var(--fs-sub)}
.fly-srow .st{font-size:var(--fs-meta);color:var(--text-3);white-space:nowrap}
.fly-usage{display:flex;align-items:center;gap:10px;padding:12px 16px;width:100%;text-align:left;font-size:var(--fs-sub);color:var(--text-2);box-shadow:inset 0 1px 0 var(--line-subtle)}
.fly-usage:hover{background:var(--state-hover)}
.fly-usage:focus-visible{border-radius:0;outline-offset:-2px}
.fly-usage .bar{flex:none;width:56px;height:4px;border-radius:2px;background:var(--cmp-meter-track);overflow:hidden}
.fly-usage .bar i{display:block;height:100%;background:var(--cmp-meter-fill);border-radius:2px}
.fly-usage .bar.close i{background:var(--cmp-meter-close)}
.fly-foot{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;box-shadow:inset 0 1px 0 var(--line);background:var(--bg-surface)}
.fly-foot .sp{flex:1}
.fly-empty{padding:4px 16px 14px;font-size:var(--fs-sub);color:var(--text-3)}
.fly-pro{padding:0 16px 12px;font-size:var(--fs-meta);color:var(--text-2)}

/* ---------------- Windows context menu (right-click on the tray icon) ---------------- */
.ctx{position:absolute;right:150px;bottom:calc(var(--os-taskbar-h) + 8px);min-width:240px;background:var(--os-surface);border-radius:var(--os-radius-menu);box-shadow:var(--os-shadow);padding:4px;font-family:var(--os-font);font-size:14px;color:var(--os-text);z-index:60}
.ctx button{display:flex;align-items:center;gap:12px;width:100%;height:34px;padding:0 12px;border-radius:var(--os-radius-item);text-align:left;color:var(--os-text)}
.ctx button:hover,.ctx button:focus-visible{background:var(--os-hover);outline:none}
.ctx .sepr{height:1px;margin:4px 0;background:var(--os-surface-line)}
.ctx .sub{margin-left:auto;color:var(--os-text-3)}
.ctx .muted{color:var(--os-text-3);font-size:12px;padding:6px 12px 2px}

/* ---------------- Windows toasts (drawn by Windows; we design the content) ---------------- */
.toasts{position:absolute;right:12px;bottom:calc(var(--os-taskbar-h) + 12px);display:flex;flex-direction:column;gap:8px;z-index:70;width:var(--os-toast-w)}
.wt{background:var(--os-surface);border-radius:var(--os-radius-window);box-shadow:var(--os-shadow);font-family:var(--os-font);color:var(--os-text);padding:12px 14px 14px;display:grid;gap:8px;position:relative;animation:toastIn var(--cmp-toast-in) var(--spring-smooth) both}
.wt.out{animation:toastOut var(--dur-short) var(--ease-exit) both}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.wt-app{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--os-text-2)}
.wt-app .x{margin-left:auto;width:28px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--os-text-2)}
.wt-app .x:hover{background:var(--os-hover)}
.wt-main{display:grid;gap:2px}
.wt-title{font-size:14px;font-weight:600;line-height:20px}
.wt-body{font-size:14px;line-height:20px;color:var(--os-text-2)}
.wt-body code{font-family:"Cascadia Mono",var(--font-mono);font-size:13px;color:var(--os-text)}
.wt-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:4px}
.wt-acts button{height:32px;border-radius:4px;background:var(--os-button);box-shadow:inset 0 0 0 1px var(--os-button-line);font-size:14px;color:var(--os-text)}
.wt-acts button:hover{filter:brightness(1.15)}
.wt-acts button.pri{background:var(--os-accent);color:var(--os-accent-text);box-shadow:none}
.wt-time{font-size:12px;color:var(--os-text-3)}
.wt.urgent{box-shadow:var(--os-shadow),inset 3px 0 0 var(--tray-slash)}

/* In-app toast with Undo (DESIGN-SYSTEM §11.13), inside the window */
.itoast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bg-inverse);color:var(--text-inverse);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-3);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:var(--fs-sub);z-index:40;max-width:440px;animation:itIn var(--dur-move) var(--spring-smooth) both;overflow:hidden}
.itoast button{color:var(--cobalt-300);font-weight:600;padding:6px 10px;border-radius:var(--r-full)}
:root[data-theme="light"] .itoast button{color:#a9bbff}
.itoast button:hover{background:rgb(255 255 255/.08)}
.itoast .timer{position:absolute;left:0;bottom:0;height:2px;background:rgb(255 255 255/.35);animation:shrink var(--cmp-undo) linear both;transform-origin:left}
@keyframes itIn{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes shrink{to{transform:scaleX(0)}}

/* ---------------- First-run window ---------------- */
.frbody{flex:1;display:flex;flex-direction:column;background:var(--bg-ground);border-top-left-radius:0;min-height:0;position:relative}
.frsteps{display:flex;align-items:center;gap:10px;padding:16px 32px 0;font-size:var(--fs-meta);color:var(--text-3)}
.frsteps .bars{display:flex;gap:4px}
.frsteps .bars i{width:20px;height:3px;border-radius:2px;background:rgb(var(--ink-rgb)/.14)}
.frsteps .bars i.on{background:var(--text-1)}
.frmain{flex:1;padding:20px 32px 0;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
.frfoot{display:flex;align-items:center;gap:8px;padding:16px 32px 24px}
.frfoot .sp{flex:1}
.frmark{width:28px;height:28px;color:var(--mark)}
.lede{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-2);max-width:56ch;text-wrap:pretty}

/* The checklist (one component: detection, protection install, diagnostic) */
.chk{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.chk li{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;min-height:32px;font-size:var(--fs-sub)}
.chk li .ci{display:grid;place-items:center;color:var(--text-3)}
.chk li[data-s="ok"] .ci{color:var(--sev-ok)}
.chk li[data-s="warn"] .ci{color:var(--sev-attn)}
.chk li[data-s="bad"] .ci{color:var(--sev-danger)}
.chk li[data-s="wait"] .ci svg{animation:spin 900ms linear infinite}
.chk li[data-s="wait"]{color:var(--text-3)}
.chk li.in{animation:rowIn var(--dur-move) var(--spring-smooth) both}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}}
.chk .li-w{font-size:var(--fs-meta);font-weight:600}
.chk li[data-s="ok"] .li-w{color:var(--sev-ok)} .chk li[data-s="warn"] .li-w{color:var(--sev-attn)} .chk li[data-s="bad"] .li-w{color:var(--sev-danger)}

/* Retro cards */
.retro{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-1);padding:16px 18px;display:grid;gap:10px;align-content:start}
.rc.in{animation:cardIn var(--dur-scene) var(--spring-smooth) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.rc .rch{font-size:var(--fs-sub);font-weight:600}
.rc .rcb{font-size:var(--fs-sub);color:var(--text-2)}
.days{display:flex;align-items:flex-end;gap:6px;height:52px}
.days i{flex:1;border-radius:3px 3px 1px 1px;background:var(--hb-bar)}
.days i.top{background:var(--text-1)}
.daysl{display:flex;gap:6px;font-size:11px;color:var(--text-3)}
.daysl span{flex:1;text-align:center}
.rcl{display:grid;gap:6px}
.rcl .ri{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--fs-meta);color:var(--text-3)}

/* Suggested-rule row (first run and Rules) */
.sr-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0}
.sr-row+.sr-row{box-shadow:inset 0 1px 0 var(--line-subtle)}
.sr-row .srm{display:grid;gap:4px;min-width:0}
.sr-row .srm .t-meta{color:var(--text-3)}
.sr-row.off{opacity:.62}
.sr-row.off .cmdt{text-decoration:none}
.cb{appearance:none;width:18px;height:18px;margin:1px 0 0;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line-control);display:grid;place-items:center;cursor:pointer;background:var(--bg-surface)}
.cb:checked{background:var(--text-1);box-shadow:none}
.cb:checked::after{content:"";width:9px;height:5px;border:2px solid var(--text-on-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.cb:disabled{cursor:not-allowed;background:var(--bg-sunken)}
.cb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* UAC (Windows secure desktop, illustration) */
.uac-scrim{position:absolute;inset:0;background:var(--os-secure-desktop);display:grid;place-items:center;z-index:80;animation:fade var(--dur-short) ease both}
@keyframes fade{from{opacity:0}}
.uac{width:456px;background:var(--os-surface);border-radius:8px;box-shadow:var(--os-shadow);font-family:var(--os-font);color:var(--os-text);overflow:hidden}
.uac-h{padding:20px 24px 4px;font-size:14px;color:var(--os-text-2)}
.uac-b{padding:8px 24px 20px;display:grid;gap:14px}
.uac-q{font-size:20px;line-height:28px;font-weight:600}
.uac-app{display:flex;gap:12px;align-items:center;font-size:14px}
.uac-meta{font-size:13px;color:var(--os-text-2);display:grid;gap:2px}
.uac-f{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:20px 24px;background:rgb(var(--ink-rgb)/.03);box-shadow:inset 0 1px 0 var(--os-surface-line)}
.uac-f button{height:32px;border-radius:4px;background:var(--os-button);box-shadow:inset 0 0 0 1px var(--os-button-line);font-size:14px}
.uac-f button.pri{background:var(--os-accent);color:var(--os-accent-text);box-shadow:none}
.uac-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;color:rgb(255 255 255/.6);font-family:var(--os-font)}

/* Canary live log */
.clog{display:grid;gap:8px;background:var(--bg-surface);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-1);padding:18px 20px;font-size:var(--fs-sub)}
.clog .cl{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;color:var(--text-2)}
.clog .cl.in{animation:rowIn var(--dur-move) var(--spring-smooth) both}
.clog .cl.blk{color:var(--text-1)}
.clog .cl.blk .bk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--text-1);color:var(--text-on-ink)}
.clog .cl.blk.land .bk{animation:land 520ms var(--spring-gentle) both}
@keyframes land{from{transform:scale(.4);opacity:0}}

/* Pinning helper illustration */
.pinill{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r-md);corner-shape:var(--corner);background:var(--bg-surface);box-shadow:var(--elev-1)}
.pinill .tbmini{display:flex;align-items:center;gap:2px;height:40px;padding:0 6px;border-radius:6px;background:var(--os-taskbar);font-family:var(--os-font);font-size:11px;color:var(--os-text)}
.pinill .tbmini .tray-btn{height:32px}
.pinill .tbmini .arrow{color:var(--os-text-2);padding:0 6px}
.pinill .tbmini .hl{box-shadow:0 0 0 1.5px var(--os-accent);border-radius:4px}

/* ---------------- Usage ---------------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{padding:18px 20px;display:grid;gap:10px}
.meter .mh{display:flex;align-items:baseline;gap:8px}
.meter .mh .t-meta{margin-left:auto;color:var(--text-3)}
.meter .fig{font-size:var(--fs-headline);line-height:var(--lh-headline);letter-spacing:var(--ls-headline);font-weight:600;font-variant-numeric:tabular-nums}
.mbar{position:relative;height:6px;border-radius:3px;background:var(--cmp-meter-track)}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--cmp-meter-fill);transition:width var(--dur-scene) var(--spring-smooth)}
.mbar .fc{position:absolute;inset:0 auto 0 0;border-radius:3px;background:repeating-linear-gradient(90deg,rgb(var(--ink-rgb)/.28) 0 3px,transparent 3px 6px)}
.mbar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--cmp-meter-tick)}
.mbar.close i{background:var(--cmp-meter-close)}
.mends{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.fcast{font-size:var(--fs-sub);color:var(--text-2);text-wrap:pretty}
.fcast b{color:var(--text-1);font-weight:600}
.ledger{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.ledger th{font-size:var(--fs-meta);font-weight:400;color:var(--text-3);text-align:left;padding:10px 16px 6px}
.ledger td{padding:0 16px;height:44px;box-shadow:inset 0 1px 0 var(--line-subtle);white-space:nowrap}
.ledger .r{text-align:right;font-variant-numeric:tabular-nums}
.ledger td .cellname{display:flex;align-items:center;gap:10px}
.ledger tfoot td{font-weight:600}
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-full);padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-meta);font-weight:600;color:var(--text-2)}
.seg button[aria-checked="true"]{background:var(--seg-on);color:var(--text-1);box-shadow:0 0 0 1px rgb(var(--ink-rgb)/.06),0 1px 2px rgb(0 0 0/.12)}

/* Pro line: a single Text 2 line with a text link (no pills, no gold) */
.pro{font-size:var(--fs-sub);color:var(--text-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pro .x{color:var(--text-3);font-size:var(--fs-meta)}
.pro .x:hover{color:var(--text-1)}

/* ---------------- Rules ---------------- */
.limits{display:flex;align-items:center;gap:12px;padding:14px 18px;width:100%;text-align:left}
.limits:hover{background:var(--state-hover)}
.limits .chev{margin-left:auto;color:var(--text-3);transition:transform var(--dur-short) var(--ease-out)}
.limits[aria-expanded="true"] .chev{transform:rotate(90deg)}
.limits:focus-visible{border-radius:var(--r-md)}
.limdet{padding:0 18px 16px 50px;display:grid;gap:12px;font-size:var(--fs-sub);color:var(--text-2)}
.limdet .lg{display:grid;grid-template-columns:150px 1fr;gap:6px 16px}
.limdet .lg b{color:var(--text-1);font-weight:600}
.promise{font-size:var(--fs-sub);color:var(--text-1);font-weight:600;text-wrap:pretty}
.gap{font-size:var(--fs-sub);color:var(--text-2)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 18px}
.rule .rm{display:grid;gap:3px;min-width:0}
.rule .rm .t-meta{color:var(--text-3)}
.sw{appearance:none;width:36px;height:22px;border-radius:11px;background:var(--sw-track);position:relative;cursor:pointer;transition:background-color var(--dur-micro) var(--ease-color);margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--sw-knob);transition:transform var(--dur-move) var(--spring-snappy)}
.sw:checked{background:var(--text-1)}
.sw:checked::after{transform:translateX(14px);background:var(--sw-knob-on)}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sugg{padding:4px 18px}
.preview{margin:4px 0 12px 32px;padding:14px 16px;border-radius:var(--r-sm);background:var(--bg-sunken);display:grid;gap:10px;font-size:var(--fs-sub);animation:rowIn var(--dur-move) var(--spring-smooth) both}
.preview .pa{display:flex;gap:8px;align-items:center}

/* ---------------- Protection ---------------- */
.pstat{padding:20px 22px;display:grid;gap:16px}
.pstat .ps-top{display:flex;align-items:flex-start;gap:16px}
.pstat .ps-top .grow{flex:1;display:grid;gap:6px}
.pstat .facts{display:flex;flex-wrap:wrap;gap:6px 0;font-size:var(--fs-meta);color:var(--text-2)}
.pstat.danger{box-shadow:inset 0 0 0 1px rgb(255 120 115/.35)}
.pstat.attn{box-shadow:inset 0 0 0 1px rgb(240 180 90/.3)}
:root[data-theme="light"] .pstat.danger{box-shadow:inset 0 0 0 1px rgb(192 38 45/.35)}
:root[data-theme="light"] .pstat.attn{box-shadow:inset 0 0 0 1px rgb(138 83 0/.3)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cant{padding:0}
.cant summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-size:var(--fs-sub);font-weight:600;border-radius:var(--r-md)}
.cant summary::-webkit-details-marker{display:none}
.cant summary:hover{background:var(--state-hover)}
.cant summary .chev{margin-left:auto;color:var(--text-3);transition:transform var(--dur-short) var(--ease-out)}
.cant[open] summary .chev{transform:rotate(90deg)}
.cant ul{margin:0;padding:0 18px 16px 46px;display:grid;gap:6px;font-size:var(--fs-sub);color:var(--text-2)}

/* Banner (in-window, one per screen at most) */
.banner{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-radius:var(--r-md);corner-shape:var(--corner);font-size:var(--fs-sub)}
.banner.danger{background:var(--danger-tint);color:var(--text-1)}
.banner.attn{background:var(--attn-tint);color:var(--text-1)}
.banner .bi{padding-top:1px}
.banner.danger .bi{color:var(--sev-danger)} .banner.attn .bi{color:var(--sev-attn)}
.banner .bt{flex:1;display:grid;gap:4px}
.banner .bt b{font-weight:600}
.banner .ba{display:flex;gap:8px;flex:none;align-items:center}

/* ---------------- Same-file card ---------------- */
.same .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.same .who2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg-sunken);font-size:var(--fs-meta);color:var(--text-2)}
.same .who2 b{color:var(--text-1);font-size:var(--fs-sub);font-weight:600;display:block}

/* ---------------- Tripwire (the one modal-weight moment) ---------------- */
.trip-scrim{position:absolute;inset:0;background:var(--cmp-scrim-trip);display:grid;place-items:center;z-index:30;animation:fade var(--dur-short) ease both;padding:24px}
.trip{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--bg-raised);border-radius:var(--r-md);corner-shape:var(--corner);box-shadow:var(--elev-4);padding:24px 26px;display:grid;gap:18px;animation:cardIn var(--dur-scene) var(--spring-smooth) both}
.trip .tr-h{display:flex;align-items:center;gap:12px}
.trip .count{font-size:var(--cmp-trip-count);line-height:var(--lh-display);letter-spacing:var(--ls-display);font-weight:600;font-variant-numeric:tabular-nums}
.trip .count.live{color:var(--sev-danger)}
.trip .clabel{font-size:var(--fs-sub);color:var(--text-2)}
.trip .live-dot{width:8px;height:8px;border-radius:50%;background:var(--sev-danger);animation:blinkdot 1s steps(2,end) infinite}
@keyframes blinkdot{50%{opacity:.25}}
.folders{display:grid;font-size:var(--fs-sub)}
.folders>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;box-shadow:inset 0 1px 0 var(--line-subtle)}
.folders code{font-size:12.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{margin:0;padding:0 0 0 20px;display:grid;gap:6px;font-size:var(--fs-sub);color:var(--text-2)}
.steps b{color:var(--text-1);font-weight:600}

/* ---------------- Diagnostic report ---------------- */
.diag .chk li{grid-template-columns:20px 220px 1fr;font-size:var(--fs-sub)}
.diag .chk li .dv{color:var(--text-2);font-size:var(--fs-sub)}

/* ---------------- Settings ---------------- */
.set{display:grid}
.set .srw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px}
.set .srw+.srw{box-shadow:inset 0 1px 0 var(--line-subtle)}
.set .srw .st{display:grid;gap:2px}
.set .srw .st b{font-size:var(--fs-sub);font-weight:600}
.set .srw .st span{font-size:var(--fs-meta);color:var(--text-2)}
.setnav{display:flex;gap:6px;flex-wrap:wrap}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reads ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:var(--fs-sub);color:var(--text-2)}

/* ---------------- Sheets (tray states, components) ---------------- */
.sheet{position:absolute;inset:24px;overflow:auto;background:var(--bg-ground);border-radius:12px;padding:28px 32px;display:grid;gap:24px;align-content:start;box-shadow:0 0 0 1px rgb(var(--ink-rgb)/.08)}
.traygrid{display:grid;grid-template-columns:180px repeat(6,1fr);gap:0;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--elev-1)}
.traygrid>div{padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;font-size:var(--fs-meta);text-align:center}
.traygrid .rh{justify-content:flex-start;color:var(--text-2);background:var(--bg-surface)}
.traygrid .ch{background:var(--bg-surface);color:var(--text-1);font-weight:600;flex-direction:column;gap:2px}
.traygrid .ch span{font-weight:400;color:var(--text-3)}
.traygrid .os{font-family:var(--os-font)}
.traygrid .cell-dark{background:#1c1c1c}
.traygrid .cell-light{background:#eeeeee}
.traygrid .cell-hc{background:#000}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tips .tip{background:var(--bg-surface);border-radius:var(--r-sm);padding:12px 14px;font-size:var(--fs-meta);color:var(--text-2);display:grid;gap:6px}
.tips .tip b{color:var(--text-1);font-weight:600;font-size:var(--fs-sub)}

/* Loading skeleton (no shimmer, real sizes) */
.skel{display:block;height:12px;border-radius:6px;background:var(--bg-sunken)}

/* Eye-follow / glance (BRAND §5 job 3) */
.av.glance .eyes{transform:translate(4px,3px)}

/* ---------------- Reduced motion ---------------- */
html.rm *,html.rm *::before,html.rm *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
html.rm .av .orb::before{animation:none;background:var(--agent-ink)}
html.rm .hbg .ring{display:none}
@media (prefers-reduced-motion: reduce){
  .av .orb::before{animation:none;background:var(--agent-ink)}
  .hbg .ring{display:none}
  .trip .live-dot{animation:none}
}

/* v0.1 render fixes */
.hb.stack{align-items:flex-start}
.hb.stack .hbg{margin-top:1px}
.hbs.fill i{flex:1 1 0;width:auto;min-width:2px}
.srow.p{grid-template-columns:28px minmax(0,1fr) 150px 220px}
.srow .sguard span{white-space:normal}
.retro.compact{gap:10px}
.retro.compact .rc{padding:12px 14px;gap:6px}
.retro.compact .days{height:34px}
.retro.compact .rcl{gap:2px}
.retro.compact .rcl .cmd{background:none;padding:0;font-size:12px;line-height:18px}
.retro.compact .rcb{font-size:var(--fs-meta);line-height:var(--lh-meta)}

</style>
</head>

      <span style="font-size:12px;color:#8a8a8a">D-3 (code signing) changes no screen: the UAC prompt shows a verified publisher only once signed.</span>
    </div>
  </details>
</header>
<div id="stage" data-os-theme="dark">

<script>

let AC = null;
document.addEventListener("pointerdown", () => { if (!AC) try { AC = new AudioContext(); } catch (e) { /* no audio here */ } }, { once: true });
function tone(freqs, dur) {
  if (!S.sound || !AC) return;
  const t0 = AC.currentTime, g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 2400; g.connect(f); f.connect(AC.destination);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18 * 0.7, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  freqs.forEach((fr, i) => { const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = fr; o.connect(g); o.start(t0 + i * (dur / freqs.length / 1.4)); o.stop(t0 + dur); });
}

  const attnAct = tone === "attn" ? `<div class="fly-sec" style="padding-top:12px"><div style="display:flex;gap:8px">${g === "user_level" ? `<button class="btn sec sm" data-act="uac-again">Use admin</button>` : `<button class="btn sec sm" data-act="canary">Run the test</button>`}</div></div>` : "";

  const sessLine = S.sessions.map(s => `${s.name} ${STATE_WORD[s.state].toLowerCase()}`).join(" · ");

    ${fix}${attnAct}

    ${S.v.sessOpen ? S.sessions.slice(0, four ? 3 : 9).map(s => `<div class="fly-srow">${avFor(s, 20)}<span>${esc(s.name)} <span class="t3 t-meta">· ${fmt(s.tok)} tokens</span></span><span class="st">${s.state === "needs" ? `<span class="attn">Needs you</span>` : STATE_WORD[s.state]} · ${S.guard === "not_guarded" && s.id === "bench" ? `<span class="danger">Not guarded</span>` : s.state === "idle" ? "ready" : "Guarded"}</span></div>`).join("") + (four ? `<p class="fly-pro">All 4 are guarded. Details for 3 on the free plan.</p>` : "") : ""}`}

/* ---------------- Live heartbeat: evidence, not a timer ---------------- */
function tickAgo() {

}
function scheduleCheck() {
  const wait = 1200 + Math.random() * 2600;
  setTimeout(() => {
    if (["guarded", "user_level"].includes(S.guard) && !S.v.empty && !S.freeze) {
      lastCheck = Date.now(); tickAgo();

      $$(".hbs[data-strip]").forEach(st => { const bars = $$("i", st); if (!bars.length || st.closest("[data-nolive]")) return; const last = bars[bars.length - 1]; if (last.classList.contains("miss") || last.classList.contains("idle")) return; last.style.height = Math.min(100, (parseFloat(last.style.height) || 30) + 12) + "%"; });
    }

}
setInterval(tickAgo, 1000);
/* Every 10 s the strip shifts one slot left: the oldest bar leaves, a new slot starts on the right */
setInterval(() => {
  if (S.freeze) return;
  $$(".hbs[data-strip]").forEach(st => {
    const bars = $$("i", st); if (bars.length < 2) return;
    const last = bars[bars.length - 1]; if (last.classList.contains("miss")) return;
    const live = ["guarded", "user_level"].includes(S.guard) && !last.classList.contains("idle");
    last.classList.remove("now"); bars[0].remove();
    const n = document.createElement("i"); if (live) { n.className = "now"; n.style.height = "30%"; } else n.className = "idle";
    st.append(n);
  });
}, 10000);

function route(hash, keepDecisions = true) {
  const k = (hash || "").replace(/^#/, "") || "today";
  reset(); S.d = { ...S.dBase };
  (ROUTES[k] || ROUTES.today)();
  render(); syncDemo(k);
}
let tripTimer;
function tripRun() {
  clearInterval(tripTimer);
  tripTimer = setInterval(() => {
    if (S.v.trip !== "live") return clearInterval(tripTimer);
    if (S.freeze) return;
    S.v.tripCount += Math.round(3 + Math.random() * 9);
    const c = $("[data-tripcount]"); if (c) c.textContent = fmt(S.v.tripCount);
  }, 260);
}

/* ---------------- Boot ---------------- */
(function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get("bar") === "0") root.classList.add("clean");
  if (q.get("theme") === "light") root.setAttribute("data-theme", "light");
  if (q.get("os") === "light") S.osTheme = "light";
  if (q.get("rm") === "1") root.classList.add("rm");
  if (q.get("freeze") === "1") S.freeze = true;
  ["d1", "d2", "d4", "d5"].forEach(x => { if (q.get(x)) S.dBase[x] = q.get(x); });
  if (q.get("s2")) S.dBase.s2 = q.get("s2") === "1";
  initDemo();
  route(location.hash);
  scheduleCheck();
  window.addEventListener("hashchange", () => route(location.hash));

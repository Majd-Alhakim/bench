name: Bug report
description: Something in Eucas doesn't work as expected
labels: [bug]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues
          required: true
        - label: I removed secrets, tokens and private content from logs and screenshots
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create agent… 2. …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Eucas version, `claude --version`, OS
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace / logs (redacted)
      render: text

name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organization repos; the gitleaks CLI (MIT) doesn't.
      - name: Install gitleaks 8.30.1 (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # PRs: only the PR's commits. Pushes and manual runs: the full history.
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks git --redact --verbose --exit-code 1 --log-opts="origin/$BASE_REF..HEAD" .
          else
            ./gitleaks git --redact --verbose --exit-code 1 .
          fi

  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are capacity-limited and bill 10x on private repos: PRs run Windows + Ubuntu,
        # pushes to dev, staging and main and manual runs add macOS. Revisit in S1-1 (macOS on PRs that touch packaging).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","ubuntu-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app
        shell: bash
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'false'
        run: echo "No package.json yet (Sprint 0, docs only); build/test steps start in S1-1."
      - if: steps.app.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.present == 'true'
        run: pnpm lint
      - if: steps.app.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.app.outputs.present == 'true'
        run: pnpm test
      - if: steps.app.outputs.present == 'true'
        run: pnpm build
      - if: steps.app.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        run: pnpm audit --audit-level high

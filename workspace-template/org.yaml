# Starter org. Edit freely; the app hot-reloads it.
company: My AI Startup
founder: me

agents:
  - id: chief-of-staff      # your daily assistant (cheap)
    reports_to: me
  - id: ceo
    reports_to: me
  - id: cto
    reports_to: ceo
  - id: cpo
    reports_to: ceo
  - id: cmo
    reports_to: ceo

groups:
  - id: c-suite
    name: Leadership
    members: [ceo, cto, cpo, cmo]

rules:
  # who may hand off work to whom (down or sideways, never up without asking)
  handoff: down-and-sideways
  max_delegation_depth: 3

<!doctype html>
<html><head><meta charset="utf-8"><title>notch</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #pill { position: absolute; left: 20px; top: 0; width: 220px; height: 34px; border-radius: 0 0 16px 16px;
    background: #0b0c0f; display: flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer;
    transition: transform 160ms ease; }
  #pill.hover { transform: scaleY(1.08); }
  .eye { width: 14px; height: 14px; border-radius: 50%; background: #e8e8e8; position: relative; transition: transform 80ms; }
  .blink .eye { transform: scaleY(0.1); }
  .pupil { width: 6px; height: 6px; border-radius: 50%; background: #0b0c0f; position: absolute; left: 4px; top: 4px; }
</style></head>
<body><div id="pill"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div>
<script>
  const T = window.__TAURI__;
  const pill = document.getElementById("pill");
  const pupils = [...document.querySelectorAll(".pupil")];
  // Eye-follow: the cursor offset comes from Rust's 30 Hz poll; pupils move at most 3 px.
  T.event.listen("cursor", ({ payload: [dx, dy] }) => {
    const d = Math.hypot(dx, dy) || 1, k = Math.min(3, d / 60);
    for (const p of pupils) p.style.transform = `translate(${(dx / d) * k}px, ${(dy / d) * k}px)`;
  });
  T.event.listen("hover", ({ payload }) => pill.classList.toggle("hover", payload));
  pill.addEventListener("mouseenter", () => pill.classList.add("hover"));
  pill.addEventListener("mouseleave", () => pill.classList.remove("hover"));
  pill.addEventListener("click", () => T.core.invoke("open_panel"));
  // A blink every 4 s as a 160 ms class flip, not an infinite CSS animation (that keeps the compositor at 60 fps).
  setInterval(() => {
    pill.classList.add("blink");
    setTimeout(() => pill.classList.remove("blink"), 160);
  }, 4000);
</script></body></html>

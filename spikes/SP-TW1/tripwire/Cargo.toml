[package]
name = "tripwire-spike"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "tripwire"
path = "src/main.rs"

[dependencies]
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[profile.release]
opt-level = 3
